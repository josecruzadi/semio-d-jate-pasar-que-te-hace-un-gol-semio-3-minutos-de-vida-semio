<style>
/* Layout: una columna de lectura (máx. 860px) con barra de módulos fija arriba; guía y banco alternan por pestañas. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --surface-2:#E9EBF7; --ink:#14162B; --muted:#5B5F7E; --line:#D9DCEE;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#E0E1FB; --ok:#15803D; --ok-soft:#DCF3E3; --bad:#BE123C; --bad-soft:#FDE2E8;
  --warn:#A15C07; --warn-soft:#FBEFD5; --mark:#FFF0A8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1020; --surface:#171A30; --surface-2:#20243F; --ink:#E8E9F7; --muted:#9A9EC4; --line:#2E3355;
  --accent:#8B93FF; --accent-ink:#0E1020; --accent-soft:#252A5C; --ok:#4ADE80; --ok-soft:#14301F; --bad:#FB7185; --bad-soft:#3B1520;
  --warn:#F0B454; --warn-soft:#38290F; --mark:#4A4012; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1020; --surface:#171A30; --surface-2:#20243F; --ink:#E8E9F7; --muted:#9A9EC4; --line:#2E3355;
  --accent:#8B93FF; --accent-ink:#0E1020; --accent-soft:#252A5C; --ok:#4ADE80; --ok-soft:#14301F; --bad:#FB7185; --bad-soft:#3B1520;
  --warn:#F0B454; --warn-soft:#38290F; --mark:#4A4012; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.count b{color:var(--accent)}
nav.mods{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
nav.mods::-webkit-scrollbar{display:none}
nav.mods button{flex:0 0 auto;font:600 .88rem var(--f-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 9px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.mods button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.mods button .n{font-family:var(--f-mono);font-size:.7rem;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 6px}
nav.mods button:focus-visible,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.15;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;margin:28px 0 8px;text-wrap:balance}
h4{font-size:1rem;margin:16px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lede{color:var(--muted);margin-bottom:16px}
.sub{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.chip{font:600 .84rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-family:var(--f-mono);opacity:.8;margin-left:4px}
.btn{font:700 .86rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.toc button{font:600 .8rem var(--f-body);background:var(--surface-2);color:var(--ink);border:0;border-radius:6px;padding:5px 9px;cursor:pointer}
.guide section{scroll-margin-top:130px}
.guide ul{padding-left:20px;margin:0 0 12px}
.guide li{margin-bottom:4px}
.tw{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);font-weight:700}
tr:last-child td{border-bottom:0}
td b{color:var(--ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0 16px}
.box.key{border-left:4px solid var(--accent)}
.box.warn{background:var(--warn-soft);border-color:transparent}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--surface-2);color:var(--muted)}
.tag.fija{background:var(--accent-soft);color:var(--accent)}
.tag.p22{background:var(--warn-soft);color:var(--warn)}
.ref{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin:10px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h4{margin:0 0 6px;font-family:var(--f-display);font-size:1.02rem}
.fono{display:block;width:100%;max-width:300px;height:auto;margin:4px 0 8px}
.fono .ax{stroke:var(--line)} .fono .snd{stroke:var(--ink)} .fono .mur{fill:var(--accent);opacity:.75} .fono text{fill:var(--muted);font:600 9px var(--f-mono)}
.fijas{counter-reset:f;list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:8px}
.fijas li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 48px;position:relative}
.fijas li::before{counter-increment:f;content:counter(f);position:absolute;left:12px;top:9px;font:800 1.1rem var(--f-display);color:var(--accent)}
.fijas li b{display:block}
.fijas li .meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
/* Banco */
.bankbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 14px}
.score{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.score b{color:var(--ink)}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 14px}
.q .qh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.q .stem{margin:0 0 10px;white-space:pre-line}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:400 .95rem/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.opt .l{font:700 .8rem var(--f-mono);color:var(--muted);min-width:1.2em;padding-top:2px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.correct .l{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .l{color:var(--bad)}
.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:.94rem}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.bad{color:var(--bad)}
.conf{font-family:var(--f-mono);font-size:.7rem;color:var(--warn)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.plan{display:grid;gap:8px;margin:10px 0 18px}
.plan .d{display:grid;grid-template-columns:96px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.plan .d b{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);text-transform:uppercase;padding-top:2px}
.bars{display:grid;gap:6px;margin:10px 0 18px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:.88rem}
.bar .t{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .v{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.prog{display:grid;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;border-bottom:1px solid var(--line);padding:6px 0}
.prog .row span:last-child{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

/* Simulacro */
.modes{display:grid;gap:10px;margin:12px 0 18px}
.mode{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:400 .95rem/1.4 var(--f-body);color:var(--ink)}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:2px}
.mode span{color:var(--muted);font-size:.9rem}
.simbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.simbar .in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.simbar .t{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.simbar .t b{color:var(--ink)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .l{color:var(--accent)}
.qn{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--accent)}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;margin:6px 0 2px}
.big small{font-size:1.1rem;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.88rem}
@media (max-width:480px){ .bar{grid-template-columns:110px 1fr 30px} .plan .d{grid-template-columns:1fr} h2{font-size:1.38rem} }
@media (prefers-reduced-motion:no-preference){ .opt{transition:border-color .15s, background .15s} .meter i{transition:width .3s} }
</style>

<script>
window.SEMIO = {
  plan: [
    ['Lun 19', '<b>Cardio</b> (guía + banco) y <b>Respiratorio con cuello, tiroides y mamas</b>. Son 18 de 41 preguntas.'],
    ['Mar 20', '<b>Neuro</b> y <b>Osteomuscular</b>. En la noche, el <b>Parcial 2022</b> completo como simulacro.'],
    ['Mié 21', '<b>Abdomen y GU</b>, <b>Piel y cabeza</b>, <b>HC y signos vitales</b>. Repasa las falladas.'],
    ['Jue 22', 'Mañana: solo <b>fijas</b> y preguntas falladas. Nada nuevo. 3:00 pm examen, con DNI y lápiz 2B.']
  ],
  peso: [['S4 Respiratorio',10],['S5 Cardiovascular',8],['S7 Neurológico',7],['S3 Abdomen y GU',6],['S2 Piel y cabeza',5],['S6 Osteomuscular',4],['S1 HC y signos vitales',1]],
  mods: [
    {id:'cardio', name:'Cardiovascular', short:'Cardio', ready:true, lede:'Semana 5 · 8 de 41 preguntas en el parcial pasado. Guía del Argente (35-1 a 36-13) con las fijas de Bioeasy y TeamMedic.', guide:"<section id=\"c-fijas\" data-t=\"Fijas\">\n<h3>Lo que más se repite</h3>\n<p>Ranking del banco de Bioeasy (38 preguntas) cruzado con el parcial 2026-10 y el parcial 2022-02. Si solo tienes una hora, estudia esto.</p>\n<ol class=\"fijas\">\n<li><b>Estenosis aórtica</b>Soplo mesosistólico eyectivo, romboidal, rudo, en 2.º EIC derecho, irradiado a carótidas. Pulso parvus et tardus. Tríada angina, síncope y disnea de esfuerzo. Gallavardin. <span class=\"meta\">n.º 1 del banco · 8 preguntas</span></li>\n<li><b>Maniobras de auscultación</b>Pachón (decúbito lateral izquierdo, foco mitral) fue la respuesta 5 veces. Harvey, Azoulay, Rivero-Carvallo, Valsalva, Müller. <span class=\"meta\">6 preguntas</span></li>\n<li><b>Válvula tricúspide (ET e IT)</b>Todo lo derecho aumenta con la inspiración (Rivero-Carvallo) y con Müller. ET: onda a gigante. IT: onda v/s gigante, pulso venoso positivo, facies de Shattuck. Foco en 4.º EIC paraesternal izquierdo. <span class=\"meta\">5 preguntas</span></li>\n<li><b>Tipos de pulso</b>Corrigan (IA), parvus-tardus (EA), parvus-celer (IM), alternante (falla VI), paradójico (taponamiento, asma/EPOC), bigeminado (extrasístoles, digital). <span class=\"meta\">4 preguntas</span></li>\n<li><b>Insuficiencia aórtica</b>Protodiastólico aspirativo en foco de Erb, pulso de Corrigan, presión diferencial amplia, Musset, Austin Flint. <span class=\"meta\">3 preguntas · vino en 2022</span></li>\n<li><b>Ruidos y desdoblamientos</b>Fisiológico (inspiración), fijo (CIA), paradójico (BRI, EA grave), S3 = llenado rápido en ventrículo dilatado. <span class=\"meta\">3 preguntas</span></li>\n<li><b>Estenosis mitral</b>S1 aumentado, chasquido de apertura, rodada mesodiastólica con refuerzo presistólico en ápex, en Pachón. <span class=\"meta\">3 preguntas</span></li>\n<li><b>Cardiopatías congénitas</b>PCA: continuo \"en maquinaria\". CIV pequeña: soplo de Roger. CIA: desdoblamiento fijo de S2. <span class=\"meta\">3 preguntas</span></li>\n<li><b>Pericardio</b>Taponamiento: tríada de Beck, Kussmaul, pulso paradójico. Derrame: signo de Gendrin, signo de Ewart. <span class=\"meta\">vino en los 2 últimos parciales</span></li>\n<li><b>Técnica del pulso</b>En el inconsciente se palpa el carotídeo. Test de Allen para la circulación colateral de la mano. <span class=\"meta\">2 preguntas</span></li>\n</ol>\n</section>\n\n<section id=\"c-focos\" data-t=\"Focos\">\n<h3>Focos de auscultación</h3>\n<div class=\"tw\"><table>\n<tr><th>Foco</th><th>Dónde</th><th>Qué se oye mejor</th></tr>\n<tr><td><b>Aórtico</b></td><td>2.º EIC, borde esternal derecho</td><td>EA (irradia al cuello)</td></tr>\n<tr><td><b>Pulmonar</b></td><td>2.º EIC, borde esternal izquierdo</td><td>EP, desdoblamiento de S2, P2, Graham Steell, PCA</td></tr>\n<tr><td><b>Aórtico accesorio (Erb)</b></td><td>3.er EIC, borde esternal izquierdo</td><td>IA (regurgitación aórtica)</td></tr>\n<tr><td><b>Tricuspídeo</b></td><td>4.º EIC paraesternal izquierdo (Argente: parte inferior del esternón)</td><td>IT, ET</td></tr>\n<tr><td><b>Mitral o apexiano</b></td><td>5.º EIC izquierdo, línea medioclavicular</td><td>IM (irradia a axila), EM (rodada), S3, S4</td></tr>\n<tr><td><b>Mesocárdico</b></td><td>3.º y 4.º EIC sobre el esternón</td><td>CIV, tractos de salida</td></tr>\n<tr><td><b>Aorta descendente</b></td><td>Dorso izquierdo, de D3 a D12</td><td>Coartación aórtica (soplo interescapular)</td></tr>\n</table></div>\n<p>Se ausculta desde la derecha del paciente. Membrana para ruidos agudos (S1, S2, soplos de regurgitación), campana para graves (S3, S4, rodada mitral). S1 se identifica palpando el pulso carotídeo: el ruido que precede a la onda es el primero. <span class=\"ref\">Argente 35-5 · PDF 468-469</span></p>\n</section>\n\n<section id=\"c-precordio\" data-t=\"Choque de punta\">\n<h3>Inspección y palpación del precordio</h3>\n<ul>\n<li><b>Choque de punta normal:</b> 5.º EIC izquierdo, por dentro de la línea medioclavicular, no más de 2 cm de diámetro. Si no se palpa en decúbito dorsal, se pasa a <mark>decúbito lateral izquierdo (Pachón)</mark>, donde se desplaza 2 a 4 cm a la izquierda.</li>\n<li><b>Choque \"en cúpula\" de Bard</b> (bola de billar): HVI marcada (valvulopatía aórtica, HTA grave). <b>Sostenido</b>: obstáculo a la eyección (EA). <b>Amplio y breve</b>: IM. <b>\"En resorte\"</b>: EM (S1 palpable). <b>En espejo</b> (retracción sistólica): pericarditis constrictiva.</li>\n<li>HVI con hipertrofia desplaza el choque <b>hacia abajo</b>; con dilatación (IA, IM), <b>hacia afuera</b>. HVD lo desplaza hacia afuera y aparece latido paraesternal.</li>\n<li><b>Maniobra de Dressler</b> (talón de la mano en 3.º-4.º EIC paraesternal izquierdo): latido del VD hipertrófico (hipertensión pulmonar, EP).</li>\n<li><b>Complejo de la pulmonar de Chávez:</b> latido en 2.º EIC izquierdo + matidez + S2 desdoblado y palpable → hipertensión pulmonar moderada a grave.</li>\n<li><b>Signo de Gendrin:</b> choque de punta palpable <mark>por dentro</mark> del límite de matidez cardíaca → gran derrame pericárdico.</li>\n<li><b>Latidos universales:</b> diagonal directo (HVI grande), diagonal invertido (aneurisma de aorta), sagital (HVD grave), transversal \"en balancín\" (IT con FA, hígado pulsátil).</li>\n<li><b>Frémito (thrill):</b> expresión palpable de un soplo intenso; define el grado IV de Levine.</li>\n</ul>\n<p class=\"ref\">Argente 35-5 · PDF 461-467</p>\n</section>\n\n<section id=\"c-ruidos\" data-t=\"Ruidos\">\n<h3>Ruidos cardíacos</h3>\n<div class=\"tw\"><table>\n<tr><th>Ruido</th><th>Qué es</th><th>Dónde y cómo</th><th>Cuándo es patológico</th></tr>\n<tr><td><b>S1</b></td><td>Cierre mitral y tricuspídeo, inicio de la sístole (contracción isovolumétrica)</td><td>Más intenso en el ápex. Grave, 0,08-0,16 s (el más largo)</td><td>↑ EM, PR corto, hipercinesia, HTA. ↓ IM, IC, PR largo, EM calcificada. Variable en BAV completo y FA</td></tr>\n<tr><td><b>S2</b></td><td>Cierre aórtico (A2) y pulmonar (P2), fin de la sístole</td><td>Más intenso en la base. Agudo, 0,06-0,12 s</td><td>↑ A2 en HTA, ↑ P2 en hipertensión pulmonar. ↓ en EA e IA graves (A2) y en EP (P2)</td></tr>\n<tr><td><b>S3</b></td><td>Llenado ventricular rápido, protodiastólico, justo después de S2</td><td>Ápex, campana, mejor en Pachón</td><td>Normal en niños y adolescentes, raro > 40 años. Patológico en ventrículo dilatado: IM, IA grave, IC sistólica, miocardiopatía dilatada (galope ventricular)</td></tr>\n<tr><td><b>S4</b></td><td>Contracción auricular contra ventrículo rígido, presistólico, justo antes de S1</td><td>Ápex, campana</td><td>Siempre patológico: EA grave, HTA, cardiopatía isquémica, miocardiopatía hipertrófica (galope auricular). No existe en FA</td></tr>\n</table></div>\n<h4>Desdoblamientos de S2</h4>\n<div class=\"tw\"><table>\n<tr><th>Tipo</th><th>Comportamiento</th><th>Causas</th></tr>\n<tr><td><b>Fisiológico</b></td><td>Aparece en inspiración: más retorno al VD → P2 se retrasa. Mejor en foco pulmonar, en decúbito</td><td>Normal, sobre todo en jóvenes</td></tr>\n<tr><td><b>Fijo</b></td><td>Amplio y no cambia con la respiración</td><td><mark>CIA</mark></td></tr>\n<tr><td><b>Permanente no fijo</b></td><td>Presente en ambas fases, mayor en inspiración</td><td>BCRD, EP, CIV, IM</td></tr>\n<tr><td><b>Paradójico</b></td><td>Solo en espiración (A2 se retrasa y queda después de P2)</td><td><mark>BCRI</mark>, EA grave, PCA, HTA grave, WPW tipo B, marcapaso en VD</td></tr>\n<tr><td><b>Único</b></td><td>Estrecho, casi fijo, P2 muy reforzado</td><td>Hipertensión pulmonar grave</td></tr>\n</table></div>\n<p>Desdoblamiento de S1 real: BCRD, enfermedad de Ebstein. Si \"S2 desdoblado\" se oye mejor en el ápex que en la base, piensa en S3 o en chasquido de apertura (falso desdoblamiento). <span class=\"ref\">Argente 35-5, cuadros 35-5-3 y 35-5-5 · PDF 469-475</span></p>\n<h4>Ruidos agregados</h4>\n<ul>\n<li><b>Clic de eyección aórtico:</b> protosistólico, mejor en el ápex, no cambia con la respiración → válvula aórtica bicúspide (la cardiopatía congénita más frecuente) o EA no calcificada.</li>\n<li><b>Clic mesosistólico + soplo telesistólico:</b> prolapso de válvula mitral (síndrome de Barlow).</li>\n<li><b>Chasquido de apertura mitral:</b> después de S2, agudo, ápex en Pachón. <mark>Cuanto más cerca de S2, más grave la EM.</mark> El tricuspídeo aumenta con la inspiración.</li>\n<li><b>Golpe pericárdico (knock):</b> protodiastólico, agudo, más intenso que S1 y S2 → pericarditis constrictiva.</li>\n<li><b>Frote pericárdico:</b> áspero, superficial, \"cuero nuevo\", sistodiastólico (en vaivén), se refuerza al apretar el estetoscopio y con el paciente inclinado hacia adelante.</li>\n</ul>\n</section>\n\n<section id=\"c-maniobras\" data-t=\"Maniobras\">\n<h3>Maniobras de auscultación</h3>\n<div class=\"box key\"><b>Regla de los bancos UPAO:</b> Rivero-Carvallo y Müller positivos = soplo de <b>cavidades derechas</b>. Azoulay positivo = soplo de <b>cavidades izquierdas</b>. Harvey positivo = válvulas de la <b>base</b> (semilunares: aórtica y pulmonar). Pachón positivo = <b>ápex</b> (mitral). Combinando: aórtico = Azoulay + y Harvey +; mitral = Azoulay + y Pachón +; tricuspídeo = Rivero-Carvallo +.</div>\n<div class=\"tw\"><table>\n<tr><th>Maniobra</th><th>Cómo</th><th>Para qué</th></tr>\n<tr><td><b>Pachón</b></td><td>Decúbito lateral izquierdo, sin retirar el estetoscopio</td><td>Acerca el ápex: choque de punta, foco mitral, rodada de EM, IM, S3 y S4</td></tr>\n<tr><td><b>Harvey</b></td><td>Sentado, tórax inclinado hacia adelante, en espiración</td><td>Ruidos y soplos de válvulas semilunares: IA en Erb, EA, frote pericárdico</td></tr>\n<tr><td><b>Azoulay</b></td><td>Argente: sentado con los brazos elevados por encima de la cabeza</td><td>Base y frémitos aórticos. En los bancos: positivo en soplos de origen izquierdo</td></tr>\n<tr><td><b>Rivero-Carvallo</b></td><td>Inspiración profunda sostenida</td><td>Aumenta retorno al VD: suben IT, ET, EP, IP. Distingue IT (sube) de IM (no cambia)</td></tr>\n<tr><td><b>Müller</b></td><td>Inspiración forzada con glotis cerrada</td><td>Igual que Rivero-Carvallo, más intenso: suben los soplos derechos</td></tr>\n<tr><td><b>Valsalva y bipedestación</b></td><td>Espiración forzada con glotis cerrada / ponerse de pie</td><td>Bajan casi todos los soplos. <mark>Suben la miocardiopatía hipertrófica obstructiva y el prolapso mitral</mark></td></tr>\n<tr><td><b>Cuclillas y elevar piernas</b></td><td>Aumentan retorno venoso</td><td>Suben casi todos. Bajan MCH obstructiva y prolapso mitral</td></tr>\n<tr><td><b>Handgrip (apretar puños)</b></td><td>Aumenta la poscarga</td><td>Suben IM, IA y CIV. Baja la EA</td></tr>\n</table></div>\n<p class=\"ref\">Argente 35-5 · PDF 468, 477-481 · Conceptos TeamMedic p. 10</p>\n</section>\n\n<section id=\"c-soplos\" data-t=\"Soplos\">\n<h3>Soplos: intensidad y clasificación</h3>\n<div class=\"tw\"><table>\n<tr><th>Grado Levine</th><th>Argente</th><th>Clave para el examen</th></tr>\n<tr><td><b>I/VI</b></td><td>Dudoso, no todos lo escuchan</td><td>Apenas perceptible</td></tr>\n<tr><td><b>II/VI</b></td><td>Suave pero todos lo escuchan</td><td>Sin frémito</td></tr>\n<tr><td><b>III/VI</b></td><td>Intenso, sin frémito</td><td>\"Intenso no asociado a frémito\" = III</td></tr>\n<tr><td><b>IV/VI</b></td><td>Intenso <mark>con frémito</mark></td><td>Desde aquí hay thrill</td></tr>\n<tr><td><b>V/VI</b></td><td>Máximo, con el estetoscopio apoyado</td><td>Con frémito</td></tr>\n<tr><td><b>VI/VI</b></td><td>Se oye sin apoyar el estetoscopio</td><td>Con frémito</td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th></th><th>Ventrículo izquierdo</th><th>Ventrículo derecho (Rivero-Carvallo +)</th></tr>\n<tr><td><b>Sistólico eyectivo</b> (meso, romboidal)</td><td>EA</td><td>EP, CIA (hiperflujo)</td></tr>\n<tr><td><b>Sistólico regurgitante</b> (holo, en barra)</td><td>IM, CIV</td><td>IT</td></tr>\n<tr><td><b>Diastólico regurgitante</b> (proto, decreciente, agudo)</td><td>IA</td><td>IP</td></tr>\n<tr><td><b>Diastólico de llenado</b> (meso, grave, rodada)</td><td>EM</td><td>ET</td></tr>\n</table></div>\n<p><b>Soplos con nombre propio:</b> <b>Austin Flint</b> = mesodiastólico/presistólico apical por EM funcional en IA grave. <b>Carey Coombs</b> = mesodiastólico apical en carditis reumática aguda. <b>Graham Steell</b> = protodiastólico en foco pulmonar por IP secundaria a hipertensión pulmonar (EM larga). <b>Gallavardin</b> = soplo de EA que se oye musical en el ápex y simula IM. <b>Roger</b> = holosistólico muy intenso de una CIV pequeña. <b>Gibson</b> = continuo en maquinaria (PCA). <b>Soplo inocente</b>: sistólico, grado I-III, sin frémito, sin irradiación, desaparece de pie o con Valsalva (fiebre, embarazo, hipertiroidismo, anemia, atletas).</p>\n<p class=\"ref\">Argente 35-5, cuadro 35-5-6 · PDF 476-483</p>\n</section>\n\n<section id=\"c-valv\" data-t=\"Valvulopatías\">\n<h3>Valvulopatías</h3>\n<div class=\"grid2\">\n<div class=\"card\"><h4>Estenosis aórtica</h4><span data-fono=\"eyectivo-tardio\"></span>\n<p><b>Soplo:</b> mesosistólico eyectivo, romboidal, rudo, 2.º EIC derecho → cuello y carótidas. Gallavardin al ápex.<br><b>Pulso:</b> parvus et tardus (en el anciano puede ser normal o amplio).<br><b>Choque:</b> intenso y sostenido. Frémito en 2.º-3.º EIC derecho.<br><b>Clínica:</b> angina (vida media 5 a), síncope de esfuerzo (3 a), disnea (2 a).<br><b>Gravedad:</b> acmé tardío y soplo largo, A2 disminuido, desdoblamiento paradójico, S4. La intensidad NO mide gravedad.<br><b>Causa:</b> anciano = calcificación degenerativa; joven = bicúspide congénita.</p><span class=\"ref\">36-4 · PDF 527-530</span></div>\n<div class=\"card\"><h4>Insuficiencia aórtica</h4><span data-fono=\"proto\"></span>\n<p><b>Soplo:</b> protodiastólico, aspirativo (\"R susurrada\"), decreciente, foco de Erb → borde esternal izquierdo hacia ápex. Mejor sentado, inclinado, en espiración (Harvey).<br><b>Pulso:</b> magnus et celer = Corrigan, martillo de agua; bisferiens si es grave.<br><b>PA:</b> diferencial amplia (160/50).<br><b>Choque:</b> amplio, desplazado abajo y afuera.<br><b>Gravedad:</b> soplo holodiastólico, Austin Flint, S3, signo de Hill.<br><b>Causa:</b> dilatación de raíz aórtica (HTA, Marfan, sífilis); reumática; aguda por endocarditis o disección.</p><span class=\"ref\">36-4 · PDF 531-532</span></div>\n<div class=\"card\"><h4>Estenosis mitral</h4><span data-fono=\"rodada\"></span>\n<p><b>Soplo:</b> rodada (retumbo) mesodiastólica grave en ápex, con campana y en Pachón, con refuerzo presistólico si hay ritmo sinusal (se pierde en FA).<br><b>Ruidos:</b> S1 aumentado (\"chasquido de cierre\"), chasquido de apertura, P2 aumentado si hay HTP. Ritmo de Duroziez.<br><b>Clínica:</b> mujer joven con fiebre reumática, disnea, hemoptisis, FA, embolias (ACV en joven), disfonía (Ortner).<br><b>Facies mitral de Corvisart:</b> pálida con rubicundez y cianosis en mejillas y labios.<br><b>Gravedad:</b> chasquido más cerca de S2 y rodada más larga.</p><span class=\"ref\">36-4 · PDF 522-525</span></div>\n<div class=\"card\"><h4>Insuficiencia mitral</h4><span data-fono=\"holo\"></span>\n<p><b>Soplo:</b> holosistólico en barra, agudo, \"chorro de vapor\", ápex → axila. Si afecta la valva menor, se irradia a la base (simula EA).<br><b>Pulso:</b> celer; <mark>parvus et celer</mark> en IM significativa.<br><b>Choque:</b> intenso, amplio, breve, desplazado hacia afuera.<br><b>Ruidos:</b> S1 disminuido en la grave, S3, desdoblamiento amplio de S2.<br><b>Causa más frecuente:</b> prolapso mitral. Aguda: rotura de cuerda o músculo papilar (IAM), endocarditis.</p><span class=\"ref\">36-4 · PDF 525-527</span></div>\n<div class=\"card\"><h4>Insuficiencia tricuspídea</h4><span data-fono=\"holo\"></span>\n<p><b>Soplo:</b> holosistólico suave en foco tricuspídeo, <mark>aumenta con la inspiración</mark> (Rivero-Carvallo), con Müller y con compresión hepática; baja con Valsalva.<br><b>Pulso venoso:</b> positivo o ventricularizado (onda v/s gigante), signo de Evans (se mueve el lóbulo de la oreja).<br><b>Otros:</b> hígado pulsátil, latido en balancín, ascitis, edema. Facies de Shattuck (amarillo-verdosa).<br><b>Causa:</b> casi siempre funcional por dilatación del VD (hipertensión pulmonar).</p><span class=\"ref\">36-4 · PDF 533-534</span></div>\n<div class=\"card\"><h4>Estenosis tricuspídea</h4><span data-fono=\"rodada\"></span>\n<p><b>Soplo:</b> rodada mesodiastólica o presistólica en foco tricuspídeo, más aguda que la mitral, que aumenta con la inspiración y con Müller. Chasquido de apertura tricuspídeo.<br><b>Pulso venoso:</b> onda a gigante, colapso y lento.<br><b>Otros:</b> facies de Shattuck, ascitis, edema, latido hepático presistólico. No refuerza P2 (a diferencia de la EM con HTP).<br><b>Causa:</b> reumática, casi siempre con EM.</p><span class=\"ref\">36-4 · PDF 534-535</span></div>\n<div class=\"card\"><h4>Estenosis pulmonar</h4><span data-fono=\"eyectivo\"></span>\n<p><b>Soplo:</b> eyectivo romboidal en foco pulmonar → espalda y hombro izquierdo, precedido de clic. Aumenta con la inspiración.<br><b>Ruidos:</b> P2 disminuido y retrasado (desdoblamiento amplio).<br><b>Otros:</b> onda a aumentada, Dressler. Casi siempre congénita.</p><span class=\"ref\">36-4 · PDF 535</span></div>\n<div class=\"card\"><h4>Insuficiencia pulmonar</h4><span data-fono=\"proto\"></span>\n<p><b>Soplo:</b> protodiastólico decreciente en 2.º-4.º EIC izquierdo que aumenta con la inspiración. Si es por hipertensión pulmonar se llama <b>Graham Steell</b> (P2 reforzado). Se diferencia de la IA por el aumento inspiratorio y los signos de HTP.</p><span class=\"ref\">36-4 · PDF 536</span></div>\n</div>\n<h4>Signos periféricos de insuficiencia aórtica</h4>\n<div class=\"tw\"><table>\n<tr><th>Signo</th><th>Qué es</th></tr>\n<tr><td><b>Corrigan</b></td><td>Pulso saltón, colapsante, martillo de agua; baile arterial en el cuello</td></tr>\n<tr><td><b>De Musset</b></td><td>Cabeceo sincrónico con el pulso</td></tr>\n<tr><td><b>Müller</b> (signo, no maniobra)</td><td>Pulsación sistólica de la úvula y amígdalas</td></tr>\n<tr><td><b>Quincke</b></td><td>Pulso capilar en el lecho ungueal</td></tr>\n<tr><td><b>Duroziez</b></td><td>Doble soplo (sistólico y diastólico) sobre la femoral al comprimirla</td></tr>\n<tr><td><b>Traube</b></td><td>Ruido \"en disparo de pistola\" sobre la femoral</td></tr>\n<tr><td><b>Hill</b></td><td>PA sistólica en piernas mayor que en brazos (≥ 60 mmHg en la grave)</td></tr>\n<tr><td><b>Landolfi</b></td><td>Pupila que se contrae en cada sístole (hippus)</td></tr>\n<tr><td><b>Becker / Rosenbach / Gerhardt</b></td><td>Pulsación de arterias retinianas / del hígado / del bazo</td></tr>\n<tr><td><b>Lincoln</b></td><td>Oscilación de la pierna cruzada</td></tr>\n</table></div>\n</section>\n\n<section id=\"c-cong\" data-t=\"Congénitas\">\n<h3>Cardiopatías congénitas</h3>\n<div class=\"tw\"><table>\n<tr><th>Cardiopatía</th><th>Hallazgo clave</th></tr>\n<tr><td><b>CIA</b></td><td>Desdoblamiento <mark>amplio y fijo</mark> de S2 + soplo sistólico eyectivo pulmonar de hiperflujo (sin clic). ECG: BCRD. Rx: cavidades derechas grandes</td></tr>\n<tr><td><b>CIV</b></td><td>Holosistólico en barra, intenso, con frémito, en mesocardio (3.º-4.º EIC izquierdo), irradiado \"en rueda de carro\". Si es pequeña y muy ruidosa: <b>soplo de Roger</b></td></tr>\n<tr><td><b>PCA</b></td><td>Soplo continuo <mark>\"en maquinaria\"</mark> (Gibson), en región infraclavicular izquierda/foco pulmonar, máximo en S2; pulsos saltones, frémito continuo</td></tr>\n<tr><td><b>Coartación aórtica</b></td><td>HTA en joven, PA en brazos mayor que en piernas, pulsos femorales débiles y retrasados, soplo interescapular, muescas costales (signo de Roesler)</td></tr>\n<tr><td><b>Válvula aórtica bicúspide</b></td><td>Clic protosistólico en ápex que no varía con la respiración + soplo eyectivo aórtico</td></tr>\n<tr><td><b>Tetralogía de Fallot</b></td><td>Cianosis, hipocratismo, S2 único, eyectivo pulmonar; Rx \"corazón en zueco\"</td></tr>\n</table></div>\n<p class=\"ref\">Argente 36-13 · PDF 592-596</p>\n</section>\n\n<section id=\"c-pulso\" data-t=\"Pulso arterial\">\n<h3>Pulso arterial</h3>\n<p><b>Técnica:</b> radial en la corredera radial, con 3 dedos (índice proximal comprime y mide la tensión; anular distal descarta pulso recurrente cubital). Palpa ambos radiales a la vez para la simetría. En el paciente <mark>inconsciente o en emergencia: pulso carotídeo</mark> (uno a la vez, sin masajear el seno). Se describe con <b>AFRATIFS</b>: Anatomía, Frecuencia, Regularidad, Amplitud, Tensión, Igualdad, Forma, Simetría.</p>\n<ul>\n<li>Frecuencia normal 60-100/min. La fiebre sube unos 10 lpm por cada grado. Bradicardia relativa en fiebre tifoidea.</li>\n<li>Tensión: pulso \"duro\" con PAS > 180, \"blando\" con PAS < 90.</li>\n<li>En FA hay <b>déficit de pulso</b> (frecuencia radial menor que la cardíaca): cuenta por auscultación o ECG.</li>\n<li>Arritmia respiratoria: taquicardia inspiratoria, bradicardia espiratoria (normal en jóvenes).</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Pulso</th><th>Cómo es</th><th>Causa típica</th></tr>\n<tr><td><b>Magnus et celer (Corrigan)</b></td><td>Amplio, sube y cae bruscamente; martillo de agua al elevar el brazo</td><td>IA grave; también fístulas AV, PCA, hipertiroidismo, fiebre, anemia</td></tr>\n<tr><td><b>Parvus et tardus</b></td><td>Pequeño y de ascenso lento</td><td>EA grave (área < 1 cm²)</td></tr>\n<tr><td><b>Parvus et celer</b></td><td>Pequeño y rápido</td><td>IM significativa</td></tr>\n<tr><td><b>Bisferiens</b></td><td>Onda doble con colapso intermedio</td><td>IA grave (Argente); doble lesión aórtica y MCH obstructiva en los bancos</td></tr>\n<tr><td><b>Alternante</b> (Traube)</td><td>Regular, una onda normal y otra pequeña</td><td>Insuficiencia ventricular izquierda</td></tr>\n<tr><td><b>Paradójico</b> (Kussmaul)</td><td>Cae > 10 mmHg la PAS en inspiración</td><td>Taponamiento (con signo de Kussmaul), pericarditis constrictiva, asma/EPOC grave (sin Kussmaul), obstrucción de cava superior</td></tr>\n<tr><td><b>Bigeminado</b></td><td>Latido normal + extrasístole</td><td>Extrasístoles; intoxicación digitálica (la más común); BAV 3:2</td></tr>\n<tr><td><b>Filiforme</b></td><td>Muy pequeño, casi impalpable</td><td>Shock, premortem</td></tr>\n<tr><td><b>Dícroto</b></td><td>Onda dícrota palpable</td><td>Fiebre (tifoidea, neumonía), baja resistencia periférica</td></tr>\n<tr><td><b>En iglesia de campaña</b></td><td>Normal al inicio, cae en meso-telesístole</td><td>MCH obstructiva</td></tr>\n</table></div>\n<p><b>Test de Allen:</b> se comprimen radial y cubital, el paciente cierra el puño, se libera una arteria: la palma debe recolorearse de inmediato (circulación colateral). <b>Maniobra de Osler:</b> radial palpable como cordón con el manguito inflado → seudohipertensión por arterias rígidas. <span class=\"ref\">Argente 35-2 · PDF 434-444; 35-1 · PDF 429</span></p>\n</section>\n\n<section id=\"c-pa\" data-t=\"Presión arterial\">\n<h3>Presión arterial</h3>\n<ul>\n<li>Brazo desnudo, a la altura del corazón, espalda y pies apoyados. Manguito cuya cámara cubra el 80% del brazo. Desinflar a 2 mmHg/s. Nunca el estetoscopio debajo del manguito.</li>\n<li>Primero el <b>método palpatorio</b> (inflar 20-30 mmHg sobre la desaparición del radial) para no caer en el <b>pozo auscultatorio</b> (silencio entre fases II y III; HTA, EA grave).</li>\n<li><b>Korotkoff:</b> fase I = PAS; fase V (desaparición) = PAD. En IA se registran fase IV y V.</li>\n<li>Errores: manguito angosto o brazo bajo el corazón → PA falsamente alta; manguito ancho o brazo elevado → falsamente baja.</li>\n<li>Diferencia normal entre brazos < 15 mmHg. En piernas la PA es normalmente mayor; si es menor, piensa en coartación.</li>\n<li>No medir en brazo con linfedema, parálisis, fístula o vía. Evitar cafeína, tabaco, alcohol y ejercicio previos. Hipotensión ortostática: de pie al instante y a los 2 minutos.</li>\n</ul>\n<p class=\"ref\">Argente 35-3, cuadro 35-3-1 · PDF 445-451</p>\n</section>\n\n<section id=\"c-venoso\" data-t=\"Pulso venoso\">\n<h3>Presión y pulso venoso yugular</h3>\n<p><b>Técnica:</b> decúbito dorsal con cabecera a 30-45°, yugular interna derecha. Referencia: ángulo esternal (de Louis), que está unos 5 cm sobre la aurícula derecha. PVC ≈ altura sobre el ángulo + 5 cm. Normal 8-12 cmH₂O (Argente); > 3-4 cm sobre el ángulo es ingurgitación.</p>\n<p><b>Venoso vs carotídeo:</b> el venoso no se palpa, tiene 2-3 ondas, <mark>desaparece al comprimir la raíz del cuello</mark>, baja en inspiración y al sentarse, sube con la compresión abdominal. El carotídeo se palpa, tiene una onda y no cambia.</p>\n<div class=\"tw\"><table>\n<tr><th>Onda</th><th>Qué representa</th><th>Alteración</th></tr>\n<tr><td><b>a</b></td><td>Contracción auricular</td><td><b>Ausente:</b> FA. <b>Gigante:</b> ET, EP, hipertensión pulmonar. <b>En cañón:</b> aurícula contra tricúspide cerrada (BAV completo, TV, disociación AV)</td></tr>\n<tr><td><b>c</b></td><td>Abombamiento tricuspídeo al inicio de la sístole</td><td>—</td></tr>\n<tr><td><b>x</b></td><td>Colapso sistólico (descenso del plano tricuspídeo)</td><td>Se borra en IT y en IC con FA</td></tr>\n<tr><td><b>v</b></td><td>Llenado auricular con tricúspide cerrada</td><td><b>Gigante (onda s):</b> IT, pulso venoso positivo</td></tr>\n<tr><td><b>y</b></td><td>Colapso por apertura tricuspídea</td><td><b>Profundo (signo de Friedreich):</b> pericarditis constrictiva. <b>Lento:</b> ET</td></tr>\n</table></div>\n<ul>\n<li><b>Reflujo hepatoyugular:</b> presión firme en epigastrio 10 s (Argente: hasta 1 min); positivo anormal si la columna sube 3-4 cm y persiste → IC derecha.</li>\n<li><b>Signo de Kussmaul:</b> la ingurgitación aumenta en inspiración → taponamiento (90%), pericarditis constrictiva.</li>\n<li>Ingurgitación bilateral <b>sin latidos</b>: obstrucción de cava superior (edema en esclavina). Solo izquierda: compresión por aneurisma del cayado (González Sabathie). Bilateral <b>con latidos</b>: IC derecha.</li>\n<li>Grados de ingurgitación: I no pasa el ECM, II lo atraviesa, III llega al ángulo mandibular.</li>\n<li><b>Murmullo venoso (hum):</b> soplo continuo en fosa supraclavicular derecha de niños; desaparece al comprimir la yugular o al acostarse.</li>\n</ul>\n<p class=\"ref\">Argente 35-4 · PDF 452-459</p>\n</section>\n\n<section id=\"c-peric\" data-t=\"Pericardio\">\n<h3>Pericardio</h3>\n<div class=\"tw\"><table>\n<tr><th>Cuadro</th><th>Hallazgos</th></tr>\n<tr><td><b>Pericarditis aguda</b></td><td>Dolor precordial que aumenta con la inspiración y alivia al inclinarse adelante + fiebre + <b>frote pericárdico</b>. ECG: supradesnivel ST cóncavo e infradesnivel PR</td></tr>\n<tr><td><b>Derrame pericárdico</b></td><td>Ruidos cardíacos alejados, <b>signo de Gendrin</b> (choque por dentro de la matidez), matidez del esternón, <b>signo de Ewart</b> (matidez y soplo bronquial bajo la escápula izquierda por compresión pulmonar). Rx en botellón</td></tr>\n<tr><td><b>Taponamiento</b></td><td><b>Tríada de Beck:</b> hipotensión, ingurgitación yugular, ruidos velados. Kussmaul, taquicardia, <b>pulso paradójico</b> > 10 mmHg. ECG: microvoltaje, alternancia eléctrica</td></tr>\n<tr><td><b>Pericarditis constrictiva</b></td><td>Ingurgitación con colapso y profundo (Friedreich), Kussmaul, ascitis precoz desproporcionada (seudocirrosis, síndrome de Pick), hepatomegalia, knock pericárdico, choque en espejo</td></tr>\n</table></div>\n<p class=\"ref\">Argente 36-6 · PDF 545-549</p>\n</section>\n\n<section id=\"c-vasc\" data-t=\"Venas y arterias\">\n<h3>Venas y arterias periféricas</h3>\n<h4>Trombosis venosa profunda</h4>\n<p>Edema unilateral con dolor, calor, tumefacción asimétrica de pantorrilla (> 2 cm, el signo más útil) y venas superficiales dilatadas. Signos: <b>Homans</b> (dolor en pantorrilla a la dorsiflexión del pie), <b>Olow</b> (dolor al comprimir la pantorrilla contra la tibia), <b>Pratt</b> (venas centinela pretibiales), <b>Lowenberg</b> (dolor al inflar el manguito en la pantorrilla a 60-150 mmHg), <b>Bancroft</b>. Factores: posoperatorio, inmovilidad, viaje largo, anticonceptivos, cáncer.</p>\n<div class=\"tw\"><table>\n<tr><th>Úlcera</th><th>Dónde</th><th>Dolor</th><th>Piel y pulsos</th></tr>\n<tr><td><b>Venosa</b></td><td>Cara interna de la pierna, maléolo interno</td><td>Leve (más si se infecta)</td><td>Dermatitis ocre, várices; pulsos normales</td></tr>\n<tr><td><b>Arterial</b></td><td>Cara externa, dedos, talón</td><td>Intenso</td><td>Piel atrófica, fría, pálida; pulsos disminuidos</td></tr>\n<tr><td><b>Neurotrófica</b></td><td>Planta (puntos de apoyo)</td><td>Ausente</td><td>Hiperqueratosis; pulsos normales</td></tr>\n</table></div>\n<ul>\n<li><b>Insuficiencia arterial:</b> claudicación intermitente, dolor de reposo, palidez al elevar el miembro, pulsos débiles, índice tobillo-brazo bajo.</li>\n<li><b>Raynaud:</b> palidez → cianosis → rubor con el frío o emociones.</li>\n<li><b>Insuficiencia venosa superficial:</b> prueba de Brodie-Trendelenburg (cayado de safena); Perthes (permeabilidad del sistema profundo).</li>\n<li><b>Linfedema:</b> edema duro, sin fóvea, signo de Stemmer positivo (no se puede pellizcar la piel del dorso del 2.º dedo del pie).</li>\n<li><b>Circulación colateral:</b> cava superior (flujo descendente en tórax, edema en esclavina), cava inferior (flujo ascendente desde la ingle), portal (cabeza de medusa alrededor del ombligo). La dirección se ve con la maniobra de los índices.</li>\n</ul>\n<p class=\"ref\">Argente 35-1 · PDF 426-433; 25 · PDF 273-275; 36-12 · PDF 588-591</p>\n</section>\n"},
    {id:'resp', name:'Respiratorio, cuello, tiroides y mamas', short:'Respiratorio', ready:true, lede:'Semana 4 · el módulo que más vino (10 de 41). Guía del Argente (caps. 26, 28, 41, 42 y 75) con el banco histórico de TeamMedic.', guide:"<section id=\"r-sind\" data-t=\"Síndromes\">\n<h3>Los cuatro síndromes que siempre preguntan</h3>\n<p>Casi todas las preguntas de respiratorio son un caso con hallazgos de inspección, palpación, percusión y auscultación. Memoriza esta tabla y resuelves la mayoría.</p>\n<div class=\"tw\"><table>\n<tr><th></th><th>Condensación (neumonía)</th><th>Derrame pleural</th><th>Neumotórax</th><th>Atelectasia</th></tr>\n<tr><td><b>Tráquea</b></td><td>Central</td><td>Contralateral si es grande</td><td>Contralateral (a tensión)</td><td><mark>Ipsilateral</mark></td></tr>\n<tr><td><b>Amplexación</b></td><td>Disminuida</td><td>Disminuida, EIC abombados</td><td>Disminuida, EIC abombados</td><td>Disminuida, EIC retraídos</td></tr>\n<tr><td><b>Vibraciones vocales</b></td><td><mark>Aumentadas</mark></td><td>Abolidas</td><td>Abolidas</td><td>Abolidas (si el bronquio está obstruido)</td></tr>\n<tr><td><b>Percusión</b></td><td>Matidez o submatidez</td><td>Matidez hídrica (curva de Damoiseau)</td><td><mark>Hipersonoridad / timpanismo</mark></td><td>Matidez</td></tr>\n<tr><td><b>Murmullo vesicular</b></td><td>Reemplazado por soplo tubárico</td><td>Abolido</td><td>Abolido</td><td>Abolido</td></tr>\n<tr><td><b>Agregados y voz</b></td><td>Crepitantes, soplo tubárico, broncofonía, pectoriloquia (áfona)</td><td>Soplo pleurítico y egofonía en el borde superior; frote si es pequeño</td><td>Soplo anfórico</td><td>Sin agregados</td></tr>\n<tr><td><b>Rx</b></td><td>Opacidad con broncograma aéreo</td><td>Borra el seno costofrénico, menisco</td><td>Hiperlucidez sin trama, línea pleural</td><td>Opacidad con pérdida de volumen</td></tr>\n</table></div>\n<div class=\"box key\"><b>Atajo:</b> en el único síndrome donde el frémito <b>aumenta</b> es la condensación (con bronquio permeable). Hipersonoridad con todo abolido = neumotórax. Matidez con todo abolido: si la tráquea se va hacia el lado enfermo es atelectasia; si se aleja, derrame.</div>\n<p>Otros: <b>enfisema/hiperinsuflación</b> (tórax en tonel, diámetro AP = transversal, hipersonoridad, bases descendidas, excursión diafragmática <mark>disminuida</mark>, matidez cardíaca ausente, MV disminuido, signo de Hoover). <b>Cavitario</b>: soplo cavernoso. <b>Neumotórax traumático + hemotórax</b>: timpanismo de un lado y matidez del otro, con shock si hay sangrado. <span class=\"ref\">Argente 42-1 a 42-5 · PDF 695-734; Backing card TeamMedic</span></p>\n</section>\n\n<section id=\"r-ausc\" data-t=\"Auscultación\">\n<h3>Auscultación</h3>\n<h4>Ruidos normales</h4>\n<div class=\"tw\"><table>\n<tr><th>Ruido</th><th>Dónde</th><th>Cómo</th></tr>\n<tr><td><b>Traqueal (laringotraqueal)</b></td><td>Sobre la tráquea</td><td>Fuerte, agudo, espiración igual o mayor que la inspiración</td></tr>\n<tr><td><b>Bronquial</b></td><td>Manubrio</td><td>Fuerte, agudo, espiración más larga, pausa entre fases</td></tr>\n<tr><td><b>Broncovesicular</b></td><td>Bronquios principales: 1.º-2.º EIC anterior, interescapular, sobre todo derecho</td><td>Intensidad y tono medios, inspiración y espiración iguales</td></tr>\n<tr><td><b>Murmullo vesicular</b></td><td>Mayor parte de la periferia pulmonar (axilas, infraclaviculares, bases)</td><td>Suave, grave, inspiratorio (I:E 3:1), la espiración solo se oye al inicio</td></tr>\n</table></div>\n<h4>Ruidos agregados</h4>\n<div class=\"tw\"><table>\n<tr><th>Ruido</th><th>Mecanismo</th><th>Momento y tos</th><th>Ejemplos</th></tr>\n<tr><td><b>Crepitantes (finos)</b></td><td>Apertura brusca de alvéolos colapsados (\"frote de cabello\")</td><td>Teleinspiratorios; <mark>no cambian con la tos</mark></td><td>Neumonía, edema intersticial, fibrosis</td></tr>\n<tr><td><b>Subcrepitantes (gruesos)</b></td><td>Aire que burbujea en secreciones (moco, pus) de bronquiolos</td><td>Protoinspiratorios y espiratorios; cambian con la tos</td><td>Bronquitis, bronconeumonía, bronquiectasias</td></tr>\n<tr><td><b>Roncus</b></td><td>Secreciones en bronquios grandes; grave, como ronquido</td><td>Continuos; disminuyen con la tos</td><td>Bronquitis, EPOC</td></tr>\n<tr><td><b>Sibilancias</b></td><td>Vibración de paredes de vías estrechas; agudas, musicales</td><td>Continuas, <mark>predominio espiratorio</mark></td><td>Asma, EPOC</td></tr>\n<tr><td><b>Frote pleural</b></td><td>Roce de hojas pleurales inflamadas; \"cuero nuevo\"</td><td>En ambas fases, <mark>no cambia con la tos</mark>, se palpa y se ausculta, sin traducción radiológica</td><td>Pleuritis seca, antes o después del derrame</td></tr>\n<tr><td><b>Estridor</b></td><td>Obstrucción de vía alta</td><td>Inspiratorio</td><td>Cuerpo extraño, epiglotitis</td></tr>\n</table></div>\n<h4>Soplos y resonancia de la voz</h4>\n<ul>\n<li><b>Soplo tubárico:</b> respiración laringotraqueal transmitida por parénquima condensado con bronquio permeable → neumonía.</li>\n<li><b>Soplo pleurítico:</b> más suave, espiratorio, en \"e\", en el borde superior del derrame.</li>\n<li><b>Soplo anfórico:</b> como soplar en una botella → neumotórax. <b>Cavernoso:</b> cavidad vacía comunicada con un bronquio.</li>\n<li><b>Broncofonía:</b> voz más intensa sin nitidez. <b>Pectoriloquia:</b> se entiende la palabra hablada. <b>Pectoriloquia áfona:</b> se entiende la voz <mark>susurrada</mark> → condensación. <b>Egofonía:</b> voz de cabra, nasal y temblorosa (la \"e\" suena \"a\") → borde superior del derrame.</li>\n</ul>\n<p class=\"ref\">Argente 41 · PDF 689-694</p>\n</section>\n\n<section id=\"r-explo\" data-t=\"Inspección, palpación, percusión\">\n<h3>Inspección, palpación y percusión</h3>\n<ul>\n<li><b>Patrones:</b> Kussmaul (profunda y rápida, acidosis metabólica), Cheyne-Stokes (crescendo-decrescendo con apneas: IC, lesión neurológica), Biot (irregular con apneas: lesión del tronco).</li>\n<li><b>Signos de dificultad:</b> aleteo nasal, tiraje (intercostal, supraesternal), uso de accesorios, respiración paradójica, <b>signo de Hoover</b> (paradoja costal en tórax hiperinsuflado).</li>\n<li><b>Maniobra de Ruault:</b> expansión de vértices desde atrás, manos a caballo sobre el trapecio. Las bases se exploran con las manos abrazando la parrilla costal inferior.</li>\n<li><b>Vibraciones vocales:</b> paciente dice \"treinta y tres\". Aumentan en condensación; disminuyen o se abolen en derrame, neumotórax, atelectasia y obesidad.</li>\n<li><b>Crepitación subcutánea</b> palpable (enfisema subcutáneo): neumotórax, fracturas costales, iatrogenia (subclavia).</li>\n<li><b>Percusión:</b> sonoridad (pulmón normal), matidez (órgano sólido o líquido), submatidez (menos aire), hipersonoridad (enfisema, neumotórax), timpanismo (espacio de Traube, neumotórax a tensión). Por encima de un derrame puede haber hipersonoridad (sonoridad skódica).</li>\n<li><b>Excursión diafragmática:</b> se mide <mark>con percusión</mark>, de la matidez en espiración a la de inspiración profunda: normal 4-6 cm (Argente); muy reducida (unos 2 cm o menos) en enfisema o parálisis diafragmática.</li>\n<li><b>Columna:</b> sonora de C7 a D10-D11.</li>\n</ul>\n</section>\n\n<section id=\"r-reparos\" data-t=\"Reparos y puntos\">\n<h3>Reparos anatómicos, líneas y puntos</h3>\n<ul>\n<li><b>Ángulo de Louis</b> (manubrio-cuerpo esternal): 2.º cartílago costal, bifurcación traqueal (D4-D5), punto de contacto de ambas pleuras anteriores. Sirve para contar costillas.</li>\n<li>Costillas: 1 a 7 verdaderas (al esternón); 8, 9 y 10 falsas (se unen al cartílago de arriba); 11 y 12 flotantes. Todas se articulan con vértebras dorsales.</li>\n<li>Proyecciones: la región mamaria derecha proyecta el lóbulo medio; la izquierda, la língula. La cisura menor va por la 4.ª costilla derecha. Los vértices asoman en las fosas supraclaviculares.</li>\n<li><b>Zona de alarma de Chauvet:</b> desde la mitad de C7-D1 hasta el borde del trapecio, en el dorso; donde se busca el inicio apical de la <mark>tuberculosis</mark>.</li>\n<li><b>Punto de Guttmann:</b> tercio interno de la fosa supraclavicular; para auscultar los sonidos <mark>asmáticos</mark> con espiración prolongada.</li>\n<li><b>Línea basal de Mouriquand:</b> horizontal por el punto donde la XII costilla cruza la masa lumbar; límite del fondo de saco costodiafragmático (banco histórico TeamMedic).</li>\n<li><b>Espacio de Traube:</b> timpánico, entre hígado (derecha), bazo (izquierda), corazón (arriba) y reborde costal (abajo). Se hace mate con derrame pleural izquierdo grande o esplenomegalia.</li>\n</ul>\n</section>\n\n<section id=\"r-fisio\" data-t=\"Fisiología\">\n<h3>Fisiología que entra</h3>\n<ul>\n<li><b>Espacio muerto:</b> aire inspirado que no participa de la hematosis (unos 150 mL).</li>\n<li>CI = VC + VRI. CRF = VRE + VR. <b>CV = VRI + VC + VRE.</b> CPT = CV + VR.</li>\n<li>Señal inspiratoria \"en rampa\": la descarga al diafragma empieza débil y aumenta de forma continua.</li>\n<li>El estímulo del CO₂ disminuye en 1-2 días porque el riñón reajusta el bicarbonato (concentración de H⁺).</li>\n<li>Hipocapnia en neumonía con hipoxemia = hiperventilación.</li>\n<li>Obesidad: aumenta el trabajo respiratorio, baja la CRF y la distensibilidad de la pared.</li>\n</ul>\n</section>\n\n<section id=\"r-cuello\" data-t=\"Cuello y tiroides\">\n<h3>Cuello y tiroides</h3>\n<ul>\n<li>Inspección con el cuello en ligera hiperextensión y pidiendo que degluta: la tiroides asciende con la deglución.</li>\n<li>Tráquea central; se desvía hacia el lado opuesto en derrame o neumotórax a tensión y hacia el mismo lado en atelectasia.</li>\n<li><b>Lahey:</b> palpación <b>anterior</b>, el examinador frente al paciente. <b>Crile:</b> palpación de <b>nódulos</b> con el pulgar mientras el paciente deglute. <b>Quervain:</b> palpación <b>posterior</b>, el examinador detrás, con ambas manos.</li>\n<li>Describir tamaño, consistencia, superficie (difusa o nodular), movilidad, dolor. Auscultar <b>soplo tiroideo</b> en el hipertiroidismo (Graves).</li>\n<li><b>Signo de Pemberton:</b> al elevar ambos brazos aparece plétora facial y congestión por un bocio que ocupa el estrecho torácico superior (intratorácico).</li>\n<li>Nódulo sospechoso: duro, fijo, único, crecimiento rápido, adenopatías, disfonía.</li>\n<li><b>Ganglios cervicales:</b> preauriculares, retroauriculares, occipitales, submandibulares, submentonianos, cervicales anteriores y posteriores, supraclaviculares. Ganglio de <b>Virchow-Troisier</b> (supraclavicular izquierdo): metástasis de neoplasia abdominal.</li>\n</ul>\n<p class=\"ref\">Argente cap. 28 · PDF 295-300; 26 · PDF 276-281; Lista de cotejo A</p>\n</section>\n\n<section id=\"r-mama\" data-t=\"Mamas\">\n<h3>Mamas</h3>\n<ul>\n<li>Consentimiento y privacidad. Inspección estática (brazos al costado) y dinámica (brazos arriba, manos en la cintura, inclinación hacia adelante) buscando asimetría, retracción de piel o pezón, piel de naranja.</li>\n<li>Palpación con los pulpejos en patrón radial o vertical por los 4 cuadrantes, prolongación axilar (cola de Spence) y complejo areola-pezón; luego ganglios axilares, supra e infraclaviculares.</li>\n<li>El <b>cuadrante superoexterno</b> concentra más tejido y más cáncer.</li>\n<li><b>Sugiere malignidad:</b> indoloro, duro, fijo, bordes irregulares, retracción, secreción sanguinolenta unilateral, adenopatías. <b>Benigno:</b> móvil, bordes regulares, elástico; los fibroquísticos cambian con el ciclo y duelen.</li>\n<li>Confirmación diagnóstica: <b>biopsia</b>.</li>\n</ul>\n<p class=\"ref\">Argente cap. 75 · PDF 1662-1669</p>\n</section>\n"},
    {id:'neuro', name:'Neurológico', short:'Neuro', ready:true, lede:'Semana 7 · 7 de 41 preguntas. Guía del Argente (71 y 72). No llegó banco de neuro, así que además de las del parcial 2022 hay preguntas de práctica armadas sobre el libro.', guide:"<section id=\"n-conc\" data-t=\"Conciencia\">\n<h3>Conciencia y Glasgow</h3>\n<p>Niveles: alerta → somnolencia (despierta con estímulo verbal) → estupor o sopor (solo con estímulo intenso o doloroso) → coma (no despierta). Confusión = alerta pero desorientado.</p>\n<div class=\"tw\"><table>\n<tr><th>Puntos</th><th>Apertura ocular (O)</th><th>Respuesta verbal (V)</th><th>Respuesta motora (M)</th></tr>\n<tr><td><b>6</b></td><td>—</td><td>—</td><td>Obedece órdenes</td></tr>\n<tr><td><b>5</b></td><td>—</td><td>Orientado</td><td>Localiza el dolor</td></tr>\n<tr><td><b>4</b></td><td>Espontánea</td><td>Confuso</td><td>Retira al dolor</td></tr>\n<tr><td><b>3</b></td><td>A la voz</td><td>Palabras inapropiadas</td><td>Flexión anormal (<mark>decorticación</mark>)</td></tr>\n<tr><td><b>2</b></td><td>Al dolor</td><td>Sonidos incomprensibles</td><td>Extensión (<mark>descerebración</mark>)</td></tr>\n<tr><td><b>1</b></td><td>Ninguna</td><td>Ninguna</td><td>Ninguna</td></tr>\n</table></div>\n<p>Mínimo 3, máximo 15; ≤ 8 = coma, indica protección de vía aérea. Ejemplo del parcial 2022: abre al dolor (2) + sin respuesta verbal (1) + descerebración (2) = <b>5</b>.</p>\n</section>\n\n<section id=\"n-pares\" data-t=\"Pares craneales\">\n<h3>Pares craneales</h3>\n<div class=\"tw\"><table>\n<tr><th>Par</th><th>Cómo se explora</th><th>Lesión típica</th></tr>\n<tr><td><b>I Olfatorio</b></td><td>Cada fosa por separado con olores no irritantes</td><td>Anosmia (TEC, tumor frontal, Parkinson)</td></tr>\n<tr><td><b>II Óptico</b></td><td>Agudeza (Snellen), campos (confrontación), fondo de ojo, reflejo fotomotor (vía aferente)</td><td>Hemianopsia bitemporal (quiasma), papiledema (HTE)</td></tr>\n<tr><td><b>III Motor ocular común</b></td><td>Movimientos oculares, pupila, párpado</td><td>Ojo hacia abajo y afuera, <mark>ptosis</mark>, midriasis arreactiva (si es compresivo)</td></tr>\n<tr><td><b>IV Patético</b></td><td>Mirar abajo y adentro (oblicuo superior)</td><td>Diplopía vertical al bajar escaleras; <mark>inclina la cabeza hacia el lado sano</mark>; Bielschowsky + hacia el lado lesionado</td></tr>\n<tr><td><b>V Trigémino</b></td><td>Sensibilidad V1, V2, V3; masticadores; reflejo corneal (aferente)</td><td>Hipoestesia facial; al abrir la boca la mandíbula <mark>se desvía hacia el lado lesionado</mark>; corneal abolido del mismo lado</td></tr>\n<tr><td><b>VI Motor ocular externo</b></td><td>Abducción</td><td>No abduce, diplopía horizontal; signo falso localizador en la HTE</td></tr>\n<tr><td><b>VII Facial</b></td><td>Fruncir el ceño, cerrar los ojos, mostrar los dientes, inflar mejillas; gusto 2/3 anteriores</td><td>Ver periférica vs central abajo; corneal sin eferencia (no parpadea)</td></tr>\n<tr><td><b>VIII Vestibulococlear</b></td><td>Voz susurrada, Rinne, Weber (diapasón 512 Hz); nistagmo, Romberg</td><td>Hipoacusia de conducción o neurosensorial, vértigo</td></tr>\n<tr><td><b>IX y X</b></td><td>Úvula y velo al decir \"aaa\", reflejo nauseoso, voz, deglución</td><td>La úvula se desvía hacia el lado <mark>sano</mark> (signo de la cortina); disfagia, disfonía</td></tr>\n<tr><td><b>XI Espinal accesorio</b></td><td>Elevar hombros (trapecio) y girar la cabeza contra resistencia (ECM)</td><td>Hombro caído, no abduce sobre 90° (lesión en el triángulo posterior del cuello)</td></tr>\n<tr><td><b>XII Hipogloso</b></td><td>Sacar la lengua, trofismo, fasciculaciones</td><td>La lengua se desvía hacia el lado <mark>lesionado</mark></td></tr>\n</table></div>\n<h4>Parálisis facial periférica vs central</h4>\n<div class=\"tw\"><table>\n<tr><th></th><th>Periférica (Bell, núcleo o nervio)</th><th>Central (1.ª motoneurona: ACV)</th></tr>\n<tr><td><b>Territorio</b></td><td>Toda la hemicara del mismo lado</td><td>Solo la mitad inferior de la hemicara opuesta</td></tr>\n<tr><td><b>Frente</b></td><td>No puede fruncir el ceño</td><td><mark>Frunce el ceño</mark> (inervación cortical bilateral)</td></tr>\n<tr><td><b>Ojo</b></td><td>No cierra, lagoftalmos, <b>signo de Bell</b> (el globo sube), epífora</td><td>Cierre palpebral casi normal</td></tr>\n<tr><td><b>Comunes</b></td><td colspan=\"2\">Desviación de la comisura hacia el lado sano, signo del \"fumador de pipa\" (la mejilla se infla al espirar)</td></tr>\n</table></div>\n<h4>Rinne y Weber</h4>\n<div class=\"tw\"><table>\n<tr><th></th><th>Rinne</th><th>Weber</th></tr>\n<tr><td><b>Normal</b></td><td>Positivo (aérea > ósea)</td><td>Central</td></tr>\n<tr><td><b>Conducción (transmisión)</b></td><td><mark>Negativo</mark> en el oído enfermo</td><td>Lateraliza al oído <b>enfermo</b></td></tr>\n<tr><td><b>Neurosensorial</b></td><td>Positivo (ambas reducidas)</td><td>Lateraliza al oído <b>sano</b></td></tr>\n</table></div>\n<p class=\"ref\">Argente 71-2 · PDF 1471-1498</p>\n</section>\n\n<section id=\"n-motora\" data-t=\"Motora\">\n<h3>Función motora</h3>\n<p><b>Fuerza (escala MRC):</b> 0 sin contracción, 1 contracción sin movimiento, 2 mueve sin gravedad, 3 vence la gravedad, 4 vence algo de resistencia, 5 normal. Maniobras deficitarias: Barré y Mingazzini.</p>\n<p><b>Reflejos osteotendinosos:</b> 0 ausente, 1+ disminuido, 2+ normal, 3+ vivo, 4+ con clonus. Niveles: bicipital C5-C6, estilorradial C5-C6, tricipital C7, rotuliano L3-L4, aquíleo S1. Cutáneo abdominales D7-D12.</p>\n<div class=\"tw\"><table>\n<tr><th></th><th>1.ª motoneurona (piramidal)</th><th>2.ª motoneurona (periférica)</th></tr>\n<tr><td><b>Fuerza</b></td><td>Paresia de grupos musculares</td><td>Paresia de músculos o miotomas</td></tr>\n<tr><td><b>Tono</b></td><td>Espasticidad (\"en navaja\")</td><td>Hipotonía, flacidez</td></tr>\n<tr><td><b>Reflejos</b></td><td>Hiperreflexia, clonus</td><td>Hipo o arreflexia</td></tr>\n<tr><td><b>Patológicos</b></td><td><mark>Babinski</mark>, Hoffmann, abdominales abolidos</td><td>Ausentes</td></tr>\n<tr><td><b>Trofismo</b></td><td>Conservado (atrofia por desuso tardía)</td><td>Atrofia precoz, <mark>fasciculaciones</mark></td></tr>\n</table></div>\n<p><b>Rigidez vs espasticidad:</b> la rigidez extrapiramidal (Parkinson) es uniforme, \"en tubo de plomo\" o \"en rueda dentada\"; la espasticidad depende de la velocidad y cede de golpe (\"en navaja\").</p>\n<p class=\"ref\">Argente 71-3 · PDF ~1499-1510; 72-3, 72-4</p>\n</section>\n\n<section id=\"n-sens\" data-t=\"Sensitiva y coordinación\">\n<h3>Sensibilidad y coordinación</h3>\n<ul>\n<li><b>Superficial</b> (espinotalámica): tacto con algodón, dolor con aguja descartable, temperatura.</li>\n<li><b>Profunda</b> (cordones posteriores): vibración con diapasón de 128 Hz, posición segmentaria (artrocinesia), barestesia. Monofilamento para el pie diabético.</li>\n<li><b>Cortical:</b> estereognosia, grafestesia, discriminación de dos puntos.</li>\n<li><b>Coordinación:</b> dedo-nariz, talón-rodilla, diadococinesia (movimientos alternos rápidos; si fallan: adiadococinesia), rebote de Stewart-Holmes.</li>\n<li><b>Romberg:</b> de pie con pies juntos, primero con ojos abiertos y luego cerrados. Positivo si cae <mark>al cerrar los ojos</mark> → ataxia <b>sensitiva</b> (cordones posteriores: tabes, déficit de B12). En la ataxia <b>cerebelosa</b> el desequilibrio existe con ojos abiertos y no empeora al cerrarlos; se acompaña de dismetría, temblor intencional, nistagmo y marcha ebria.</li>\n<li><b>Marchas:</b> hemiparética (en segador), cerebelosa (ebriosa, base amplia), tabética (taloneante), parkinsoniana (pasos cortos, festinante), en estepaje (pie caído: L5 o peroneo), de pato (debilidad de cintura pélvica).</li>\n</ul>\n<p class=\"ref\">Argente 71-4, 71-5 · PDF ~1511-1518</p>\n</section>\n\n<section id=\"n-men\" data-t=\"Meníngeos\">\n<h3>Signos meníngeos</h3>\n<div class=\"tw\"><table>\n<tr><th>Signo</th><th>Cómo</th></tr>\n<tr><td><b>Rigidez de nuca</b></td><td>Resistencia a la flexión pasiva del cuello</td></tr>\n<tr><td><b>Kernig</b></td><td>Supino, cadera a 90°: no se puede extender la rodilla por dolor y resistencia (Kernig II: al sentarlo, flexiona las rodillas)</td></tr>\n<tr><td><b>Brudzinski de nuca</b></td><td>Al flexionar el cuello se flexionan caderas y rodillas</td></tr>\n<tr><td><b>Brudzinski contralateral</b></td><td>Al flexionar una cadera se flexiona la otra</td></tr>\n<tr><td><b>Lewinson</b></td><td>Para tocar el pecho con el mentón tiene que abrir la boca</td></tr>\n<tr><td><b>Lhermitte</b></td><td>Descarga eléctrica por la columna al flexionar el cuello (no es meníngeo: mielopatía, esclerosis múltiple)</td></tr>\n</table></div>\n<p>Contexto típico: fiebre, cefalea, vómitos, fotofobia y alteración de la conciencia = síndrome meningoencefalítico. Posición en \"gatillo de fusil\". <span class=\"ref\">Argente 72-2 · PDF 1536-1540</span></p>\n</section>\n\n<section id=\"n-leng\" data-t=\"Lenguaje, praxia, gnosia\">\n<h3>Lenguaje, praxia y gnosia</h3>\n<div class=\"tw\"><table>\n<tr><th>Afasia</th><th>Fluencia</th><th>Comprensión</th><th>Repetición</th><th>Lesión</th></tr>\n<tr><td><b>Broca (motora)</b></td><td>No fluente, esforzada</td><td>Conservada</td><td>Alterada</td><td>Frontal inferior izquierdo</td></tr>\n<tr><td><b>Wernicke (sensitiva)</b></td><td>Fluente, con parafasias y jerga</td><td>Alterada</td><td>Alterada</td><td>Temporal superior izquierdo</td></tr>\n<tr><td><b>De conducción</b></td><td>Fluente</td><td>Conservada</td><td><mark>Muy alterada</mark></td><td>Fascículo arqueado</td></tr>\n<tr><td><b>Global</b></td><td>No fluente</td><td>Alterada</td><td>Alterada</td><td>Perisilviana extensa</td></tr>\n<tr><td><b>Transcorticales</b></td><td>Variable</td><td>Variable</td><td><mark>Conservada</mark></td><td>Zonas limítrofes</td></tr>\n</table></div>\n<ul>\n<li><b>Disartria:</b> trastorno de la articulación con lenguaje normal (bulbar, cerebelosa, parkinsoniana). <b>Disfonía:</b> trastorno de la voz.</li>\n<li><b>Apraxia:</b> no ejecuta un acto aprendido sin déficit motor (ideomotora, ideatoria, constructiva, del vestir).</li>\n<li><b>Agnosia:</b> no reconoce con sensibilidad conservada: astereognosia (tacto, parietal), prosopagnosia (caras), anosognosia (no reconoce su déficit, parietal derecho).</li>\n</ul>\n<p class=\"ref\">Argente 71-6 a 71-8 · PDF ~1519-1526</p>\n</section>\n"},
    {id:'abd', name:'Abdomen y genitourinario', short:'Abdomen', ready:true, lede:'Semana 3 · 6 de 41 preguntas (9 en 2022). Guía del Argente (caps. 47 y 53) con el banco de Gastro-Nefro de TeamMedic.', guide:"<section id=\"a-fijas\" data-t=\"Lo que más cae\">\n<h3>Lo que más cae</h3>\n<p>En 2022 vinieron 9 preguntas de abdomen y GU (Glenard, Montenegro, Kehr, Blumberg, Guéneau de Mussy, onda ascítica, punto ureteral superior, cólico renoureteral). Casi todas piden el <b>nombre del signo o de la maniobra</b> a partir de su descripción.</p>\n<ol class=\"fijas\">\n<li><b>Orden del examen: inspección → auscultación → percusión → palpación</b> (superficial y luego profunda)<span class=\"meta\">Se ausculta antes de tocar para no alterar los ruidos</span></li>\n<li><b>Ascitis: la matidez desplazable es la más sensible y la onda ascítica la más específica</b><span class=\"meta\">La onda necesita una tercera mano (del paciente o de un ayudante) en la línea media</span></li>\n<li><b>Jobert = desaparece la matidez hepática por aire libre (neumoperitoneo)</b><span class=\"meta\">Chilaiditi = colon transverso entre hígado y diafragma</span></li>\n<li><b>Blumberg = dolor a la descompresión localizado (FID). Guéneau de Mussy = dolor a la descompresión en todo el abdomen</b><span class=\"meta\">El primero indica peritonitis localizada y el segundo, generalizada</span></li>\n<li><b>Murphy = la inspiración profunda se detiene al presionar el punto cístico (colecistitis)</b><span class=\"meta\">Courvoisier-Terrier: vesícula palpable no dolorosa con ictericia, que indica obstrucción extrahepática</span></li>\n<li><b>Traube: hígado a la derecha, bazo a la izquierda, corazón arriba, reborde costal abajo</b><span class=\"meta\">Es normalmente timpánico; matidez = esplenomegalia, derrame pleural izquierdo, lóbulo izquierdo grande o estómago lleno</span></li>\n<li><b>Riñón: Guyon (decúbito dorsal, peloteo), Israel (decúbito lateral), Glenard (ptosis renal), Goelet (de pie), Montenegro (decúbito ventral, masas extrarrenales)</b><span class=\"meta\">Las preguntas de 2022 fueron Glenard y Montenegro</span></li>\n<li><b>Punto ureteral superior = línea umbilical + borde externo del recto. Medio = línea biilíaca + borde externo del recto. Inferior = tacto rectal o vaginal</b></li>\n<li><b>Kehr = dolor en el hombro izquierdo en la rotura de bazo. Cullen = equimosis periumbilical. Grey Turner = equimosis en los flancos</b><span class=\"meta\">Los dos últimos aparecen en pancreatitis hemorrágica, rotura de aorta y embarazo ectópico roto</span></li>\n<li><b>Cabeza de medusa = hipertensión portal (venas que van del ombligo hacia afuera) + murmullo de Cruveilhier-Baumgarten</b><span class=\"meta\">En la obstrucción de la vena cava inferior las venas van por los flancos de abajo hacia arriba</span></li>\n</ol>\n</section>\n\n<section id=\"a-insp\" data-t=\"Regiones e inspección\">\n<h3>Regiones e inspección</h3>\n<p>Nueve regiones definidas por dos líneas horizontales (subcostal y biilíaca) y dos verticales (medioclaviculares).</p>\n<div class=\"tw\"><table>\n<tr><th>Derecha</th><th>Centro</th><th>Izquierda</th></tr>\n<tr><td><b>Hipocondrio derecho:</b> lóbulo derecho del hígado, vesícula, ángulo hepático del colon, polo superior del riñón derecho</td><td><b>Epigastrio:</b> estómago y píloro, duodeno, páncreas, lóbulo izquierdo del hígado, aorta</td><td><b>Hipocondrio izquierdo:</b> estómago, bazo, cola del páncreas, ángulo esplénico, polo superior del riñón izquierdo</td></tr>\n<tr><td><b>Flanco derecho:</b> colon ascendente, riñón derecho, asas delgadas</td><td><b>Mesogastrio (umbilical):</b> <mark>yeyuno e íleon</mark>, epiplón, mesenterio, tercera y cuarta porción del duodeno, aorta</td><td><b>Flanco izquierdo:</b> colon descendente, riñón izquierdo, asas de yeyuno</td></tr>\n<tr><td><b>Fosa ilíaca derecha:</b> ciego, apéndice, íleon terminal, uréter, anexo derecho</td><td><b>Hipogastrio:</b> vejiga, útero, asas delgadas</td><td><b>Fosa ilíaca izquierda:</b> colon sigmoides, uréter, anexo izquierdo</td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Hallazgo a la inspección</th><th>Qué es</th></tr>\n<tr><td>Abdomen globoso con ombligo hundido</td><td>Obesidad, meteorismo</td></tr>\n<tr><td>Abdomen globoso con <b>ombligo evertido</b> (procidente)</td><td>Ascitis a tensión (también hernia umbilical)</td></tr>\n<tr><td><b>Abdomen en batracio:</b> en decúbito los flancos se abomban, el abdomen se aplana y el líquido se ubica a los lados</td><td>Ascitis</td></tr>\n<tr><td>Distensión del abdomen superior, intermitente y posprandial</td><td>Dispepsia (distensión gástrica)</td></tr>\n<tr><td>Distensión del abdomen inferior desde el pubis hacia arriba</td><td>Globo vesical, útero miomatoso o grávido, quiste de ovario</td></tr>\n<tr><td>Distensión + vómitos + ausencia de deposiciones y gases</td><td>Obstrucción intestinal</td></tr>\n<tr><td>Abdomen plano, contracturado, sin movilidad respiratoria y muy doloroso</td><td><b>Abdomen en tabla</b> (peritonitis por perforación de víscera hueca)</td></tr>\n<tr><td>Nódulo umbilical duro</td><td><b>Nódulo de la hermana María José</b> (metástasis de neoplasia intraabdominal, como páncreas, estómago u ovario)</td></tr>\n<tr><td>Abombamiento longitudinal en la línea media al elevar la cabeza o las piernas</td><td>Diástasis de los rectos</td></tr>\n<tr><td>Equimosis periumbilical / en flancos</td><td><b>Cullen</b> / <b>Grey Turner</b> (hemorragia retroperitoneal o intraperitoneal)</td></tr>\n<tr><td>Circulación colateral periumbilical que se aleja del ombligo</td><td><b>Cabeza de medusa</b>: hipertensión portal</td></tr>\n<tr><td>Venas en los flancos con flujo de abajo hacia arriba</td><td>Obstrucción de la vena cava inferior</td></tr>\n</table></div>\n<p><b>Hernias:</b> protrusión de contenido abdominal por un defecto de la pared. <b>Reductible</b> (vuelve a la cavidad): coercible si se queda adentro al reducirla, incoercible si vuelve a salir sola. <b>Irreductible:</b> incarcerada (sin compromiso vascular; da obstrucción) o <mark>estrangulada</mark> (con isquemia, color violáceo, fiebre y leucocitosis). La que sale por una cicatriz quirúrgica es una <b>eventración</b> (hernia incisional).</p>\n<p class=\"ref\">Argente cap. 47 · PDF 836-841; Conceptos de Gastro TeamMedic</p>\n</section>\n\n<section id=\"a-ausc\" data-t=\"Auscultación\">\n<h3>Auscultación</h3>\n<ul>\n<li><b>Ruidos hidroaéreos (borborigmos):</b> 5 a 30 por minuto según el Argente. Están <b>aumentados y de tono metálico</b> (ruidos de lucha) en el íleo mecánico y <b>ausentes</b> (silencio abdominal) en el íleo paralítico y la peritonitis. Lo que diferencia el íleo mecánico del paralítico son los ruidos hidroaéreos.</li>\n<li><b>Soplo sistodiastólico abdominal + HTA</b>: estenosis de la arteria renal. Se ausculta en la zona periumbilical o en la región lumbar. Ojo: hasta 20% de sanos tiene un soplo sistólico en el epigastrio.</li>\n<li><b>Frote o roce</b> sobre el hígado o el bazo: periviscertis (infarto hepático o esplénico, tumor).</li>\n<li><b>Murmullo venoso de Cruveilhier-Baumgarten:</b> zumbido suave periumbilical en la hipertensión portal con circulación colateral.</li>\n<li><b>Chapoteo o bazuqueo gástrico:</b> movimientos rápidos con la punta de los dedos del pubis al epigastrio. Si hay chapoteo después de 4 a 6 h de ayuno, hay retención gástrica (síndrome pilórico).</li>\n<li><b>Signo de Claybrook:</b> los ruidos respiratorios y cardíacos se oyen en toda la pared abdominal en la rotura de víscera abdominal.</li>\n</ul>\n<p class=\"ref\">Argente cap. 47 · PDF 836-840</p>\n</section>\n\n<section id=\"a-perc\" data-t=\"Percusión y ascitis\">\n<h3>Percusión y ascitis</h3>\n<div class=\"tw\"><table>\n<tr><th>Hallazgo</th><th>Significado</th></tr>\n<tr><td>Timpanismo generalizado</td><td>Normal. Si es intenso, meteorismo u obstrucción</td></tr>\n<tr><td><b>Espacio semilunar de Traube</b> (porción torácica del hipocondrio izquierdo)</td><td>Límites: <b>hígado a la derecha, bazo a la izquierda, corazón arriba y reborde costal abajo</b>. Normalmente timpánico. Matidez: esplenomegalia, derrame pleural izquierdo, lóbulo izquierdo hepático grande, estómago lleno, tumor del techo gástrico</td></tr>\n<tr><td>Matidez hepática</td><td>Altura hepática normal (según Bates): 6 a 12 cm en la línea medioclavicular y 4 a 8 cm en la medioesternal</td></tr>\n<tr><td><b>Signo de Jobert</b></td><td>Desaparece la matidez hepática por aire libre: <mark>neumoperitoneo</mark> por perforación de víscera hueca</td></tr>\n<tr><td><b>Signo de Chilaiditi</b></td><td>Desaparece la matidez hepática por interposición del colon transverso por delante del hígado</td></tr>\n<tr><td>Matidez con <b>concavidad hacia arriba</b> (en los flancos)</td><td>Ascitis</td></tr>\n<tr><td>Matidez con <b>convexidad hacia arriba</b> (en el hipogastrio)</td><td>Globo vesical, quiste de ovario, miomas, embarazo</td></tr>\n<tr><td><b>Percusión en damero</b> (matidez y sonoridad alternadas)</td><td>Ascitis tabicada, sobre todo la peritonitis tuberculosa</td></tr>\n<tr><td><b>Punto de Castell</b>: decúbito dorsal, último espacio intercostal (9.º en TeamMedic) en la línea axilar anterior izquierda</td><td>Normalmente sonoro. <b>Matidez = esplenomegalia</b>. Es el método de percusión más sensible para el bazo</td></tr>\n<tr><td><b>Nixon</b>: decúbito lateral derecho, percusión de arriba hacia abajo por la línea axilar media (9.ª a 11.ª costilla)</td><td>Si la matidez se extiende de más, esplenomegalia (Bates usa más de 8 cm sobre el reborde costal)</td></tr>\n</table></div>\n<div class=\"grid2\">\n<div class=\"card\"><h4>Matidez desplazable</h4><p>Se percute en decúbito dorsal y después en decúbito lateral: la matidez <b>siempre aparece en la zona declive</b> porque el líquido se mueve libremente. Es la <mark>más sensible</mark>.</p></div>\n<div class=\"card\"><h4>Onda ascítica (oleada)</h4><p>Una mano en un flanco, la otra percute el flanco opuesto y <b>otra mano (del paciente o un ayudante) en la línea media</b> bloquea la onda de la pared. Si hay ascitis, el impulso se transmite al otro flanco. Es la <mark>más específica</mark>.</p></div>\n<div class=\"card\"><h4>Signo del témpano</h4><p>En la ascitis con hepatomegalia, al deprimir bruscamente se siente el hígado \"flotando\" y chocando contra la mano (peloteo hepático).</p></div>\n<div class=\"card\"><h4>Signo de Ballance</h4><p>Matidez fija en el flanco izquierdo (sangre coagulada alrededor del bazo) y matidez desplazable en el derecho (sangre libre): <b>hemoperitoneo por rotura de bazo</b>.</p></div>\n</div>\n<p class=\"ref\">Argente cap. 47 · PDF 837-838, 851; Bates; Conceptos de Gastro TeamMedic</p>\n</section>\n\n<section id=\"a-palp\" data-t=\"Palpación\">\n<h3>Palpación</h3>\n<ul>\n<li><b>Superficial:</b> con la palma y los dedos juntos, sin hundir (\"mano de escultor de Merlo\"). Evalúa tensión, sensibilidad y defensa. Primero se palpa lejos del sitio del dolor.</li>\n<li><b>Para relajar la pared:</b> maniobra de <b>Galambos</b> (la mano izquierda presiona y levanta la pared desde la FID) y de <b>Obrastzow</b> (presión con el talón de la mano), según TeamMedic.</li>\n<li><b>Profunda:</b> busca órganos y masas. <b>Minkowski</b> (fijeza espiratoria) sirve para tumores retroperitoneales y el riñón.</li>\n<li><b>Masa de la pared vs. intraabdominal:</b> al contraer los rectos (levantar la cabeza), la masa de la pared sigue palpable y la intraabdominal desaparece.</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Órgano</th><th>¿Se palpa en un sano?</th></tr>\n<tr><td>Ciego y sigmoides</td><td>Sí</td></tr>\n<tr><td>Colon ascendente, transverso y descendente</td><td><mark>No</mark> (cae como distractor)</td></tr>\n<tr><td>Intestino delgado, apéndice, vesícula, estómago</td><td>No</td></tr>\n<tr><td>Hígado</td><td>Sí, el borde a menos de 3 cm bajo el reborde costal en inspiración profunda</td></tr>\n<tr><td>Bazo</td><td>Casi nunca. Para palparse debe estar 2 a 3 veces aumentado (salvo ptosis esplénica en mujeres delgadas o en el puerperio)</td></tr>\n<tr><td>Riñón</td><td>En personas delgadas, el tercio inferior del derecho y el polo inferior del izquierdo</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 47 · PDF 840-842; Conceptos de Gastro TeamMedic</p>\n</section>\n\n<section id=\"a-hig\" data-t=\"Hígado y vesícula\">\n<h3>Hígado y vesícula</h3>\n<div class=\"tw\"><table>\n<tr><th>Maniobra</th><th>Cómo se hace</th><th>Para qué</th></tr>\n<tr><td><b>Monomanual</b></td><td>Mano derecha algo oblicua, desde la FID hacia arriba por fuera de los rectos; se pide inspiración profunda. Variante: mano en cuchara</td><td>Palpación simple</td></tr>\n<tr><td><b>Chauffard</b> (peloteo hepático)</td><td>Índice y medio de la mano izquierda (pulgar en oposición) en el <b>ángulo costomuscular derecho</b>; la mano posterior da pequeños impulsos hacia delante y la anterior percibe el hígado</td><td>Palpación bimanual con peloteo</td></tr>\n<tr><td><b>Gilbert</b></td><td>Médico a la derecha mirando a los pies; <b>mano derecha paralela y mano izquierda perpendicular al reborde costal</b>, unidas formando ángulo recto; asciende desde la FID</td><td><mark>Hígados blandos</mark> (hígado graso)</td></tr>\n<tr><td><b>Mathieu</b> (enganche)</td><td>Ambas manos juntas con los dedos en gancho, cerca del reborde costal derecho; se engancha el borde hepático durante la inspiración profunda</td><td>La más usada</td></tr>\n<tr><td><b>Brugsch</b></td><td>Técnica bimanual; en el banco solo preguntan para qué sirve</td><td>Método de elección para el <b>hígado cirrótico</b></td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Hígado palpable</th><th>Consistencia</th><th>Borde y superficie</th><th>Dolor</th></tr>\n<tr><td>Hepatitis aguda (ictericia, fiebre)</td><td>Blanda</td><td>Lisa</td><td>Difuso</td></tr>\n<tr><td>Absceso hepático (fiebre)</td><td>Blanda</td><td>Lisa</td><td>Circunscrito</td></tr>\n<tr><td>Insuficiencia cardíaca derecha (ingurgitación yugular)</td><td>Firme</td><td><b>Borde romo</b>, reflujo hepatoyugular</td><td>Doloroso</td></tr>\n<tr><td>Cirrosis</td><td>Dura</td><td><b>Borde agudo (filoso)</b>, superficie irregular</td><td>No</td></tr>\n<tr><td>Hepatocarcinoma o metástasis</td><td>Dura, pétrea</td><td>Superficie nodular, irregular</td><td>Variable</td></tr>\n</table></div>\n<p><b>Vesícula.</b> <b>Murphy</b>: se abrazan los hipocondrios y los pulgares presionan debajo de las costillas en la unión con el <b>borde externo del recto</b> (punto cístico); se pide inspiración profunda. Es positivo si el paciente refiere dolor o <mark>detiene la inspiración</mark>: colecistitis aguda. <b>Courvoisier-Terrier</b>: ictericia progresiva + vesícula palpable no dolorosa (signo de Bard y Pick) = obstrucción extrahepática; clásicamente, tumor de la cabeza del páncreas. <b>Tríada de Charcot</b> (colangitis): ictericia + dolor abdominal + fiebre.</p>\n<p class=\"ref\">Argente cap. 47 · PDF 843-849</p>\n</section>\n\n<section id=\"a-bazo\" data-t=\"Bazo\">\n<h3>Bazo</h3>\n<p>Se ubica a la altura de la 9.ª a 11.ª costilla izquierda; el polo superior es posterior (hacia la columna) y el inferior apunta hacia delante, al ángulo esplénico del colon. Crece hacia la FID y se reconoce por su movilidad respiratoria y su borde con escotaduras.</p>\n<div class=\"tw\"><table>\n<tr><th>Maniobra</th><th>Posición y técnica</th></tr>\n<tr><td><b>Bimanual en decúbito dorsal</b> (enganche)</td><td>Examinador a la derecha o a la izquierda; una mano rechaza la parrilla costal izquierda hacia delante y la otra, en cuchara, busca el polo bajo el reborde costal</td></tr>\n<tr><td><b>Middleton</b></td><td>El paciente coloca el <b>antebrazo izquierdo flexionado detrás de la espalda</b>, presionando las costillas 10 a 12 para elevar la región y sacar el bazo de su celda</td></tr>\n<tr><td><b>Naegeli</b></td><td>Decúbito intermedio lateral derecho a 45° (<b>posición de Schuster</b>); el examinador <b>apoya su rodilla</b> contra la región lumbar del paciente para
