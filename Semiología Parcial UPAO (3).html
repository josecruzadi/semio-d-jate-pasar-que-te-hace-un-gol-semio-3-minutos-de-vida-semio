opts:[`Mitral y tricúspide`,`Aórtica y pulmonar`,`Este cierre da lugar al segundo ruido`,`Este cierre da lugar al cuarto ruido`],ans:0,exp:`Se cierran las AV (S1); las semilunares se cierran al final de la sístole (S2).`},
{id:'tm-03',src:'tm',mod:'cardio',tema:'Ciclo cardíaco',stem:`Joven de 19 años con taquicardia extrema (180 lpm) tras un accidente deportivo. ¿Qué fase del ciclo desaparece o se reduce al mínimo en primer lugar?`,
opts:[`Llenado ventricular rápido`,`Sístole auricular`,`Contracción isovolumétrica`,`Diástasis`],ans:3,exp:`Al subir la frecuencia se acorta sobre todo la diástole, y lo primero que se pierde es la diástasis (llenado lento).`},
{id:'tm-04',src:'tm',mod:'cardio',tema:'Ruidos',stem:`Paciente de 54 años con insuficiencia cardíaca. El galope por S3 se relaciona con:`,
opts:[`El volumen diastólico final`,`El llenado ventricular rápido`,`La diástole tardía`,`La contracción auricular`],ans:1,exp:`S3 = llenado rápido. La contracción auricular corresponde al S4.`},
{id:'tm-05',src:'tm',mod:'cardio',tema:'Ruidos',stem:`Respecto a los ruidos cardíacos, marque la FALSA:`,
opts:[`R2 se debe al cierre de las válvulas aórtica y pulmonar`,`R2 es de tono ligeramente alto y dura 0,11 s`,`R1 se debe al cierre mitral y tricuspídeo`,`R1 es de tono ligeramente bajo y dura 0,14 s`,`R3 se produce inmediatamente antes del primer ruido`],ans:4,exp:`Inmediatamente antes de S1 está el S4 (presistólico). El S3 va justo después de S2.`},
{id:'tm-06',src:'tm',mod:'cardio',tema:'Desdoblamientos',stem:`En el desdoblamiento fisiológico del segundo ruido sucede que:`,
opts:[`P2 ocurre más tarde en la inspiración`,`A2 y P2 se angostan en la inspiración`,`P2 ocurre más tarde en la espiración`,`A2 y P2 se superponen en la inspiración`],ans:0,exp:`En inspiración se separan porque P2 se retrasa.`},
{id:'tm-07',src:'tm',mod:'cardio',tema:'Ruidos',stem:`Varón sano de 35 años; R1 más intenso en el ápex y desdoblamiento de R2. Señale lo INCORRECTO:`,
opts:[`El desdoblamiento de S2 es máximo en la espiración`,`El desdoblamiento de S2 es más frecuente en jóvenes`,`S1 se oye único a pesar de cierta asincronía mitral-tricuspídea`,`S2 tiene tono más alto y duración más corta que S1`],ans:0,exp:`El fisiológico es máximo en inspiración.`},
{id:'tm-08',src:'tm',mod:'cardio',tema:'IC',stem:`Varón de 70 años con HTA y artritis reumatoide; disnea progresiva y fatiga de 3 meses con edema de tobillos. PA 130/80. Choque en 5.º EIC-LMC, ruidos rítmicos sin soplos, frote pericárdico sistodiastólico, ingurgitación yugular (−) y reflujo hepatoyugular (+). El posible trastorno es:`,
opts:[`Insuficiencia cardíaca`,`Cardiopatía hipertrófica`,`Valvulopatía reumática`,`Pericarditis reumática`],ans:0,exp:`Cumple Framingham: un criterio mayor (reflujo hepatoyugular) y dos menores (edema de tobillos y disnea de esfuerzo). La lámina del banco señala esta opción.`,conf:'media'},
{id:'tm-09',src:'tm',mod:'cardio',tema:'Focos',stem:`El foco aórtico accesorio se evalúa en:`,
opts:[`2.º EIC derecho, reborde esternal derecho`,`3.er EIC izquierdo, reborde esternal izquierdo`,`2.º EIC izquierdo, reborde esternal izquierdo`,`4.º EIC izquierdo, reborde esternal izquierdo`],ans:1,exp:`Foco de Erb: 3.er EIC izquierdo. Ahí se oye mejor la IA.`},
{id:'tm-10',src:'tm',mod:'cardio',tema:'Soplos',stem:`Si un soplo ocurre temprano en la sístole, se llama:`,
opts:[`Holosistólico`,`Protosistólico`,`Telesistólico`,`Mesosistólico`,`Pansistólico`],ans:1,exp:`Proto = inicio, meso = mitad, tele = final, holo = toda la fase.`},
{id:'tm-11',src:'tm',mod:'cardio',tema:'Soplo inocente',stem:`Mujer de 25 años, atleta, con soplo sistólico tricuspídeo II/VI no irradiado que desaparece con la bipedestación. Causa más probable:`,
opts:[`Soplo benigno`,`Estenosis mitral`,`Insuficiencia tricuspídea`,`Soplo de Still`],ans:0,exp:`Sistólico, bajo grado, sin irradiación, que se va de pie: soplo inocente o funcional. El de Still es de niños de 2 a 7 años.`},
{id:'tm-12',src:'tm',mod:'cardio',tema:'Soplo inocente',stem:`Mujer de 19 años con hipertiroidismo tratado; soplo sistólico pulmonar II/VI no irradiado que desaparece con Valsalva. Diagnóstico más probable:`,
opts:[`Insuficiencia pulmonar`,`Soplo de Still`,`Estenosis pulmonar`,`Soplo benigno`],ans:3,exp:`Soplo funcional de estado hiperdinámico (hipertiroidismo).`},
{id:'tm-13',src:'tm',mod:'cardio',tema:'Maniobras',fija:true,stem:`Soplo diastólico grado III cuyo foco no se identifica bien. Maniobras: Harvey (+), Pachón (−) y Azoulay (+). Marque la correcta:`,
opts:[`Faltarían Rivero-Carvallo y Valsalva`,`Se auscultará con mayor intensidad en el 3.er EIC izquierdo`,`El foco será el 2.º EIC paraesternal izquierdo`,`Muy probablemente se irradiará a la axila`],ans:1,exp:`Diastólico + base (Harvey +) + izquierdo (Azoulay +) = IA, que se oye mejor en Erb (3.er EIC izquierdo).`},
{id:'tm-14',src:'tm',mod:'cardio',tema:'Maniobras',fija:true,stem:`Mujer de 60 años con soplo sistólico de ubicación dudosa: un médico dice que es aórtico y otro que es mitral. Marque la correcta:`,
opts:[`La maniobra de Harvey mostrará la diferencia`,`La maniobra de Azoulay servirá para diferenciarlos`,`La maniobra de Valsalva determinará el foco`,`La maniobra de Pachón no ayudará`],ans:0,exp:`Ambos son izquierdos (Azoulay + en los dos), pero solo el aórtico es de la base: Harvey + en el aórtico y − en el mitral.`},
{id:'tm-15',src:'tm',mod:'cardio',tema:'Insuf. aórtica',stem:`Paciente con pulso amplio de ascenso y descenso muy rápidos. Marque la correcta:`,
opts:[`Se auscultará un soplo sistólico en foco aórtico`,`Se auscultará un soplo sistólico que aumenta con Harvey`,`Se auscultará un soplo diastólico que no se modifica con Pachón`,`Se auscultará un soplo sistólico que aumenta con Valsalva`],ans:2,exp:`Corrigan = IA: soplo diastólico de la base, que no cambia con Pachón (maniobra del ápex).`},
{id:'tm-16',src:'tm',mod:'cardio',tema:'Estenosis aórtica',stem:`Varón de 65 años con disnea de esfuerzo, angina y dos síncopes. Pulso débil y lento, soplo sistólico IV/VI rudo y áspero en 2.º EIC derecho irradiado al cuello. Diagnóstico:`,
opts:[`Estenosis aórtica`,`Insuficiencia mitral`,`Insuficiencia aórtica`,`Estenosis mitral`],ans:0,exp:`Tríada + parvus et tardus + soplo aórtico al cuello.`},
{id:'tm-17',src:'tm',mod:'cardio',tema:'Congénitas',stem:`Mujer de 22 años con fatiga y disnea de esfuerzo progresivas. Desdoblamiento fijo de S2 y soplo sistólico eyectivo en foco pulmonar; Rx con cardiomegalia leve a predominio derecho. Diagnóstico:`,
opts:[`Ductus arterioso persistente`,`Prolapso mitral`,`Cor pulmonale`,`Comunicación interauricular`],ans:3,exp:`Desdoblamiento fijo = CIA; el eyectivo pulmonar es por hiperflujo.`,ref:'Argente 36-13 · PDF 594'},
{id:'tm-18',src:'tm',mod:'cardio',tema:'Maniobras',fija:true,stem:`Varón de 50 años con pulso de amplitud aumentada y ascenso y descenso rápidos, de origen valvular. ¿Qué maniobras de auscultación serían positivas?`,
opts:[`Harvey y Pachón`,`Azoulay y Pachón`,`Harvey y Azoulay`,`Rivero-Carvallo y Pachón`],ans:2,exp:`Corrigan = IA: válvula de la base (Harvey +) y del lado izquierdo (Azoulay +).`},
{id:'tm-19',src:'tm',mod:'cardio',tema:'Maniobras',stem:`Mujer de 40 años con soplo sistólico eyectivo en el borde esternal izquierdo que aumenta con Valsalva y al ponerse de pie, y disminuye en cuclillas y al elevar las piernas. ¿Qué combinación es más compatible?`,
opts:[`Estenosis aórtica: aumenta en cuclillas y disminuye con Valsalva`,`Miocardiopatía hipertrófica obstructiva: aumenta con menor precarga`,`CIA: aumenta en espiración y se asocia a S2 único`,`Insuficiencia mitral: aumenta solo con inspiración profunda`],ans:1,exp:`Con menos precarga el ventrículo se achica y la obstrucción dinámica empeora. Solo MCH obstructiva y prolapso mitral aumentan con Valsalva.`},
{id:'tm-20',src:'tm',mod:'cardio',tema:'Pulso venoso',stem:`Para diferenciar la vena yugular interna de la arteria carótida, la vena debe cumplir una de estas condiciones:`,
opts:[`Es compresible`,`Presenta una onda de pulso`,`No cambia en la inspiración`,`La compresión abdominal no la modifica`],ans:0,exp:`El pulso venoso desaparece al comprimir suavemente la base del cuello, cambia con la respiración y sube con la compresión abdominal.`,ref:'Argente 35-4 · PDF 454'},
{id:'tm-21',src:'tm',mod:'cardio',tema:'Pulso venoso',stem:`Varón de 59 años, diabético e hipertenso, con tumoración anteroinferior del cuello de 2 años, taquicardia, diaforesis y pérdida de peso; se observa distensión de venas superficiales del cuello. Esto se relaciona con:`,
opts:[`Bocio`,`Insuficiencia cardíaca crónica descompensada`,`Enfermedad renal crónica`,`Hipertensión portal`],ans:0,exp:`Bocio grande (con hipertiroidismo) que comprime el retorno venoso del cuello.`},
{id:'tm-22',src:'tm',mod:'cardio',tema:'Pericardio',stem:`Paciente con cáncer de ovario en quimioterapia, disnea progresiva; eco con derrame pericárdico y colapso de cavidades derechas (taponamiento). En el examen de venas esperaría:`,
opts:[`Colapso de las ondas a`,`Signo de Musset`,`Ingurgitación yugular bilateral`,`Ingurgitación unilateral derecha`],ans:2,exp:`En el taponamiento la ingurgitación es bilateral (100%) y suele aumentar en inspiración (Kussmaul).`,ref:'Argente 36-6 · PDF 548'},
{id:'tm-23',src:'tm',mod:'cardio',tema:'Pulso venoso',stem:`Varón de 65 años con disnea, edemas y ortopnea. La distancia del ángulo de Louis al tope de la onda venosa es de 8 cm. Es correcto:`,
opts:[`Se deben sumar 2 cm hasta el eje flebostático`,`El paciente tiene aumento de la presión venosa central`,`Es una presión normal`,`La medición es errónea`],ans:1,exp:`El ángulo de Louis está unos 5 cm sobre la aurícula derecha: 8 + 5 = 13 cmH₂O, por encima del normal (8-12, Argente). Más de 3-4 cm sobre el ángulo ya es ingurgitación.`},
{id:'tm-24',src:'tm',mod:'cardio',tema:'Pulso venoso',stem:`En la evaluación del pulso venoso yugular, ¿qué onda desaparece usualmente en la fibrilación auricular?`,
opts:[`a`,`v`,`y`,`c`,`x`],ans:0,exp:`Sin contracción auricular no hay onda a.`,ref:'Argente 35-4 · PDF 458'},
{id:'tm-25',src:'tm',mod:'cardio',tema:'Pulso venoso',stem:`La onda v gigante del pulso venoso es típica de:`,
opts:[`Taponamiento cardíaco`,`Insuficiencia aórtica`,`Insuficiencia tricuspídea`,`Pericarditis constrictiva`,`Pericarditis constrictiva y taponamiento`],ans:2,exp:`El reflujo sistólico al sistema venoso borra el colapso x y da la onda s o v gigante (pulso venoso positivo).`,ref:'Argente 35-4 · PDF 456'},
{id:'tm-26',src:'tm',mod:'cardio',tema:'TVP',stem:`Mujer de 44 años, fumadora y usuaria de anticonceptivos, con dolor y aumento de volumen del MID tras un viaje de 14 horas. Edema +++ hasta el muslo, coloración azulada, várices, Homans (+) y Olow (+). Diagnóstico:`,
opts:[`Trombosis venosa profunda`,`Trombosis arterial aguda`,`Tromboflebitis aguda`,`Insuficiencia venosa crónica`],ans:0,exp:`Factores de Virchow (estasis por viaje, estrógenos, tabaco) + edema unilateral + Homans y Olow.`},
{id:'tm-27',src:'tm',mod:'resp',tema:'Derrame pleural',stem:`Universitario con 1 mes de fiebre, dolor pleurítico, hiporexia y diaforesis; la Rx muestra curva de Damoiseau en el hemitórax derecho. Al examen se puede encontrar:`,
opts:[`Timpanismo en el espacio de Traube`,`Hiperresonancia en la mitad superior del hemitórax derecho`,`Pectoriloquia áfona en la base izquierda`,`Desplazamiento contralateral del choque de punta`],ans:1,exp:`Por encima de un derrame el pulmón comprimido suena hipersonoro (sonoridad skódica). La pectoriloquia sería del lado derecho, y el choque solo se desplaza con derrames masivos.`,conf:'media'},
{id:'tm-28',src:'tm',mod:'resp',tema:'Mamas',stem:`Mujer de 36 años con tumoración mamaria derecha poco móvil en el cuadrante superoexterno. ¿Qué prueba confirma el diagnóstico?`,
opts:[`Marcadores tumorales`,`Biopsia del tumor`,`Tomografía de tórax`,`Ecografía mamaria`],ans:1,exp:`El diagnóstico de cáncer es histológico.`}
);

// HC y signos vitales: no llegó banco propio; preguntas de práctica armadas sobre el Argente (caps. 9, 14, 21, 35).
S.qs.push(
{id:'cl-h01',src:'cl',mod:'hc',tema:'Facies',stem:`Varón de 40 años que se hirió el pie con un clavo hace 10 días. Tiene trismus y una sonrisa forzada permanente por contractura de los músculos de la cara. La facies es:`,
opts:[`Hipocrática`,`Sardónica`,`Parkinsoniana`,`Leonina`],ans:1,exp:`Risa sardónica del tétanos. Fue pregunta del parcial 2022.`},
{id:'cl-h02',src:'cl',mod:'hc',tema:'Facies',stem:`Mujer de 35 años con palidez, cianosis peribucal y eritrosis malar. Refiere disnea de esfuerzo progresiva. ¿Qué facies es y qué sugiere?`,
opts:[`Lúpica, LES`,`Mitral, estenosis mitral`,`Cushingoide, hipercortisolismo`,`Hipertiroidea, Graves`],ans:1,exp:`La facies mitral es la de la estenosis mitral.`,ref:'Argente cap. 21 · PDF 239'},
{id:'cl-h03',src:'cl',mod:'hc',tema:'Decúbito',stem:`Paciente con derrame pericárdico grande que se mantiene sentado e inclinado hacia delante, apoyado sobre las rodillas. Esta actitud se denomina:`,
opts:[`Ortopnea`,`Gatillo de fusil`,`Plegaria mahometana`,`Opistótonos`],ans:2,exp:`Posición genupectoral o en plegaria mahometana del derrame pericárdico.`,ref:'Argente cap. 21 · PDF 237'},
{id:'cl-h04',src:'cl',mod:'hc',tema:'Somatometría',stem:`Mujer de 1,60 m y 72 kg. Su IMC y su interpretación son:`,
opts:[`24,1 · normal`,`28,1 · sobrepeso`,`30,2 · obesidad I`,`26,0 · sobrepeso`],ans:1,exp:`72 / 1,6² = 72 / 2,56 = 28,1 → sobrepeso (25 a 29,9).`},
{id:'cl-h05',src:'cl',mod:'hc',tema:'Presión arterial',stem:`Al tomar la PA de un paciente hipertenso, los ruidos desaparecen entre 170 y 150 mmHg y reaparecen hasta 90 mmHg. Si solo se hubiera auscultado inflando hasta 160 mmHg, se habría registrado una sistólica falsamente baja. ¿Qué se debe hacer para evitarlo?`,
opts:[`Usar un manguito más angosto`,`Estimar primero la sistólica por palpación del pulso radial`,`Tomar la PA con el brazo colgando`,`Desinflar a 10 mmHg por segundo`],ans:1,exp:`Brecha auscultatoria: se infla 20-30 mmHg por encima de la sistólica palpatoria.`},
{id:'cl-h06',src:'cl',mod:'hc',tema:'Signos vitales',stem:`Paciente con fiebre de 39,5 °C y pulso de 72 lpm, con sospecha de fiebre tifoidea. Este hallazgo se llama:`,
opts:[`Signo de Faget (disociación esfigmotérmica)`,`Pulso paradójico`,`Signo de Pel-Ebstein`,`Bradicardia sinusal fisiológica`],ans:0,exp:`Fiebre con bradicardia relativa = disociación esfigmotérmica (Faget): tifoidea, Legionella, brucelosis, fiebre por fármacos.`,ref:'Argente cap. 14 · PDF 162'},
{id:'cl-h07',src:'cl',mod:'hc',tema:'Fiebre',stem:`Paciente con linfoma de Hodgkin que presenta períodos de fiebre de 4 a 5 días que alternan con períodos afebriles de igual duración. ¿Qué tipo de fiebre es?`,
opts:[`Continua`,`Remitente`,`Recurrente (Pel-Ebstein)`,`Intermitente`],ans:2,exp:`Pel-Ebstein es la forma clásica de fiebre recurrente.`},
{id:'cl-h08',src:'cl',mod:'hc',tema:'Anamnesis',stem:`En la anamnesis, "apetito, sed, sueño, orina, deposiciones y variación de peso" corresponden a:`,
opts:[`Antecedentes personales fisiológicos`,`Revisión por sistemas`,`Funciones biológicas`,`Enfermedad actual`],ans:2,exp:`Son las funciones biológicas.`}
);

// Neuro: no llegó banco propio; preguntas de práctica armadas sobre el Argente (cap. 71-72) en el estilo del parcial.
S.qs.push(
{id:'cl-n01',src:'cl',mod:'neuro',tema:'Glasgow',stem:`Varón de 60 años tras un TEC: abre los ojos al llamarlo, dice palabras inapropiadas y retira el miembro ante el dolor. ¿Glasgow?`,
opts:[`9`,`10`,`11`,`12`,`8`],ans:1,exp:`O3 (a la voz) + V3 (palabras inapropiadas) + M4 (retira) = 10.`},
{id:'cl-n02',src:'cl',mod:'neuro',tema:'Glasgow',stem:`Paciente que ante el dolor presenta flexión anormal de los miembros superiores con extensión de los inferiores. ¿Cuánto puntúa la respuesta motora?`,
opts:[`2`,`3`,`4`,`5`,`1`],ans:1,exp:`Decorticación = flexión anormal = M3. La descerebración (extensión) es M2.`},
{id:'cl-n03',src:'cl',mod:'neuro',tema:'VII par',stem:`Mujer de 30 años despierta con la hemicara izquierda caída: no puede fruncir el ceño ni cerrar el ojo izquierdo y, al intentarlo, el globo ocular se dirige hacia arriba. ¿Qué es?`,
opts:[`Parálisis facial central derecha`,`Parálisis facial periférica izquierda con signo de Bell`,`Parálisis del III par izquierdo`,`Parálisis facial central izquierda`],ans:1,exp:`Compromiso de toda la hemicara (incluida la frente) + signo de Bell = parálisis periférica del mismo lado.`},
{id:'cl-n04',src:'cl',mod:'neuro',tema:'XII par',stem:`Al sacar la lengua, esta se desvía hacia la derecha y muestra atrofia y fasciculaciones en la hemilengua derecha. La lesión está en:`,
opts:[`Hipogloso izquierdo`,`Hipogloso derecho`,`Vago derecho`,`Glosofaríngeo izquierdo`],ans:1,exp:`La lengua se desvía hacia el lado del hipogloso lesionado; atrofia y fasciculaciones = 2.ª motoneurona.`},
{id:'cl-n05',src:'cl',mod:'neuro',tema:'IX-X par',stem:`Al decir "aaa", la úvula se desvía hacia la izquierda y el velo derecho no se eleva. ¿Qué nervio está lesionado?`,
opts:[`Vago izquierdo`,`Vago derecho`,`Hipogloso derecho`,`Facial derecho`],ans:1,exp:`La úvula es traccionada hacia el lado sano: lesión del X derecho (signo de la cortina).`},
{id:'cl-n06',src:'cl',mod:'neuro',tema:'III par',stem:`Diabético de 58 años con diplopía súbita; el ojo derecho está desviado hacia abajo y afuera, con ptosis palpebral derecha y pupila normal. ¿Qué par está afectado?`,
opts:[`IV derecho`,`VI derecho`,`III derecho`,`III izquierdo`],ans:2,exp:`III par: ptosis + ojo abajo y afuera. Con pupila respetada sugiere causa isquémica (diabetes); si hay midriasis, compresiva (aneurisma).`},
{id:'cl-n07',src:'cl',mod:'neuro',tema:'Motoneurona',stem:`Paciente con hemiparesia derecha, hiperreflexia, clonus aquíleo y Babinski derecho. Es un síndrome de:`,
opts:[`2.ª motoneurona`,`1.ª motoneurona (piramidal)`,`Cerebeloso`,`Extrapiramidal`],ans:1,exp:`Paresia + espasticidad + hiperreflexia + Babinski = piramidal.`},
{id:'cl-n08',src:'cl',mod:'neuro',tema:'Motoneurona',stem:`¿Qué hallazgo orienta a lesión de 2.ª motoneurona?`,
opts:[`Signo de Babinski`,`Espasticidad en navaja`,`Fasciculaciones y atrofia precoz`,`Clonus`],ans:2,exp:`Atrofia, fasciculaciones, hipotonía y arreflexia son de 2.ª motoneurona.`},
{id:'cl-n09',src:'cl',mod:'neuro',tema:'Reflejos',stem:`¿Qué par reflejo-raíz es correcto?`,
opts:[`Rotuliano - S1`,`Aquíleo - L4`,`Tricipital - C7`,`Bicipital - C8`],ans:2,exp:`Bicipital C5-C6, tricipital C7, rotuliano L3-L4, aquíleo S1.`},
{id:'cl-n10',src:'cl',mod:'neuro',tema:'Coordinación',stem:`Paciente con déficit de vitamina B12 que se mantiene de pie con los ojos abiertos, pero se cae al cerrarlos. Tiene además vibración abolida en los pies. ¿Qué tipo de ataxia es?`,
opts:[`Cerebelosa`,`Sensitiva (cordonal posterior)`,`Vestibular central`,`Frontal`],ans:1,exp:`Romberg positivo = la visión compensa la falta de propiocepción.`},
{id:'cl-n11',src:'cl',mod:'neuro',tema:'Coordinación',stem:`Alcohólico con marcha de base amplia, dismetría en el dedo-nariz, temblor intencional y adiadococinesia; su inestabilidad no cambia al cerrar los ojos. Síndrome:`,
opts:[`Cordonal posterior`,`Cerebeloso`,`Piramidal`,`Radicular`],ans:1,exp:`Ataxia cerebelosa: el Romberg no se modifica con los ojos cerrados.`},
{id:'cl-n12',src:'cl',mod:'neuro',tema:'Meníngeos',stem:`En decúbito dorsal, con la cadera flexionada a 90°, el paciente no puede extender la rodilla por dolor. Es el signo de:`,
opts:[`Brudzinski`,`Kernig`,`Lewinson`,`Lasègue`],ans:1,exp:`Kernig. Brudzinski es la flexión de caderas y rodillas al flexionar el cuello.`},
{id:'cl-n13',src:'cl',mod:'neuro',tema:'Meníngeos',stem:`Al flexionar pasivamente el cuello de un paciente febril, este flexiona involuntariamente caderas y rodillas. Es el signo de:`,
opts:[`Kernig`,`Brudzinski`,`Lhermitte`,`Babinski`],ans:1,exp:`Brudzinski de nuca.`},
{id:'cl-n14',src:'cl',mod:'neuro',tema:'Lenguaje',stem:`Varón con ACV que habla con fluidez pero emite parafasias y jerga, no comprende órdenes simples ni puede repetir frases. ¿Qué afasia es?`,
opts:[`Broca`,`Wernicke`,`De conducción`,`Transcortical motora`],ans:1,exp:`Fluente + comprensión alterada = Wernicke (temporal superior izquierdo).`},
{id:'cl-n15',src:'cl',mod:'neuro',tema:'Lenguaje',stem:`Paciente que comprende todo pero habla con esfuerzo, con frases cortas y sin poder repetir. ¿Qué afasia es?`,
opts:[`Broca`,`Wernicke`,`De conducción`,`Global`],ans:0,exp:`No fluente con comprensión conservada = Broca (frontal inferior izquierdo).`},
{id:'cl-n16',src:'cl',mod:'neuro',tema:'VIII par',stem:`Weber lateraliza al oído izquierdo y el Rinne es positivo en ambos oídos. Interpretación:`,
opts:[`Hipoacusia de conducción izquierda`,`Hipoacusia neurosensorial derecha`,`Hipoacusia neurosensorial izquierda`,`Normal`],ans:1,exp:`Con Rinne positivo bilateral no hay problema de conducción; el Weber va al oído sano, así que el enfermo es el derecho (neurosensorial).`}
);

// Neuro: Banco histórico TeamMedic (NEUROSEMIO: conciencia, motor sensitivo, valoración refleja, pares craneales, cerebelo y núcleos de la base, telencéfalo, meninges). Claves del banco, resueltas y explicadas con Argente cap. 71-72.
S.qs.push(
{id:'tmh-n01',src:'tmh',mod:'neuro',tema:`Glasgow`,stem:`Paciente que cayó desde el segundo piso mientras pintaba su balcón. Abre los ojos al presionar intensamente los trapecios, flexiona el miembro superior ante el estímulo doloroso y no tiene respuesta verbal. ¿Qué puntaje de Glasgow tiene y qué grado de TCE presenta?`,
opts:[`7 pts - TEC severo`,`6 pts - TEC severo`,`9 pts - TEC severo`,`8 pts - TEC severo`],ans:0,exp:`Ojos al dolor (2) + sin respuesta verbal (1) + retira/flexiona (4) = 7. Glasgow de 8 o menos = TEC severo.`},
{id:'tmh-n02',src:'tmh',mod:'neuro',tema:`Glasgow`,stem:`Paciente que ingresa a emergencia tras un accidente vehicular: sin respuesta verbal, sin apertura ocular, extremidades espásticas con muñecas flexionadas y antebrazos rotados y extendidos. Usted puede concluir que:`,
opts:[`Presenta 6 puntos en el score de coma de Glasgow`,`Presenta un trauma encefalocraneano moderado`,`En el componente motor se obtienen 3 puntos`,`El paciente amerita TC cerebral e intubación endotraqueal`],ans:3,exp:`Postura de descerebración: M2. Total = O1 + V1 + M2 = 4, TEC severo. Con Glasgow ≤ 8 se protege la vía aérea (intubación) y se pide TC cerebral.`},
{id:'tmh-n03',src:'tmh',mod:'neuro',tema:`Glasgow`,stem:`Paciente politraumatizado que abre los ojos al hablarle, retira la mano ante estímulos dolorosos y tiene lenguaje inapropiado. ¿Qué puntaje de Glasgow le corresponde?`,
opts:[`9`,`8`,`10`,`11`],ans:2,exp:`Ojos a la voz (3) + palabras inapropiadas (3) + retira al dolor (4) = 10.`},
{id:'tmh-n04',src:'tmh',mod:'neuro',tema:`Glasgow`,stem:`Paciente de un accidente de tránsito que abre los ojos ante un estímulo doloroso, emite sonidos incomprensibles y evita el estímulo nociceptivo retirando la parte del cuerpo explorada. Establezca la escala de Glasgow.`,
opts:[`7`,`8`,`9`,`10`],ans:1,exp:`Ojos al dolor (2) + sonidos incomprensibles (2) + retira (4) = 8.`},
{id:'tmh-n05',src:'tmh',mod:'neuro',tema:`Niveles de conciencia`,stem:`Paciente politraumatizado que se encuentra dormido y que, al evaluar el nivel de conciencia, despierta solo transitoriamente con un estímulo nociceptivo. El paciente presenta:`,
opts:[`Somnolencia`,`Confusión`,`Estupor`,`Obnubilación`],ans:2,exp:`Estupor (sopor): solo despierta con estímulos dolorosos y vuelve a dormirse. En la somnolencia despierta con la voz.`},
{id:'tmh-n06',src:'tmh',mod:'neuro',tema:`Escala FOUR`,stem:`Paciente con TCE severo y ventilación irregular, intubado. Para evaluar el nivel de conciencia a las 48 horas se usa el score FOUR. ¿Qué parámetro no es considerado en esta escala?`,
opts:[`Apertura ocular`,`Respuesta fotomotor`,`Reflejo corneal`,`Frecuencia respiratoria`],ans:3,exp:`FOUR evalúa respuesta ocular, motora, reflejos de tronco (pupilar y corneal) y patrón respiratorio (no la frecuencia respiratoria). Sirve en el paciente intubado porque no necesita la respuesta verbal.`},
{id:'tmh-n07',src:'tmh',mod:'neuro',tema:`Vías sensitivas`,stem:`Paciente con dificultad a la marcha y antecedente de siringomielia postraumática. Al examen tiene apalestesia y Romberg positivo. ¿Qué función está atribuida al tracto comprometido?`,
opts:[`Sensibilidad termoalgésica`,`Tacto protopático`,`Propiocepción inconsciente`,`Estereognosia`],ans:3,exp:`Apalestesia y Romberg positivo indican cordón posterior. Este tracto lleva vibración, tacto epicrítico, propiocepción consciente y estereognosia. Termoalgesia y tacto protopático van por el espinotalámico.`},
{id:'tmh-n08',src:'tmh',mod:'neuro',tema:`Sensibilidades`,stem:`Respecto a las sensibilidades somestésicas, indique la asociación incorrecta:`,
opts:[`Barestesia: grados de presión táctil`,`Palestesia: reconocimiento de vibraciones`,`Batiestesia: posición segmentaria corporal`,`Estereognosia: reconocimiento de trazos dibujados sobre la piel del paciente`,`Barognosia: reconocimiento de pesos de objetos al tacto`],ans:3,exp:`Reconocer trazos dibujados sobre la piel es grafestesia. La estereognosia es reconocer objetos por el tacto.`},
{id:'tmh-n09',src:'tmh',mod:'neuro',tema:`Escala de Daniels`,stem:`Varón con debilidad de miembros superiores e inferiores. En los miembros inferiores no vence la gravedad ni la resistencia, pero hay movimiento horizontal en ambos. En los miembros superiores hay movimiento activo, puede abducir los hombros pero no vence la resistencia. Según la escala de Daniels, la puntuación correcta es:`,
opts:[`3 en miembros superiores`,`4 en miembros inferiores`,`3 en miembros inferiores`,`2 en miembros superiores`,`1 en miembros inferiores`],ans:0,exp:`Miembros inferiores: movimiento activo sin vencer gravedad = 2. Miembros superiores: vence gravedad pero no resistencia = 3.`},
{id:'tmh-n10',src:'tmh',mod:'neuro',tema:`Brown-Séquard`,stem:`Paciente con síndrome de Brown-Séquard. ¿Qué sensibilidad estará abolida del lado ipsilateral?`,
opts:[`Propiocepción`,`Termoalgesia`,`Analgesia`,`Ninguna de las anteriores`],ans:0,exp:`El cordón posterior no ha cruzado, así que la propiocepción se pierde del mismo lado de la lesión. La termoalgesia (espinotalámico) se pierde del lado contrario.`},
{id:'tmh-n11',src:'tmh',mod:'neuro',tema:`Síndrome medular posterior`,stem:`Varón con síndrome medular posterior por neurosífilis. En la exploración sensitiva, no presentaría:`,
opts:[`Imposibilidad para reconocer vibraciones`,`Anestesia del tacto epicrítico`,`Anestesia termoalgésica contralateral`,`Ataxia y test de Romberg positivo`],ans:2,exp:`En el cordón posterior (tabes) se afectan vibración, tacto epicrítico y propiocepción, con ataxia sensitiva y Romberg positivo. La termoalgesia no se altera.`},
{id:'tmh-n12',src:'tmh',mod:'neuro',tema:`Reflejos`,stem:`Paciente con abolición del reflejo bicipital. ¿Qué raíz nerviosa estaría comprometida?`,
opts:[`Raíz C4`,`Raíz C5`,`Raíz C6`,`Raíz C7`],ans:1,exp:`Reflejo bicipital: C5-C6. De las opciones, la clave del banco es C5.`,conf:'media'},
{id:'tmh-n13',src:'tmh',mod:'neuro',tema:`Vía piramidal`,stem:`¿Cuál de los siguientes signos no constituye un sucedáneo de Babinski?`,
opts:[`Signo de Gordon`,`Signo de Oppenheim`,`Signo de Chaddock`,`Signo de Lhermitte`,`Signo de Bing`],ans:3,exp:`Los sucedáneos de Babinski son Gordon, Oppenheim, Chaddock, Schaeffer, Bing y Gonda. Lhermitte es la descarga eléctrica al flexionar el cuello.`},
{id:'tmh-n14',src:'tmh',mod:'neuro',tema:`Vía piramidal`,stem:`Es considerado un signo patognomónico de la lesión de la vía piramidal:`,
opts:[`Signo de Phalen`,`Hiperreflexia`,`Babinski`,`Lasègue`,`Kernig`],ans:2,exp:`Babinski. Es normal en el recién nacido y el lactante. Phalen es del túnel carpiano; Lasègue, de radiculopatía; Kernig, de meninges.`},
{id:'tmh-n15',src:'tmh',mod:'neuro',tema:`Motoneurona superior`,stem:`Uno de los siguientes hallazgos clínicos es un signo de motoneurona superior. Márquele la alternativa falsa:`,
opts:[`Hipertonía en hoja de navaja`,`Hiperreflexia de reflejos osteotendinosos`,`Espasticidad de flexores en miembros superiores`,`Fasciculaciones`],ans:3,exp:`Las fasciculaciones son de la segunda motoneurona (junto con hipotonía, atrofia precoz y arreflexia).`},
{id:'tmh-n16',src:'tmh',mod:'neuro',tema:`Babinski y sucedáneos`,stem:`Paciente con diabetes mellitus e hipertensión, con alteración del habla de inicio súbito y debilidad del miembro inferior derecho. El neurólogo comprime con ambas manos los gastrocnemios y aprecia extensión del hallux. El signo evidenciado es:`,
opts:[`Oppenheim`,`Gordon`,`Schaeffer`,`Chaddock`],ans:1,exp:`Gordon: compresión de los gemelos. Oppenheim: deslizar sobre la tibia. Schaeffer: compresión del tendón de Aquiles. Chaddock: estímulo en el maléolo externo.`},
{id:'tmh-n17',src:'tmh',mod:'neuro',tema:`Primera motoneurona`,stem:`Paciente llevado a emergencia tras pérdida transitoria de conciencia, con sonidos ininteligibles. Presenta hipertonía del miembro superior derecho, reflejo rotuliano derecho exaltado (++/+++) y reflejo abdominal superior abolido. De acuerdo con los hallazgos, usted puede afirmar:`,
opts:[`Presenta lesión de segunda motoneurona derecha`,`Presenta lesión de motoneurona superior de hemisferio derecho`,`Presenta lesión de primera motoneurona`,`Presenta lesión de neurona motora de primer orden de hemisferio izquierdo`],ans:3,exp:`Hipertonía, hiperreflexia y reflejos cutáneos abolidos son de primera motoneurona. La lesión está en el hemisferio contrario al lado afectado, o sea el izquierdo.`},
{id:'tmh-n18',src:'tmh',mod:'neuro',tema:`I par`,stem:`Paciente que colisiona en moto contra un poste y cae sobre la acera sin casco. Presenta epistaxis anterior, signo de ojos de mapache y anosmia. Respecto a la exploración del I par craneal, usted puede afirmar que:`,
opts:[`La anosmia se explica por fractura de la lámina cribosa`,`La lesión se ubica en la corteza perirrinal`,`La lesión se ubica en la fosa craneal media`,`La anosmia es por daño cortical entorrinal`],ans:0,exp:`Los fascículos olfatorios cruzan la lámina cribosa del etmoides (fosa craneal anterior). Su fractura explica la anosmia, el ojo de mapache y la epistaxis.`},
{id:'tmh-n19',src:'tmh',mod:'neuro',tema:`II par`,stem:`Paciente con diagnóstico de prolactinoma que hace 1 mes tiene dificultad visual y choca con esquinas y puertas de su hogar. El médico realiza una maniobra con la que se aproxima al diagnóstico. La maniobra y el diagnóstico probable son:`,
opts:[`Confrontación de campos - hemianopsia bitemporal`,`Campimetría - cuadrantanopsia izquierda`,`Romberg - lesión de hemisferio cerebeloso`,`Romberg - síndrome medular posterior`],ans:0,exp:`El adenoma de hipófisis comprime el quiasma óptico y da hemianopsia bitemporal. La maniobra de cabecera es la confrontación de campos.`},
{id:'tmh-n20',src:'tmh',mod:'neuro',tema:`III par`,stem:`Paciente diabético de 76 años que al despertar nota dificultad para abrir el párpado izquierdo y refiere visión doble en el plano horizontal. Al examen, el reflejo pupilar está conservado. ¿Cuál es su diagnóstico?`,
opts:[`Parálisis incompleta interna del III PC`,`Parálisis completa del nervio troclear`,`Parálisis incompleta externa del III PC`,`Parálisis facial central izquierda`,`Parálisis del nervio abducens`],ans:2,exp:`Ptosis más diplopía con pupila indemne: parálisis externa (somática) del III par, típica de la neuropatía diabética. En la interna se afecta la pupila (midriasis).`,conf:'media'},
{id:'tmh-n21',src:'tmh',mod:'neuro',tema:`Músculos oculares`,stem:`Cuando una persona baja una escalera, para mirar los peldaños utiliza los músculos:`,
opts:[`Recto inferior y oblicuo superior`,`Recto superior y oblicuo inferior`,`Recto inferior y oblicuo inferior`,`Oblicuos superiores`],ans:0,exp:`Mirar hacia abajo es depresión: recto inferior y oblicuo superior.`,conf:'media'},
{id:'tmh-n22',src:'tmh',mod:'neuro',tema:`Reflejo pupilar`,stem:`Usted ilumina con su linterna el ojo izquierdo de su paciente y observa reflejo pupilar directo, pero no un reflejo consensuado. ¿Qué tipo de lesión explica este déficit?`,
opts:[`Nervio oculomotor, lado derecho`,`Nervio oculomotor, lado izquierdo`,`Nervio óptico, ojo izquierdo`,`Nervio óptico, ojo derecho`,`Vía óptica, lado derecho`],ans:0,exp:`El ojo izquierdo recibe la luz y responde (la vía aferente y la eferente izquierdas están bien). La pupila derecha no se contrae, así que falla la vía eferente derecha: oculomotor derecho.`},
{id:'tmh-n23',src:'tmh',mod:'neuro',tema:`III par`,stem:`Paciente con diplopía horizontal de 2 semanas de evolución y exotropía. Con base en esto es cierto que:`,
opts:[`La lesión afecta la rama superior del N. oculomotor`,`La lesión afecta la rama inferior del N. oculomotor`,`Existe una oftalmoplejía completa del III par craneal`,`Probablemente hay denervación del recto superior`],ans:1,exp:`La rama inferior inerva el recto medial, el recto inferior y el oblicuo inferior. Sin recto medial, el ojo queda desviado hacia afuera (exotropía) y hay diplopía horizontal.`,conf:'media'},
{id:'tmh-n24',src:'tmh',mod:'neuro',tema:`IV par`,stem:`Paciente de 30 años con diplopía que, durante la entrevista, mantiene la cabeza ligeramente inclinada hacia el hombro izquierdo. Usted concluye que:`,
opts:[`El test de Bielschowsky es positivo en la derecha`,`Existe parálisis del oculomotor`,`El test de Bielschowsky agrava la hipertropía derecha`,`Existe parálisis del recto externo derecho`],ans:0,exp:`El paciente inclina la cabeza al lado contrario del músculo paralizado para compensar. Es parálisis del oblicuo superior derecho (IV par) y el Bielschowsky es positivo en la derecha. La opción c también se parece, pero el enunciado no menciona hipertropía.`,conf:'media'},
{id:'tmh-n25',src:'tmh',mod:'neuro',tema:`VI y V par`,stem:`Mujer de 36 años con diplopía de 2 semanas. Pupilas isocóricas fotorreactivas, hendiduras palpebrales simétricas, movimientos oculares normales en el ojo izquierdo. El ojo derecho no abduce y aparece diplopía al intentarlo. Además tiene hipoestesia en la zona frontal derecha del rostro. Indique los nervios craneales lesionados:`,
opts:[`VI PC y V PC derechos`,`III PC y VII PC derechos`,`III PC y V PC derechos`,`VII PC y V PC derechos`],ans:0,exp:`No abduce: VI par (recto lateral). Hipoestesia frontal: rama oftálmica (V1) del trigémino.`},
{id:'tmh-n26',src:'tmh',mod:'neuro',tema:`VII par`,stem:`Varón de 19 años con dolor retroauricular derecho y disgeusia hace 2 días. Hoy tiene dificultad para ocluir el párpado derecho, lagrimeo y caída del surco nasogeniano al sonreír. ¿Cuál es el nervio afectado?`,
opts:[`Parálisis incompleta del III PC derecho`,`Parálisis periférica del VII PC derecho`,`Parálisis central del VII PC derecho`,`Parálisis periférica del VIII PC derecho`,`Parálisis central del VIII PC derecho`],ans:1,exp:`Compromiso de toda la hemicara (no cierra el ojo, cae el surco nasogeniano) con dolor retroauricular y disgeusia: parálisis facial periférica derecha.`},
{id:'tmh-n27',src:'tmh',mod:'neuro',tema:`VII par`,stem:`Varón con disminución del gusto en los 2/3 anteriores de la lengua, no puede cerrar bien el ojo derecho y tiene sonrisa asimétrica. Son signos que se verían presentes:`,
opts:[`Hiperacusia del oído derecho`,`Desviación de la úvula hacia el lado sano`,`Abolición o reducción del reflejo nauseoso`,`Signo de la cortina de Vernet`],ans:0,exp:`La pérdida del gusto en los 2/3 anteriores indica lesión alta del facial. La parálisis del músculo del estribo (nervio estapedio) causa hiperacusia. Úvula, reflejo nauseoso y signo de Vernet son del IX y X par.`},
{id:'tmh-n28',src:'tmh',mod:'neuro',tema:`VII par`,stem:`No es signo probable de parálisis facial periférica:`,
opts:[`Fenómeno de Bell ipsilateral a la lesión`,`Presencia de enoftalmos`,`Borramiento del pliegue nasogeniano`,`Disgeusia e hiperacusia`],ans:1,exp:`En la parálisis facial periférica no hay enoftalmos (retracción del globo ocular).`},
{id:'tmh-n29',src:'tmh',mod:'neuro',tema:`IV par`,stem:`Varón de 8 años que acude con su madre por hipertropía del ojo derecho. Respecto a este signo es correcto afirmar que:`,
opts:[`Es un indicador de lesión del III par craneal`,`Es un indicador de lesión del IV par craneal`,`Es un indicador de lesión del VI par craneal`,`Indica lesión del fascículo longitudinal medial`],ans:1,exp:`Hipertropía por parálisis del oblicuo superior = IV par (troclear).`},
{id:'tmh-n30',src:'tmh',mod:'neuro',tema:`IX par`,stem:`Varón de 58 años con dificultad para tragar desde hace 2 semanas, sobre todo líquidos, y disminución del gusto en la parte posterior de la lengua. Tiene reflejo nauseoso disminuido y pérdida de sensibilidad en el tercio posterior de la lengua del mismo lado. La movilidad del paladar está conservada. La estructura afectada más probable es:`,
opts:[`IX par craneal`,`X par craneal`,`XII par craneal`,`XI par craneal`],ans:0,exp:`El glosofaríngeo da la sensibilidad y el gusto del tercio posterior de la lengua y es la vía aferente del reflejo nauseoso. Con el paladar conservado, el X queda descartado.`},
{id:'tmh-n31',src:'tmh',mod:'neuro',tema:`XII par`,stem:`Mujer de 64 años con dificultad progresiva para articular palabras desde hace 10 días. Al protruir la lengua, esta se desvía hacia la derecha, con discreta atrofia y fasciculaciones del mismo lado. No hay alteraciones sensitivas ni del gusto. La lesión se ubica a nivel de:`,
opts:[`X par craneal`,`XI par craneal`,`XII par craneal`,`VII par craneal`],ans:2,exp:`Desviación hacia el lado enfermo, atrofia y fasciculaciones: hipogloso (2.ª motoneurona).`},
{id:'tmh-n32',src:'tmh',mod:'neuro',tema:`VPPB`,stem:`Mujer de 67 años con episodios breves de vértigo al girarse hacia la derecha en la cama o al extender el cuello. En la maniobra de Dix-Hallpike hacia la derecha, tras una latencia de algunos segundos, aparece un nistagmo torsional con componente vertical superior (hacia arriba) que dura unos 15 segundos y desaparece. La estructura anatómica comprometida es:`,
opts:[`Conducto semicircular lateral derecho`,`Conducto semicircular posterior derecho`,`Conducto semicircular superior derecho`,`Conducto semicircular lateral izquierdo`],ans:1,exp:`Nistagmo torsional con componente vertical hacia arriba, con latencia y fatigable, al Dix-Hallpike derecho: conducto posterior derecho (VPPB).`},
{id:'tmh-n33',src:'tmh',mod:'neuro',tema:`XI par`,stem:`Control posquirúrgico tras extirpar un ganglio en la región supraclavicular izquierda de la zona posterior del cuello. Presenta dolor e imposibilidad de flexión y abducción del hombro izquierdo por encima de 90°. Indique el nervio craneal comprometido:`,
opts:[`Nervio accesorio`,`Nervio glosofaríngeo`,`Nervio hipogloso`,`Nervio vago`],ans:0,exp:`El accesorio (XI) inerva el trapecio y el esternocleidomastoideo; en el triángulo posterior del cuello es vulnerable.`},
{id:'tmh-n34',src:'tmh',mod:'neuro',tema:`VPPB`,stem:`Mujer de 54 años con episodios súbitos de vértigo desde hace 2 semanas, al levantarse de la cama o al girar la cabeza hacia la derecha al dormir. Cada episodio dura menos de 30 segundos y se acompaña de náuseas; niega tinnitus, hipoacusia o sensación de oído tapado. El examen neurológico es normal entre episodios. El procedimiento más adecuado para el diagnóstico es:`,
opts:[`Maniobra de Epley`,`Maniobra de Dix-Hallpike`,`Prueba calórica vestibular`,`Audiometría tonal`],ans:1,exp:`Sospecha de VPPB: se confirma con Dix-Hallpike. La maniobra de Epley es el tratamiento.`},
{id:'tmh-n35',src:'tmh',mod:'neuro',tema:`Síndrome cerebeloso`,stem:`Varón de 54 años con dificultad progresiva para caminar desde hace 2 meses. Camina como si estuviera ebrio y derrama líquidos al servirse agua. Tiene marcha de base amplia, incapacidad para movimientos alternantes rápidos de las manos, dismetría en la prueba dedo-nariz y temblor que aumenta al aproximarse a un objeto. Fuerza y sensibilidad conservadas. ¿Cuál es el problema de salud más probable?`,
opts:[`Síndrome vestibular periférico`,`Síndrome cerebeloso`,`Síndrome de vía piramidal`,`Lesión de cordón posterior`],ans:1,exp:`Marcha atáxica, adiadococinesia, dismetría y temblor intencional con fuerza y sensibilidad normales: síndrome cerebeloso (hemisferios).`},
{id:'tmh-n36',src:'tmh',mod:'neuro',tema:`Vermis`,stem:`Hombre de 48 años con inestabilidad para caminar desde hace varios meses, caídas frecuentes y dificultad para mantenerse de pie sin apoyo. Tiene marcha de base amplia, oscilación del tronco al sentarse y dificultad para mantener el equilibrio incluso con los ojos abiertos. No hay alteraciones importantes en las pruebas dedo-nariz ni talón-rodilla. La ubicación de la lesión es:`,
opts:[`Hemisferio cerebeloso derecho`,`Vermis cerebeloso`,`Ganglios basales`,`Cordones posteriores medulares`],ans:1,exp:`Ataxia de tronco con extremidades respetadas: vermis. Con ojos abiertos sigue inestable, a diferencia de la ataxia sensitiva (cordones posteriores).`},
{id:'tmh-n37',src:'tmh',mod:'neuro',tema:`Cerebelo`,stem:`Paciente con ataxia espinocerebelosa tipo SCA 10. ¿Cuál de los siguientes hallazgos podría observarse en la exploración física?`,
opts:[`Ataxia que aparece en reposo y desaparece al iniciar movimientos`,`Ataxia que no está presente en reposo y aparece súbitamente al realizar movimientos`,`Ataxia que se va agravando conforme el paciente se acerca al objeto`,`Ninguna de las anteriores`],ans:1,exp:`Clave del banco: b. En el cerebelo el temblor es de acción (intencional), no de reposo. Ojo: la opción c también describe el temblor que aumenta al aproximarse al objeto.`,conf:'media'},
{id:'tmh-n38',src:'tmh',mod:'neuro',tema:`Cerebelo`,stem:`Paciente con lesión en el cerebelo presenta los siguientes signos clínicos, excepto:`,
opts:[`Hipotonía muscular`,`Disartria`,`Hiperreflexia osteotendinosa`,`Dismetría`],ans:2,exp:`En el síndrome cerebeloso hay hipotonía y reflejos pendulares o disminuidos, no hiperreflexia (esa es de vía piramidal).`},
{id:'tmh-n39',src:'tmh',mod:'neuro',tema:`Lóbulo floculonodular`,stem:`Mujer de 58 años con 3 meses de inestabilidad al caminar. "Camina como si estuviera ebria". Tiene dificultad para mantener el equilibrio de pie, tendencia a caer hacia ambos lados y movimientos oculares rápidos involuntarios horizontales. Fuerza y sensibilidad normales. ¿Cuál estructura está probablemente comprometida?`,
opts:[`Hemisferios laterales cerebelosos`,`Lóbulo floculonodular`,`Núcleo dentado`,`Pedúnculo cerebeloso superior`],ans:1,exp:`Ataxia de tronco con nistagmo: lóbulo floculonodular (arquicerebelo/vestibulocerebelo). Sus síntomas son nistagmo, vértigo, náuseas y vómitos.`,conf:'media'},
{id:'tmh-n40',src:'tmh',mod:'neuro',tema:`Apraxias`,stem:`La incapacidad para imitar gestos y realizar acciones motoras voluntarias previamente aprendidas, a petición u órdenes verbales y para gestos intransitivos, se define como:`,
opts:[`Apraxia ideomotora`,`Apraxia ideacional`,`Apraxia constructiva`,`Apraxia oculomotora`,`Apraxia orofacial`],ans:0,exp:`Ideomotora: no puede hacer el gesto a la orden ni imitarlo (gestos simbólicos o intransitivos), aunque lo haga espontáneamente.`},
{id:'tmh-n41',src:'tmh',mod:'neuro',tema:`Apraxias`,stem:`Paciente que, tras un accidente cerebrovascular, pierde la capacidad para vestirse y cepillarse. El trastorno más probable es:`,
opts:[`Apraxia ideomotora`,`Apraxia ideacional`,`Apraxia oculomotora`,`Apraxia constructiva`,`Apraxia orofacial`],ans:1,exp:`Ideacional: se pierde la secuencia de pasos de actos con objetos o herramientas (vestirse, cepillarse). El concepto del acto está alterado.`},
{id:'tmh-n42',src:'tmh',mod:'neuro',tema:`Apraxias`,stem:`Paciente que pierde la capacidad para replicar un dibujo por orden del evaluador y en su lugar hace dibujos amorfos. Este trastorno se define como:`,
opts:[`Apraxia ideomotora`,`Apraxia ideacional`,`Apraxia oculomotora`,`Apraxia constructiva`,`Apraxia de la mano`],ans:3,exp:`Apraxia constructiva: no puede copiar dibujos ni armar figuras.`},
{id:'tmh-n43',src:'tmh',mod:'neuro',tema:`Afasias`,stem:`Paciente de 32 años con diabetes mellitus, con problemas para comprender el lenguaje hablado y escrito, incapacidad para denominar objetos y repetir una palabra, y habla fluida e incomprensible con parafasias semánticas. Según los hallazgos, es probable que presente:`,
opts:[`Afasia global`,`Afasia de Wernicke`,`Afasia de Broca`,`Afasia transcortical motora`],ans:1,exp:`Habla fluida, sin comprensión y sin repetición: Wernicke (perisilviana, fluente, no comprende).`},
{id:'tmh-n44',src:'tmh',mod:'neuro',tema:`Síndrome de Gerstmann`,stem:`Varón de 63 años, hipertenso y con fibrilación auricular, con dificultad súbita para actividades cotidianas. Desde hace unas horas se equivoca con operaciones simples y tiene problemas para escribir. No identifica correctamente sus dedos (índice, anular) y confunde la derecha con la izquierda. Fuerza y sensibilidad normales. ¿Cuál es la localización anatómica más probable de la lesión?`,
opts:[`Giro precentral izquierdo`,`Giro angular del lóbulo parietal dominante`,`Corteza occipital derecha`,`Lóbulo temporal derecho`],ans:1,exp:`Acalculia, agrafia, agnosia digital y desorientación derecha-izquierda: síndrome de Gerstmann, por lesión del giro angular dominante (embolia cardiogénica por la FA).`},
{id:'tmh-n45',src:'tmh',mod:'neuro',tema:`Signos meníngeos`,stem:`Mujer de 42 años llevada a emergencia por fiebre, cefalea y somnolencia. Al pedirle que toque su pecho con el mentón, trata de hacerlo abriendo la boca sin lograr el objetivo. ¿A qué signo corresponde?`,
opts:[`Signo de Brudzinski`,`Signo de Kernig I`,`Signo de Kernig II`,`Signo de Lewinson`,`Signo de Lhermitte`],ans:3,exp:`Lewinson: al pedir que toque el pecho con el mentón, intenta hacerlo abriendo la boca.`},
{id:'tmh-n46',src:'tmh',mod:'neuro',tema:`Signos meníngeos`,stem:`Mujer de 52 años con cefalea y fiebre, con sospecha de meningitis. Al pedirle que se levante desde decúbito supino con los brazos cruzados no lo consigue. El signo que encontró el evaluador se denomina:`,
opts:[`Signo de Signorelli`,`Signo de Skeer`,`Signo de Arnos`,`Signo de Jacoud`],ans:2,exp:`Clave del banco: signo de Arnos.`,conf:'media'},
{id:'tmh-n47',src:'tmh',mod:'neuro',tema:`Signos meníngeos`,stem:`Varón de 36 años con cefalea súbita muy intensa seguida de trastorno de conciencia. PA 135/82 mmHg. No hay compromiso motor y, al flexionar la cabeza sobre el tronco, aparece estrabismo. El signo evidenciado es:`,
opts:[`Signo de Gringault`,`Signo de Brudzinski cefálico`,`Signo de Flatau`,`Signo de Parrot`,`Signo de Babinski`],ans:0,exp:`Gringault: estrabismo al flexionar la cabeza sobre el tronco. Flatau es midriasis al provocar el Brudzinski cefálico.`},
{id:'tmh-n48',src:'tmh',mod:'neuro',tema:`Signos meníngeos`,stem:`Mujer de 42 años sin historia de cefalea que, mientras se ducha, presenta bruscamente cefalea intensa y persistente. En emergencia, al girar la cabeza hacia el lado derecho se observa que se eleva el hombro izquierdo. ¿A qué signo corresponde?`,
opts:[`Signo de Marinesco-Radovici`,`Signo de Binda`,`Signo de Marie-Foix`,`Signo de Gordon`],ans:1,exp:`Clave del banco: Binda. Cefalea súbita "en trueno": piensa en hemorragia subaracnoidea.`,conf:'media'},
{id:'tmh-n49',src:'tmh',mod:'neuro',tema:`Signos meníngeos`,stem:`Varón de 12 años con cefalea intensa y fiebre, rigidez de nuca y vómitos sin contenido. A la exploración neurológica se puede observar todos los signos siguientes, excepto:`,
opts:[`Signo de Lhermitte`,`Signo de Arnos`,`Signo de Gringault`,`Signo de Flatau`],ans:0,exp:`Lhermitte (descarga eléctrica al flexionar el cuello) es de médula cervical, no un signo meníngeo.`}
);

// Osteomuscular: Banco histórico TeamMedic (columna) y Repaso Bioeasy Dr. Cáceres. Sin repetir las del parcial 2022.
S.qs.push(
{id:'tmh-o01',src:'tmh',mod:'om',tema:'Lumbar',stem:`Mujer de 42 años con dolor lumbar irradiado a la nalga derecha y la región posterior de la pierna, que dificulta la marcha y ahora llega a los dedos del pie. ¿Qué maniobras confirmarían el diagnóstico?`,
opts:[`Adams y Neri`,`Lasègue y Bragard`,`Lasègue y Adson`,`Lasègue y Adams`],ans:1,exp:`Ciatalgia: Lasègue positivo y Bragard que lo confirma. Adams es para escoliosis y Adson para la subclavia.`},
{id:'tmh-o02',src:'tmh',mod:'om',tema:'Escoliosis',stem:`Varón de 13 años con dorsalgia, test de Adams positivo y Cobb de 20°. Son características de la escoliosis en la exploración:`,
opts:[`Rigidez de columna, escápula alada, giba dorsal`,`Asimetría de hombros, escápula prominente, giba dorsal`,`Abdomen prominente, ángulo del talle aumentado, escápula alada`,`Aumento del ángulo lumbosacro, escápula, giba dorsal`],ans:1,exp:`Asimetría de hombros y escápulas con giba costal al flexionar.`},
{id:'tmh-o03',src:'tmh',mod:'om',tema:'Escoliosis',stem:`Mujer de 20 años con dorsalgia y eje vertebral desviado con concavidad lateral derecha. ¿Qué hallazgo es MENOS probable?`,
opts:[`Desnivel de las crestas ilíacas`,`Desnivel del ángulo escapular`,`Test de Adams positivo`,`Test de Schober positivo`],ans:3,exp:`El Schober mide la flexión lumbar en la espondilitis anquilosante, no la escoliosis.`},
{id:'tmh-o04',src:'tmh',mod:'om',tema:'Espondilitis',stem:`Varón de 30 años con dolor lumbar y rigidez de 10 años, dolor sacroilíaco bilateral, dificultad para la flexión lumbar desde el inicio y para la flexión lateral; mejora al caminar y empeora con el reposo. Diagnóstico:`,
opts:[`Hernia discal lumbar`,`Lumbociática`,`Espondilitis anquilosante`,`Lumbago biomecánico`],ans:2,exp:`Lumbago inflamatorio en un varón joven con sacroileítis.`},
{id:'tmh-o05',src:'tmh',mod:'om',tema:'Cervical',stem:`Sospecha de radiculopatía: al comprimir las yugulares aparece dolor radicular. Nombre y significado de la maniobra:`,
opts:[`Adson: atrapamiento en los escalenos`,`Naffziger-Jones: aumenta la presión intratecal y desencadena el dolor radicular`,`Spurling: compresión foraminal directa`,`Lhermitte: desmielinización`],ans:1,exp:`La compresión yugular congestiona el sistema venoso epidural y sube la presión del LCR.`},
{id:'tmh-o06',src:'tmh',mod:'om',tema:'Raíces',stem:`Debilidad para extender el codo, hipoestesia en el tercer dedo y reflejo tricipital disminuido. ¿Qué raíz?`,
opts:[`C5`,`C6`,`C7`,`T1`],ans:2,exp:`C7: tríceps, dedo medio y reflejo tricipital.`},
{id:'tmh-o07',src:'tmh',mod:'om',tema:'Raíces',stem:`Debilidad para la flexión, abducción y aducción de los dedos, reflejo cubitopronador alterado y parestesias en el borde cubital del antebrazo. ¿A qué raíz orienta?`,
opts:[`C5`,`C6`,`C8 y/o T1`,`C7 aislada`],ans:2,exp:`Flexores de dedos (C8) e interóseos (T1), borde cubital.`},
{id:'tmh-o08',src:'tmh',mod:'om',tema:'Cervical',stem:`Varón de 37 años con dolor cervical que empeora con Valsalva. ¿Qué mecanismo lo explica?`,
opts:[`Disminuye la presión intratecal`,`Aumenta la presión intratecal`,`Mejora el retorno venoso`,`Reduce el retorno venoso`],ans:1,exp:`El esfuerzo con glotis cerrada sube la presión intratecal y comprime más la raíz.`},
{id:'tmh-o09',src:'tmh',mod:'om',tema:'Cervical',stem:`Mujer con cervicalgia, omalgia, parestesias y debilidad del miembro superior derecho. Para descartar una radiculopatía compresiva cervical, ¿qué maniobra NO sería pertinente?`,
opts:[`Spurling`,`Naffziger-Jones`,`Jostes (distracción)`,`Dejerine`],ans:3,exp:`En el repaso Smart Review el Dejerine se ubica entre las maniobras lumbares; las otras tres son pruebas cervicales.`,conf:'media'},
{id:'tmh-o10',src:'tmh',mod:'om',tema:'Cervical',stem:`¿Qué maniobra detecta la compresión de la arteria subclavia en su paso entre los escalenos?`,
opts:[`Jackson`,`Adson`,`Spurling`,`Expansión torácica`],ans:1,exp:`Adson: el pulso radial disminuye al inspirar y rotar la cabeza.`},
{id:'tmh-o11',src:'tmh',mod:'om',tema:'Lumbar',stem:`Varón de 45 años con dolor lumbar de 2 meses, "quemadura y hormigueo", irradiado por la cara posterior del muslo, la pantorrilla y el pie derecho. ¿Qué maniobra esperaría positiva?`,
opts:[`Patrick`,`Erichsen`,`Lasègue`,`Neri`,`Gaenslen`],ans:2,exp:`Dolor ciático: Lasègue.`},
{id:'bgc-01',src:'bgc',mod:'om',tema:'Codo',stem:`Mujer de 32 años que cae apoyando la mano derecha; dolor en la cara lateral del codo y dificultad para rotar el antebrazo. Dolor en el epicóndilo lateral y supinación contra resistencia dolorosa (supinadores y extensores). ¿Qué prueba pide?`,
opts:[`Maniobra del golfista`,`Cozen indirecto`,`Cozen directo`,`Phalen`,`Tinel`],ans:2,exp:`Epicóndilo lateral: Cozen (directo). El "golfista" y el Cozen invertido son para la epitróclea.`},
{id:'bgc-02',src:'bgc',mod:'om',tema:'Mano',stem:`Mujer de 48 años con AR: hiperextensión de la IFP y flexión de la IFD en el 3.er y 4.º dedo derechos, rigidez matutina. ¿Qué deformidad es?`,
opts:[`Dedo en martillo`,`Dedo en resorte`,`Cuello de cisne`,`Dedo en ojal`,`Dupuytren`],ans:2,exp:`IFP en hiperextensión con IFD en flexión = cuello de cisne.`},
{id:'bgc-03',src:'bgc',mod:'om',tema:'Mano',stem:`Hombre de 35 años con trauma directo en el dedo medio jugando vóley; semanas después no extiende la IFP: flexión de la IFP con hiperextensión de la IFD. Diagnóstico:`,
opts:[`Dedo en martillo`,`Cuello de cisne`,`Dedo en Z`,`Dedo en ojal`,`Tenosinovitis estenosante`],ans:3,exp:`Rotura de la cintilla central del extensor: boutonnière.`},
{id:'bgc-04',src:'bgc',mod:'om',tema:'Mano',stem:`Digitador de 45 años con parestesias en pulgar, índice y medio que empeoran de noche; al percutir la cara palmar de la muñeca se desencadena hormigueo. ¿Sobre qué nervios se puede realizar la maniobra de Tinel?`,
opts:[`Cubital`,`Mediano`,`Cubital y mediano`,`Musculocutáneo`,`Axilar`],ans:2,exp:`Tinel es la percusión sobre un nervio comprimido o en regeneración: se usa en el mediano (carpo) y en el cubital (codo, Guyon).`,conf:'media'},
{id:'bgc-05',src:'bgc',mod:'om',tema:'Mano',stem:`Mujer de 29 años, madre reciente, con dolor en la cara lateral de la muñeca al cargar a su bebé y al usar el pulgar; dolor en la estiloides radial. ¿Qué maniobra confirma la tenosinovitis del abductor largo y extensor corto del pulgar?`,
opts:[`Phalen`,`Cozen`,`Finkelstein`,`Tinel`,`Apley`],ans:2,exp:`De Quervain: Finkelstein.`},
{id:'bgc-06',src:'bgc',mod:'om',tema:'Hombro',stem:`Instructor de gimnasio de 38 años con dolor en la cara anterior del hombro al levantar pesas; dolor en el surco intertubercular y en la supinación resistida con el codo a 90°. ¿Qué prueba apoya la tendinitis de la porción larga del bíceps?`,
opts:[`Neer`,`Yergason`,`Lundington`,`Jobe`],ans:1,exp:`Yergason: supinación contra resistencia con codo a 90°.`},
{id:'bgc-07',src:'bgc',mod:'om',tema:'Codo',stem:`Obrero de 47 años con dolor en la cara medial del codo al cargar peso y al flexionar la muñeca y pronar; dolor en la epitróclea con flexión resistida de la muñeca. Diagnóstico:`,
opts:[`Epicondilitis lateral`,`Túnel cubital`,`Epitrocleitis`,`Tendinitis bicipital`,`Bursitis olecraniana`],ans:2,exp:`Epitrocleitis (codo de golfista).`},
{id:'bgc-08',src:'bgc',mod:'om',tema:'Mano',stem:`Mujer de 42 años con hormigueo nocturno en pulgar, índice y medio de ambas manos y leve atrofia tenar. Se le pide flexionar ambas muñecas enfrentadas dorso con dorso por un minuto y aparecen parestesias. ¿Maniobra?`,
opts:[`Tinel`,`Finkelstein`,`Phalen`,`Froment`,`Allen`],ans:2,exp:`Phalen.`},
{id:'bgc-09',src:'bgc',mod:'om',tema:'Hombro',stem:`Mujer de 45 años con dolor intenso de hombro derecho tras levantar un balde y dificultad para peinarse desde hace 3 días. ¿Qué prueba solicitaría?`,
opts:[`Patte`,`Jobe`,`Gerber`,`Speed`],ans:1,exp:`Peinarse exige abducción: el supraespinoso, el tendón que más se rompe con cargas, se evalúa con Jobe.`,conf:'media'},
{id:'bgc-10',src:'bgc',mod:'om',tema:'Mano',stem:`Costurera de 40 años con adormecimiento nocturno en pulgar, índice y medio, y leve atrofia tenar. ¿Qué estructura está lesionada?`,
opts:[`Nervio mediano`,`Nervio cubital`,`Nervio radial`,`Nervio musculocutáneo`,`Nervio interóseo`],ans:0,exp:`Túnel carpiano: nervio mediano.`},
{id:'bgc-11',src:'bgc',mod:'om',tema:'Codo',stem:`Tenista aficionado de 38 años con dolor en la cara lateral del codo. Con el codo a 90°, antebrazo en pronación y puño cerrado, se le pide extender la muñeca contra resistencia y duele el epicóndilo lateral. ¿Maniobra?`,
opts:[`Cozen`,`Mills`,`Yergason`,`Tinel`],ans:0,exp:`Cozen es activa contra resistencia; Mills es pasiva con el codo extendido.`},
{id:'bgc-12',src:'bgc',mod:'om',tema:'Codo',stem:`A un paciente lo golpean en la cara medial del codo; horas después tiene dolor en el epicóndilo medial que aumenta al flexionar la muñeca contra resistencia. ¿Qué prueba realizaría?`,
opts:[`Cozen`,`Mills`,`Bowden`,`Yergason`,`Cozen invertida`],ans:4,exp:`Epitróclea: Cozen invertido.`},
{id:'bgc-13',src:'bgc',mod:'om',tema:'Hombro',stem:`Pintor de 50 años con dolor y debilidad al llevar objetos detrás de la espalda (abrocharse el cinturón, rascarse la espalda baja). Prueba de elección para la rotación medial:`,
opts:[`Cables`,`Gerber`,`Del oso`,`Napoleón`,`Jobe`],ans:1,exp:`Subescapular (rotación interna): Gerber o lift-off, la prueba clásica.`,conf:'media'},
{id:'bgc-14',src:'bgc',mod:'om',tema:'Codo',stem:`Varón de 23 años, golfista desde hace 5 años, con dolor en la parte interna del codo, debilidad para flexionar la mano y limitación de la supinación. ¿Qué prueba pide?`,
opts:[`Prueba de la silla`,`Mills`,`Thompson`,`Cozen invertido`],ans:3,exp:`Codo de golfista: Cozen invertido.`},
{id:'bgc-15',src:'bgc',mod:'om',tema:'Codo',stem:`Deportista de 30 años con dolor al extender la mano en pronación y dolor en la parte lateral del codo. ¿Diagnóstico y prueba?`,
opts:[`Rotura del colateral radial - Gerber`,`Tendinitis bicipital - Yergason`,`Epicondilitis - Cozen`,`Epitrocleitis - Cozen invertido`],ans:2,exp:`Lateral = epicondilitis = Cozen.`},
{id:'bgc-16',src:'bgc',mod:'om',tema:'Mano',stem:`Profesora de 46 años, hipotiroidea, con hormigueo nocturno en ambas manos y Tinel bilateral. En el túnel carpiano el nervio mediano se comprime entre los tendones del:`,
opts:[`Flexor radial del carpo y pronador largo`,`Palmar largo y flexor radial del carpo`,`Palmar largo y supinador redondo`,`Pronador redondo y supinador largo`],ans:1,exp:`En la muñeca el mediano está entre el palmar largo y el flexor radial del carpo.`},
{id:'bgc-17',src:'bgc',mod:'om',tema:'Mano',stem:`Mujer de 26 años con dolor en muñeca y antebrazo desde que nació su hijo, que aumenta al dar de lactar y al escribir en el celular. Finkelstein (+), Cozen (−), Cozen cruzado (−). ¿Qué estructuras están afectadas?`,
opts:[`Nervio mediano`,`Abductor corto y extensor largo del pulgar`,`Epicondilitis lateral`,`Epicondilitis medial`,`Abductor largo y extensor corto del pulgar`],ans:4,exp:`De Quervain: primer compartimento extensor (abductor largo y extensor corto).`},
{id:'bgc-18',src:'bgc',mod:'om',tema:'Mano',stem:`Mujer de 38 años con artritis reumatoide y síndrome del túnel carpiano. ¿Qué prueba y forma de realizarla es la correcta?`,
opts:[`Tinel en el canal cubital, positivo con parestesias en dedos 1-3`,`Phalen con las manos en flexión por 5 minutos, positivo en dedos 1-4`,`Tinel en el dorso de la muñeca, positivo en dedos 1-4`,`Phalen por 50 segundos, positivo en dedos 1-4 (mitad cubital del 4.º)`,`Phalen con las manos unidas en flexión por 1 minuto, positivo en dedos 1-4 (mitad radial del 4.º)`],ans:4,exp:`Phalen dura 1 minuto y el territorio del mediano llega a la mitad radial del anular.`},
{id:'bgc-19',src:'bgc',mod:'om',tema:'Hombro',stem:`Estibador de 42 años con dolor súbito en la región escapular irradiado al hombro derecho, nocturno, que alivia con el brazo elevado alrededor de la cabeza (abducción y rotación externa). ¿Qué prueba confirma el diagnóstico?`,
opts:[`Patte`,`Spurling`,`Yergason`,`Jobe`,`Hawkins`],ans:1,exp:`El alivio con el brazo sobre la cabeza (signo de abducción del hombro) orienta a radiculopatía cervical C5-C6, que se confirma con Spurling.`,conf:'media'},
{id:'bgc-20',src:'bgc',mod:'om',tema:'Hombro',stem:`Mujer de 43 años con dolor anterior de hombro de 2 meses que aumenta con el esfuerzo; Yergason y Speed positivos, Gerber y Patte negativos. Diagnóstico:`,
opts:[`Desgarro del supraespinoso`,`Pinzamiento subacromial`,`Bursitis subacromial`,`Síndrome del manguito rotador`,`Tendinosis del bíceps`],ans:4,exp:`Yergason y Speed evalúan la porción larga del bíceps.`},
{id:'bgc-21',src:'bgc',mod:'om',tema:'Mano',stem:`Mujer de 40 años con dolor en el pulgar derecho irradiado al epicóndilo lateral; Eichhoff-Finkelstein positivo. Diagnóstico:`,
opts:[`Tenosinovitis de De Quervain`,`Cuello de cisne`,`Dedo en gatillo`,`Dedo en palillo de tambor`,`Túnel carpiano`],ans:0,exp:`Eichhoff es otro nombre del Finkelstein.`},
{id:'bgc-22',src:'bgc',mod:'om',tema:'Codo',stem:`Mujer de 52 años que carga bolsas de basura a diario, con dolor en el codo derecho que aumenta con la dorsiflexión de la mano. ¿Qué prueba ayuda al diagnóstico?`,
opts:[`Lundington`,`Cozen`,`Speed`,`Cozen invertido`],ans:1,exp:`Dolor con la extensión (dorsiflexión) de la muñeca = epicondilitis lateral = Cozen.`},
{id:'bgc-23',src:'bgc',mod:'om',tema:'Lumbar',stem:`Obrero de 42 años con dolor lumbar irradiado a la cara posterior del muslo y la pierna, "corrientazo" hasta el dorso del pie y menor fuerza para la dorsiflexión del pie. ¿Qué maniobra reproduce mejor el dolor ciático?`,
opts:[`Patrick`,`Neri`,`Lasègue`,`Trendelenburg`],ans:2,exp:`Lasègue (elevar la pierna extendida). El dorso del pie y la dorsiflexión débil apuntan a L5.`},
{id:'bgc-24',src:'bgc',mod:'om',tema:'Lumbar',stem:`Mujer de 36 años con dolor lumbar irradiado a la pierna izquierda; al elevar el miembro extendido aparece dolor a 45°. Se baja la pierna hasta que el dolor desaparece y luego la dorsiflexión pasiva del pie lo reproduce. ¿Maniobra?`,
opts:[`Neri`,`Bragard`,`Lasègue`,`Goldthwait`],ans:1,exp:`Bragard.`},
{id:'bgc-25',src:'bgc',mod:'om',tema:'Espondilitis',stem:`Varón de 30 años con dolor lumbar crónico no irradiado que mejora con el movimiento y aumenta con el reposo. ¿Qué pruebas realizaría para descartar un lumbago inflamatorio?`,
opts:[`Prueba de los 3 puntos y Neri`,`Schober y prueba de los 3 puntos`,`Lasègue y Lasègue invertido`,`Bragard y Ober`,`Ott y Bragard`],ans:1,exp:`Movilidad lumbar (Schober) y postura cervicodorsal (3 puntos) en la espondilitis.`},
{id:'bgc-26',src:'bgc',mod:'om',tema:'Lumbar',stem:`Mujer de 55 años con lumbalgia; en decúbito dorsal se lleva el MID con la rodilla extendida por encima de 100°. Lo más probable es que presente:`,
opts:[`Lasègue positivo`,`Lumbociática`,`Lumbalgia`,`Signo de osteoartritis`],ans:2,exp:`El Lasègue es radicular entre 30° y 70°; el dolor que aparece después es por estiramiento de isquiotibiales o articular, propio de la lumbalgia no radicular.`,conf:'media'},
{id:'bgc-27',src:'bgc',mod:'om',tema:'Espondilitis',stem:`Varón de 30 años con dolor lumbar y rigidez de 10 años, sacroilíacas bilaterales, limitación de la flexión lumbar y lateral, mejora al caminar. ¿Qué prueba comprobaría el diagnóstico?`,
opts:[`Lasègue y Bragard`,`Schober`,`Thomas`,`Neri forzado`],ans:1,exp:`Schober mide la limitación de la flexión lumbar.`},
{id:'bgc-28',src:'bgc',mod:'om',tema:'Lumbar',stem:`Varón de 56 años con dolor lumbar irradiado a glúteo y cara posterior del MID tras plantar una estaca, con hormigueo en la región sólea y el talón. Busca irritación radicular por elongación. ¿Qué prueba espera positiva?`,
opts:[`Bragard`,`Tinel`,`Estiramiento femoral`,`Spurling`],ans:0,exp:`Talón y sóleo = S1 (ciático): Lasègue y Bragard. El estiramiento femoral es para L2-L4.`},
{id:'bgc-29',src:'bgc',mod:'om',tema:'Cervical',stem:`Mujer de 67 años con dolor en la cara externa del brazo derecho, sin dolor local en el brazo, pero con dolor a la palpación de la apófisis espinosa de C5. ¿Qué prueba es importante?`,
opts:[`Windlass`,`Spurling`,`Phalen`,`Cozen`],ans:1,exp:`Dermatoma C5 con dolor cervical: buscar radiculopatía con Spurling.`},
{id:'bgc-30',src:'bgc',mod:'om',tema:'Rodilla',stem:`Futbolista de 24 años con bloqueos y chasquido en la rodilla derecha tras un giro brusco; dolor en la interlínea medial. Se flexiona completamente la rodilla, se rota la tibia hacia afuera y se extiende lentamente, reproduciendo un chasquido doloroso. ¿Maniobra?`,
opts:[`Lachman`,`Apley`,`McMurray`,`Cajón anterior`],ans:2,exp:`McMurray (rotación externa: menisco medial).`},
{id:'bgc-31',src:'bgc',mod:'om',tema:'Cadera',stem:`Paciente atropellado con traumatismo de cadera; no puede caminar y el miembro está en flexión, aducción y rotación interna, apoyado sobre la otra pierna. Diagnóstico:`,
opts:[`Displasia congénita de cadera`,`Luxación anterior de cadera`,`Luxación posterior de cadera`,`Síndrome de la cintilla iliotibial`],ans:2,exp:`La luxación posterior (la más frecuente) deja el miembro acortado en flexión, aducción y rotación interna. La anterior queda en abducción y rotación externa.`},
{id:'bgc-32',src:'bgc',mod:'om',tema:'Rodilla',stem:`Futbolista de 35 años con dolor, derrame y bloqueo de rodilla tras torcedura. Supino, rodilla flexionada y pie en rotación externa completa; al extender aparece un resalte en la interlínea interna. ¿Maniobra?`,
opts:[`Apley`,`Cajón anterior`,`McMurray`,`Thessaly`],ans:2,exp:`McMurray para menisco interno.`},
{id:'bgc-33',src:'bgc',mod:'om',tema:'Cadera',stem:`Varón de 42 años con molestia inguinal irradiada al glúteo y dolor al rotar internamente y flexionar el muslo; se diagnostica pinzamiento femoroacetabular. ¿Qué prueba realiza?`,
opts:[`Thomas`,`Ober`,`FADIR`,`Moragas`],ans:2,exp:`FADIR: flexión, aducción y rotación interna.`},
{id:'bgc-34',src:'bgc',mod:'om',tema:'Rodilla',stem:`Futbolista de 25 años con dolor de rodillas, limitación para rotar lateralmente la pierna y dolor en la flexoextensión con bloqueo articular. ¿Diagnóstico y prueba?`,
opts:[`Lesión del colateral lateral - estrés en varo`,`Lesión de ligamento colateral - Moragas`,`Lesión del LCA - cajón anterior`,`Rotura del menisco lateral - Apley`],ans:3,exp:`El bloqueo es meniscal; Apley con compresión y rotación evalúa meniscos.`,conf:'media'},
{id:'bgc-35',src:'bgc',mod:'om',tema:'Rodilla',stem:`Basquetbolista de 22 años que cae de un salto con el pie fijo y rota; oye un chasquido y luego se hincha la rodilla. Con la rodilla a 90°, se tracciona la tibia hacia adelante y se desplaza en exceso. Diagnóstico:`,
opts:[`Colateral medial`,`Menisco medial`,`Ligamento cruzado posterior`,`Ligamento cruzado anterior`],ans:3,exp:`Cajón anterior positivo = LCA.`},
{id:'bgc-36',src:'bgc',mod:'om',tema:'Tobillo',stem:`Voleibolista de 21 años con inestabilidad del tobillo tras caer en inversión. Se estabiliza la pierna y se inclina el astrágalo dentro de la mortaja para evaluar la estabilidad lateral. ¿Prueba?`,
opts:[`Thompson`,`Windlass`,`Inclinación talar (tilt)`,`McMurray`],ans:2,exp:`Tilt test: ligamento calcaneoperoneo.`},
{id:'bgc-37',src:'bgc',mod:'om',tema:'Rodilla',stem:`Fondista de 35 años con dolor brusco en la región lateral de la rodilla por torsión durante un estiramiento y limitación para extender la rodilla. Diagnóstico más probable:`,
opts:[`Lesión meniscal`,`Lesión del ligamento lateral`,`Tendinitis anserina`,`Síndrome de la cintilla iliotibial`],ans:0,exp:`Torsión brusca con bloqueo de la extensión = menisco. La cintilla iliotibial es un dolor por sobreuso, sin bloqueo.`,conf:'media'},
{id:'bgc-38',src:'bgc',mod:'om',tema:'Rodilla',stem:`Varón de 35 años que baja de un bus en movimiento y sufre rotación interna brusca de la rodilla; dolor en la interlínea, rodilla trabada en flexión. ¿Maniobra y estructura?`,
opts:[`Cajón - pata de ganso`,`McMurray - meniscos`,`Thessaly - cintilla iliotibial`,`Apley - ligamento lateral`,`Noble - cintilla iliotibial`],ans:1,exp:`Rodilla trabada tras torsión = menisco: McMurray.`},
{id:'bgc-39',src:'bgc',mod:'om',tema:'Rodilla',stem:`Anciano con 5 años de gonalgia bilateral que dificulta caminar, levantarse de una silla y agacharse; rodillas en varo con crepitación y limitación de la flexoextensión. Diagnóstico:`,
opts:[`Gota saturnina`,`Osteoporosis`,`Gonartrosis bilateral`,`Artritis reumatoide`],ans:2,exp:`Artrosis de rodilla.`},
{id:'bgc-40',src:'bgc',mod:'om',tema:'Pie',stem:`Varón de 40 años con dolor en la cara inferior del talón (prominencia anteromedial del calcáneo), intenso en los primeros pasos de la mañana, y signo de Windlass positivo. Diagnóstico:`,
opts:[`Esguince de tobillo`,`Metatarsalgia`,`Neuroma de Morton`,`Fascitis plantar`,`Espolón calcáneo`],ans:3,exp:`Windlass tensa la fascia plantar.`},
{id:'bgc-41',src:'bgc',mod:'om',tema:'Tobillo',stem:`Corredora de 25 años con dolor lateral del tobillo tras inversión forzada; la prueba de Tilt muestra mayor inclinación que el lado sano. ¿Estructura lesionada?`,
opts:[`Ligamento deltoideo`,`Tendón calcáneo`,`Ligamento calcaneoperoneo`,`Ligamento tibiofibular anterior`],ans:2,exp:`El tilt evalúa el calcaneoperoneo; el cajón anterior de tobillo, el peroneoastragalino anterior.`},
{id:'bgc-42',src:'bgc',mod:'om',tema:'Pie',stem:`Recién nacido con flexión plantar persistente, inversión del retropié y desviación medial del antepié que no se corrige pasivamente. Diagnóstico:`,
opts:[`Pie plano flexible`,`Pie calcáneo`,`Pie equinovaro`,`Pie cavo`],ans:2,exp:`Equino + varo + aducto = pie equinovaro (zambo).`},
{id:'bgc-43',src:'bgc',mod:'om',tema:'Pie',stem:`Varón de 17 años con dolor plantar, esguinces frecuentes, apoyo excesivo en antepié y talón, arco longitudinal medial aumentado y retracción de los dedos. Diagnóstico:`,
opts:[`Pie plano`,`Pie equinovaro`,`Pie cavo`],ans:2,exp:`Arco aumentado con dedos en garra = pie cavo.`}
);

// Parcial Semiología Médica 2022-02 (real). Claves resueltas con Argente 3.ª ed.
S.qs.push(
{id:'p22-01',src:'p22',num:'P1',mod:'abd',tema:'Ascitis',stem:`Varón de 65 años con antecedente de cirugía coronaria, disnea progresiva de 15 días, malestar y distensión abdominal, edema de miembros inferiores. Sospecha IC derecha con ascitis. ¿Qué hallazgo apoya el diagnóstico de ascitis?`,
opts:[`Matidez en cuadrantes superiores y timpanismo en inferiores`,`Timpanismo en todo el abdomen`,`La percusión de un flanco transmite un impulso al flanco opuesto`,`El límite timpanismo-matidez no cambia con la postura`],ans:2,
exp:`Es la onda ascítica (signo de la oleada), positiva en ascitis importante. En ascitis hay matidez en flancos y declive con timpanismo arriba (al revés de la a), y la matidez es desplazable: cambia con el decúbito (d es falsa).`,ref:'Argente cap. 47 · PDF 836-853'},
{id:'p22-02',src:'p22',num:'P2',mod:'abd',tema:'Riñón',stem:`Mujer de 32 años con dolor lumbar derecho crónico y 5 pielonefritis derechas en 10 años. Riñones palpables. ¿Con qué maniobra evalúa la presencia y los grados de ptosis renal?`,
opts:[`Guyon`,`Goelet`,`Israel`,`Montenegro`,`Glenard`],ans:4,
exp:`El método de Glenard (palpación en pinza del flanco con el paciente en decúbito dorsal) detecta el riñón ptósico y permite graduar la ptosis. Guyon es el peloteo renal; Israel palpa en decúbito lateral; Goelet palpa de pie con el muslo flexionado.`,conf:'media'},
{id:'p22-03',src:'p22',num:'P3',mod:'resp',tema:'Fisiología',stem:`El aire inspirado que fisiológicamente no participa en la hematosis corresponde a:`,
opts:[`Espacio muerto`,`Volumen tidal`,`Capacidad vital`,`Volumen residual`],ans:0,exp:`Espacio muerto anatómico: el aire de las vías de conducción (unos 150 mL) que no llega a alvéolos con intercambio.`},
{id:'p22-04',src:'p22',num:'P4',mod:'abd',tema:'Abdomen',stem:`Marque la alternativa INCORRECTA:`,
opts:[`El signo de Jobert es la ausencia de matidez hepática por aire libre por perforación de víscera hueca`,`El signo de Chilaiditi es la ausencia de matidez hepática por interposición del colon transverso delante del hígado`,`El colon ascendente y transverso se palpan con facilidad en el paciente delgado`,`La maniobra de Minkowski es útil para tumores retroperitoneales y el riñón`,`La posición de Naegeli se usa cuando no se palpa el bazo`],ans:2,
exp:`Del colon se palpan con facilidad el sigmoides y el ciego; el ascendente casi nunca. Jobert, Chilaiditi y Naegeli están descritos así en el Argente.`,ref:'Argente cap. 47 · PDF 845, 850',conf:'media'},
{id:'p22-05',src:'p22',num:'P5',mod:'hc',tema:'Facies',stem:`Varón de 47 años con herida de bala en el muslo hace 3 días; luego presenta contracción involuntaria de los músculos faciales por parálisis espástica, imitando una risa sin emotividad. ¿Qué facies es?`,
opts:[`Amímica`,`Hipocrática`,`Abotagada`,`Adenoidea`,`Sardónica`],ans:4,exp:`Risa sardónica del tétanos (herida contaminada + espasmo de músculos faciales). Amímica = Parkinson; hipocrática = agonía/peritonitis.`},
{id:'p22-06',src:'p22',num:'P6',mod:'piel',tema:'Lesiones y uñas',stem:`Marque la alternativa INCORRECTA:`,
opts:[`La pápula es una lesión elevada menor de 0,5 cm`,`La coiloniquia es una uña con mayor convexidad, generalmente por déficit de zinc`,`La escara es tejido necrosado delimitado por piel sana`,`Las uñas hipocráticas se ven en hipoxia crónica`,`Los surcos transversales de Beau se deben a déficit de zinc`],ans:1,
exp:`La coiloniquia es la uña en cuchara (cóncava, no convexa) y se asocia sobre todo a ferropenia. Las líneas de Beau aparecen tras enfermedades graves y también se describen en el déficit de zinc.`,ref:'Argente cap. 23 · PDF 261-268'},
{id:'p22-07',src:'p22',num:'P7',mod:'neuro',tema:'V par',stem:`Paciente de 45 años con déficit sensitivo en el rostro derecho; al abrir la boca la mandíbula se desvía a la derecha. Es probable que también presente:`,
opts:[`Reflejo corneal izquierdo ausente`,`Reflejo fotomotor izquierdo arreactivo`,`Debilidad del masetero derecho`,`Epífora derecha`],ans:2,
exp:`Lesión del trigémino derecho: hipoestesia facial derecha y debilidad de masticadores derechos (la mandíbula se va hacia el lado débil por el pterigoideo). El corneal ausente sería el derecho.`,ref:'Argente 71-2 · PDF ~1471'},
{id:'p22-08',src:'p22',num:'P8',mod:'neuro',tema:'IV par',stem:`Mujer de 30 años con diplopía; durante el interrogatorio mantiene la cabeza inclinada hacia el hombro izquierdo. Usted concluye:`,
opts:[`El test de Bielschowsky es positivo a la derecha`,`Hay parálisis del oculomotor`,`El test de Bielschowsky agrava una hipertropía derecha`,`Hay parálisis del recto externo derecho`],ans:0,
exp:`La inclinación compensadora hacia el lado sano sugiere paresia del IV par (oblicuo superior) derecho. Al inclinar la cabeza hacia la derecha la hipertropía derecha empeora: Bielschowsky positivo a la derecha. La c describe lo mismo con otras palabras, por eso la pregunta es discutible.`,conf:'media'},
{id:'p22-09',src:'p22',num:'P9',mod:'om',tema:'Mano',stem:`Mujer de 45 años con artritis reumatoide de 8 años. En el 2.º y 3.er dedo de ambas manos: interfalángica proximal en flexión e interfalángica distal en extensión. ¿Cómo se llama la deformidad?`,
opts:[`Cuello de cisne`,`Dedo en ojal (boutonnière)`,`Rizartrosis`,`Mano en escuadra`,`Mano en garra`],ans:1,exp:`Ojal: IFP en flexión + IFD en hiperextensión. El cuello de cisne es lo contrario (IFP en hiperextensión + IFD en flexión).`},
{id:'p22-10',src:'p22',num:'P10',mod:'om',tema:'Mano',stem:`Mujer de 63 años operada hace 2 meses de fractura distal de cúbito y radio izquierdos. Parestesias en cara palmar de pulgar, índice y medio, hipotrofia tenar, Tinel (+) y Phalen (+). Diagnóstico probable:`,
opts:[`Epicondilitis lateral`,`Síndrome del túnel carpiano`,`Tenosinovitis de De Quervain`,`Mano en escuadra`,`Mano en garra`],ans:1,exp:`Compresión del nervio mediano en el carpo: territorio de los 3 primeros dedos, atrofia tenar, Tinel y Phalen positivos.`},
{id:'p22-11',src:'p22',num:'P11',mod:'neuro',tema:'Glasgow',stem:`Varón de 33 años que cae de un segundo piso. Pupilas isocóricas y reactivas. Al estímulo doloroso abre los ojos, no tiene respuesta verbal y presenta rigidez de descerebración. ¿Glasgow?`,
opts:[`5`,`6`,`4`,`7`,`8`],ans:0,exp:`Ocular al dolor = 2, verbal ninguna = 1, motor en extensión (descerebración) = 2. Total 5.`},
{id:'p22-12',src:'p22',num:'P12',mod:'cardio',tema:'Pericardio',fija:true,stem:`Varón de 50 años con pérdida de 4 kg en un mes, tos vespertina, diaforesis y fiebre; disnea a leves esfuerzos. La ecocardiografía muestra derrame pericárdico moderado. ¿Qué hallazgo cardiovascular representa mejor esta patología?`,
opts:[`Aumento de los ruidos cardíacos`,`Signo de Gendrin positivo a la percusión`,`Ingurgitación yugular unilateral`,`Resonancia a la percusión del esternón`,`Pulso deficitario`],ans:1,
exp:`Gendrin: el choque de punta se palpa por dentro del límite de matidez, típico del derrame importante. Los ruidos se alejan y el esternón se vuelve mate.`,ref:'Argente 35-5 · PDF 466; 36-6 · PDF 547'},
{id:'p22-13',src:'p22',num:'P13',mod:'resp',tema:'Condensación',stem:`Mujer de 40 años con hipertiroidismo, fiebre y tos con expectoración verdosa de 1 semana, disnea aguda. FR 24, FC 100. Rx: radiopacidad basal derecha con broncograma aéreo. Es correcto respecto al examen físico:`,
opts:[`Ligera disminución del frémito vocal en la base derecha`,`Soplo tubárico en la base derecha, de sonido laringotraqueal`,`Hipersonoridad en la base derecha`,`Lateralización de la tráquea a la derecha`,`Abolición del murmullo, matidez y abolición del frémito en la base derecha`],ans:1,
exp:`Neumonía con broncograma = condensación con bronquio permeable: soplo tubárico (respiración laringotraqueal transmitida), frémito aumentado, matidez. La e describe un derrame.`,ref:'Argente 41 · PDF 691; 42-2 · PDF 703-714'},
{id:'p22-14',src:'p22',num:'P14',mod:'abd',tema:'Signos',stem:`Varón de 42 años con rotura de bazo por accidente de tránsito; dolor intenso irradiado al hombro izquierdo por irritación diafragmática. ¿Qué signo es?`,
opts:[`Dolor pélvico intermenstrual`,`Signo de Kehr`,`Signo de Rovsing`,`Signo del obturador`],ans:1,exp:`Kehr: dolor referido al hombro izquierdo por sangre bajo el diafragma (rotura esplénica).`},
{id:'p22-15',src:'p22',num:'P15',mod:'abd',tema:'Apendicitis',stem:`Adolescente de 15 años con dolor en fosa ilíaca derecha de 10 horas, hiporexia, náuseas y fiebre. Dolor a la descompresión en FID. Es el signo de:`,
opts:[`McBurney`,`Rovsing`,`Aaron`,`Blumberg`,`Murphy`],ans:3,exp:`Blumberg = dolor a la descompresión brusca (irritación peritoneal localizada). McBurney es dolor a la presión en el punto; Rovsing, dolor en FID al presionar la FII.`,ref:'Argente cap. 47 · PDF 840'},
{id:'p22-16',src:'p22',num:'P16',mod:'cardio',tema:'Maniobras',fija:true,stem:`¿Qué maniobra complementaria ayuda en la evaluación de un paciente con sospecha de valvulopatía pulmonar?`,
opts:[`Pachón`,`Azoulay`,`Rivero-Carvallo`,`Reflujo hepatoyugular`],ans:2,exp:`La pulmonar es una válvula derecha: sus soplos aumentan con la inspiración profunda (Rivero-Carvallo positiva).`,ref:'Argente 35-5, cuadro 35-5-6 · PDF 477'},
{id:'p22-17',src:'p22',num:'P17',mod:'abd',tema:'Riñón',stem:`Mujer de 28 años con dolor lumbar derecho súbito, cólico, 9/10, irradiado a flanco y pelvis, náuseas, orina rojiza. Inquieta, sin posición antálgica, puntos renoureterales superiores derechos (+), puño-percusión derecha (+), afebril. Orina: cristales ++, hematíes isomórficos +++, sin gérmenes. Hipótesis:`,
opts:[`Pielonefritis aguda por E. coli`,`Hematuria macroscópica glomerular`,`Cólico renoureteral`,`Desgarro de aneurisma de aorta abdominal`,`Lumbalgia mecánica`],ans:2,exp:`Dolor cólico con inquietud motora, hematuria isomórfica (no glomerular), cristaluria, sin fiebre ni leucocituria: litiasis con cólico renoureteral.`},
{id:'p22-18',src:'p22',num:'P18',mod:'om',tema:'Columna',stem:`Varón de 55 años con lumbalgia irradiada al miembro inferior derecho, parestesias en 4.º y 5.º dedos del pie, dificultad para caminar en puntas, aquíleo abolido, Neri y Lasègue (+) a 30°. ¿Nivel de la hernia?`,
