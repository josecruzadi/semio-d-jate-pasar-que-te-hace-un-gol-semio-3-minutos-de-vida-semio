mantener la posición. Se usa <mark>cuando no se palpa el bazo</mark> en decúbito dorsal o hay dudas</td></tr>\n<tr><td><b>Merlo</b></td><td>Misma posición; el examinador se sienta en la cama mirando hacia los pies, la mano izquierda empuja desde la FID el contenido hacia la celda esplénica (Galambos) y la derecha palpa en cuchara</td></tr>\n<tr><td><b>Castell</b> (percusión)</td><td>Decúbito dorsal, último espacio intercostal en la línea axilar anterior izquierda: matidez = esplenomegalia</td></tr>\n</table></div>\n<p><b>Bazo vs. riñón izquierdo:</b> el bazo tiene borde y escotaduras, mayor movilidad respiratoria y el colon queda por detrás. El riñón es redondeado, sin borde, tiene peloteo y el colon transverso queda por delante.</p>\n<p class=\"ref\">Argente cap. 47 · PDF 849-852</p>\n</section>\n\n<section id=\"a-apend\" data-t=\"Apendicitis y peritoneo\">\n<h3>Apendicitis y peritoneo</h3>\n<div class=\"tw\"><table>\n<tr><th>Punto</th><th>Ubicación (TeamMedic)</th></tr>\n<tr><td><b>McBurney</b></td><td>Unión del tercio externo con los dos tercios internos de la línea entre la EIAS derecha y el ombligo</td></tr>\n<tr><td><b>Monro</b></td><td>Punto medio de la línea entre la EIAS derecha y el ombligo</td></tr>\n<tr><td><b>Morris</b></td><td>Unión del tercio interno con los dos tercios externos de la misma línea</td></tr>\n<tr><td><b>Lanz</b></td><td>Unión del tercio externo derecho con el tercio medio de la línea biespinosa. Apéndice <b>pélvico</b></td></tr>\n<tr><td>McBurney izquierdo</td><td>Fosa ilíaca izquierda: <b>diverticulitis</b></td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Signo</th><th>Qué es</th><th>Indica</th></tr>\n<tr><td><b>Blumberg</b></td><td>Dolor a la <b>descompresión brusca</b> en la FID</td><td>Peritonitis localizada</td></tr>\n<tr><td><b>Guéneau de Mussy</b></td><td>Dolor a la descompresión en <b>cualquier zona</b> del abdomen</td><td>Peritonitis generalizada</td></tr>\n<tr><td><b>Rovsing</b></td><td>Dolor en la FID al presionar la fosa ilíaca (cuadrante inferior) izquierda</td><td>Apendicitis</td></tr>\n<tr><td><b>Psoas</b></td><td>Dolor a la extensión de la cadera derecha en decúbito lateral izquierdo (o al flexionar contra resistencia)</td><td>Apéndice <b>retrocecal</b></td></tr>\n<tr><td><b>Obturador</b></td><td>Dolor pélvico a la rotación interna de la cadera con cadera y rodilla flexionadas</td><td>Apéndice <b>pélvico</b></td></tr>\n<tr><td><b>Markle</b> (golpe de talón)</td><td>De puntillas, se deja caer sobre los talones: dolor abdominal</td><td>Irritación peritoneal</td></tr>\n<tr><td><b>Dunphy</b></td><td>Dolor en la FID al toser</td><td>Apendicitis</td></tr>\n<tr><td><b>Aaron</b></td><td>Dolor en el epigastrio o la región precordial al presionar McBurney</td><td>Apendicitis</td></tr>\n<tr><td><b>Horn</b></td><td>Dolor en la FID al traccionar suavemente el testículo derecho</td><td>Apendicitis</td></tr>\n<tr><td><b>Roque</b></td><td>La presión continua en McBurney hace ascender el testículo derecho</td><td>Apendicitis</td></tr>\n<tr><td><b>Dance</b></td><td>Ausencia de ruidos intestinales en el cuadrante inferior derecho (vacío en la FID)</td><td>Invaginación intestinal</td></tr>\n</table></div>\n<div class=\"box key\"><b>Irritación peritoneal:</b> rigidez involuntaria (defensa), dolor a la palpación, ausencia de ruidos intestinales, obturador y psoas positivos, Blumberg, Markle y Rovsing. La <b>equimosis periumbilical (Cullen) NO es irritación peritoneal</b>; es sangrado retroperitoneal.</div>\n<p class=\"ref\">Argente cap. 47 · PDF 839-841; Bates tabla 18-5; Conceptos de Gastro TeamMedic</p>\n</section>\n\n<section id=\"a-signos\" data-t=\"Otros signos con nombre\">\n<h3>Otros signos con nombre</h3>\n<div class=\"tw\"><table>\n<tr><th>Signo</th><th>Descripción</th><th>Se ve en</th></tr>\n<tr><td><b>Kehr</b></td><td>Dolor abdominal irradiado al <b>hombro izquierdo</b> por irritación del diafragma</td><td>Rotura de bazo (también litiasis renal y embarazo ectópico)</td></tr>\n<tr><td><b>Cullen</b></td><td>Equimosis periumbilical</td><td>Pancreatitis hemorrágica, embarazo ectópico roto, rotura de aorta</td></tr>\n<tr><td><b>Grey Turner</b></td><td>Equimosis en los flancos y la región lumbar</td><td>Lo mismo (sobre todo pancreatitis y aneurisma roto)</td></tr>\n<tr><td><b>Romberg-Howship</b></td><td>Dolor por la cara medial del muslo hasta la rodilla</td><td>Hernia obturatriz estrangulada</td></tr>\n<tr><td><b>Mannkopf</b></td><td>El pulso se acelera al palpar un abdomen que de verdad duele</td><td>Dolor real (vs. simulación)</td></tr>\n<tr><td><b>Ransohoff</b></td><td>Pigmentación amarillenta de la región umbilical</td><td>Rotura del colédoco</td></tr>\n<tr><td><b>Cruveilhier-Baumgarten</b></td><td>Cabeza de medusa con murmullo venoso periumbilical</td><td>Hipertensión portal</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 47 · PDF 836; Conceptos de Gastro TeamMedic</p>\n</section>\n\n<section id=\"a-renal\" data-t=\"Riñón y puntos\">\n<h3>Riñón y puntos renoureterales</h3>\n<p>Los riñones son retroperitoneales, entre <b>T12 y L3</b>; el derecho está más bajo que el izquierdo y el hilio queda a la altura de L1-L2. La palpación bimanual es el método de elección.</p>\n<div class=\"tw\"><table>\n<tr><th>Método</th><th>Posición y técnica</th><th>Clave</th></tr>\n<tr><td><b>Guyon</b></td><td><b>Decúbito dorsal</b>; médico del mismo lado del riñón. La mano posterior va en el <b>ángulo costomuscular</b> y la anterior paralela, por fuera de los rectos, avanzando desde la fosa ilíaca en espiración. Si la mano lumbar da un golpe rápido con los dedos, el riñón choca contra la anterior</td><td><mark>Peloteo renal</mark>; es la técnica clásica</td></tr>\n<tr><td><b>Israel</b></td><td><b>Decúbito lateral</b> sobre el lado opuesto, caderas y rodillas algo flexionadas; médico del lado dorsal. Mano posterior en la zona lumbar, la anterior palpa con la punta de 3 dedos bajo la confluencia condrocostal</td><td>Palpación en decúbito lateral</td></tr>\n<tr><td><b>Glenard</b></td><td>Decúbito dorsal; la mano forma una pinza con el pulgar adelante en el flanco. Tres tiempos: <b>acecho, captura</b> (en inspiración) <b>y escape</b> (en espiración)</td><td><mark>Elección para ptosis renal</mark></td></tr>\n<tr><td><b>Goelet</b></td><td><b>De pie</b>, apoyado sobre el miembro contrario y con el del lado a evaluar flexionado (pie sobre una silla); palpación bimanual en acecho inspiratorio</td><td>Riñón que desciende por gravedad (ptosis)</td></tr>\n<tr><td><b>Montenegro</b></td><td><b>Decúbito ventral</b>; los impulsos de la mano bajo el abdomen se perciben con la mano lumbar (peloteo inverso)</td><td><mark>Descartar masas extrarrenales</mark></td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Punto</th><th>Ubicación</th><th>Significado</th></tr>\n<tr><td><b>Costovertebral (Guyon)</b></td><td>Borde externo de la columna con la XII costilla</td><td>Dolor renal</td></tr>\n<tr><td><b>Costomuscular</b></td><td>Borde externo de la masa muscular lumbar con la XII costilla</td><td>Dolor renal</td></tr>\n<tr><td><b>Ureteral superior (paraumbilical)</b></td><td><b>Línea umbilical + borde externo del recto</b> (o la vertical que pasa por McBurney). Corresponde a la unión pieloureteral</td><td>Pielonefritis, litiasis. Si irradia a la vejiga con deseo de orinar: <b>signo de Bazy</b></td></tr>\n<tr><td><b>Ureteral medio</b></td><td><b>Línea biilíaca + borde externo del recto</b>. Donde el uréter cruza los vasos ilíacos</td><td>Litiasis</td></tr>\n<tr><td><b>Ureteral inferior</b></td><td>Por <b>tacto rectal o vaginal</b>; entrada del uréter en la vejiga</td><td>Litiasis</td></tr>\n</table></div>\n<p><b>Puñopercusión lumbar</b> (Murphy renal con el puño o Giordano con el borde cubital), con el paciente sentado e inclinado hacia delante. Normalmente indolora; si duele: <b>pielonefritis, perinefritis, litiasis o tumor renal</b>.</p>\n<p><b>Cólico renoureteral:</b> dolor lumbar de inicio brusco, muy intenso, de intensidad fluctuante, que irradia al flanco, la fosa ilíaca y los genitales. El paciente está inquieto (no encuentra posición) y tiene náuseas, vómitos, sudoración y hematuria. La puñopercusión y el punto ureteral superior son positivos, sin fiebre. Si hay fiebre y leucocituria, pielonefritis.</p>\n<p><b>Auscultación:</b> soplo periumbilical o lumbar en un paciente con HTA de inicio reciente o difícil de controlar = estenosis de la arteria renal.</p>\n<p class=\"ref\">Argente cap. 53 · PDF 992-993; 51 · PDF 986-987; Conceptos de Nefro TeamMedic</p>\n</section>\n\n<section id=\"a-gen\" data-t=\"Genitales y tacto rectal\">\n<h3>Genitales y tacto rectal</h3>\n<ul>\n<li><b>Escroto:</b> el hidrocele <b>transilumina</b> y no se reduce; la hernia inguinoescrotal no transilumina y se reduce. El <b>varicocele</b> (\"bolsa de gusanos\") suele ser izquierdo y aumenta de pie o con Valsalva.</li>\n<li><b>Torsión testicular vs. epididimitis:</b> en la torsión el testículo está alto y horizontal, el reflejo cremastérico desaparece y elevar el testículo no alivia (Prehn negativo). En la epididimitis, elevarlo alivia el dolor (Prehn positivo).</li>\n<li><b>Hernia inguinal:</b> la indirecta baja por el conducto inguinal (lateral a los vasos epigástricos) y puede llegar al escroto; la directa sale por el triángulo de Hesselbach (medial).</li>\n<li><b>Próstata al tacto rectal:</b> normal, del tamaño de una castaña, elástica y con surco medio palpable. En la HPB está aumentada, lisa y sin surco; en el cáncer es pétrea y nodular. La prostatitis es muy dolorosa.</li>\n<li><b>Signo de Chadwick:</b> coloración violácea de las paredes vaginales y el cuello en la gestante.</li>\n</ul>\n<p class=\"ref\">Guía semana 3 (genitales); Conceptos de Dermato TeamMedic (Chadwick)</p>\n</section>\n"},
    {id:'piel', name:'Piel, anexos y cabeza', short:'Piel', ready:true, lede:'Semana 2 · 5 de 41 preguntas. Guía del Argente (caps. 22 a 27) con el banco de Dermatología de TeamMedic.', guide:"<section id=\"p-fijas\" data-t=\"Lo que más cae\">\n<h3>Lo que más cae</h3>\n<p>En 2022 vinieron coiloniquia, Auspitz y flictena. El banco de TeamMedic insiste en <b>uñas</b> y <b>lesiones elementales</b>; con eso tienes la mayoría de las 5 preguntas.</p>\n<ol class=\"fijas\">\n<li><b>Coiloniquia = uña cóncava \"en cuchara\" = ferropenia</b><span class=\"meta\">Secuencia: fragilidad → onicosquicia/platoniquia → coiloniquia</span></li>\n<li><b>Uñas hipocráticas (vidrio de reloj): ángulo de Lovibond ≥ 180°, causa principal hipoxia crónica</b><span class=\"meta\">Fibrosis pulmonar, cáncer de pulmón, bronquiectasias, cardiopatía cianótica</span></li>\n<li><b>Terry = cirrosis, ICC, DM y envejecimiento. Lindsay (mitad y mitad) = IRC. Muehrcke = hipoalbuminemia. Mees = arsénico</b></li>\n<li><b>Onicólisis = separación distal. Onicomadesis = separación proximal</b></li>\n<li><b>Auspitz = rocío hemorrágico al raspar la escama (psoriasis). Nikolsky = la epidermis se desprende con presión tangencial (pénfigo, NET, SSSS)</b></li>\n<li><b>Vesícula &lt; 5 mm, ampolla o flictena &gt; 5 mm. Pápula &lt; 0,5-1 cm. Habón = edematoso, evanescente (&lt; 24 h)</b></li>\n<li><b>Liquenificación = piel engrosada con cuadriculado acentuado por rascado crónico</b><span class=\"meta\">Erosión solo afecta la epidermis y no deja cicatriz; la úlcera llega a la dermis y sí deja</span></li>\n<li><b>Basocelular: pápula perlada con telangiectasias, sobre piel sana, nunca en mucosas</b><span class=\"meta\">El epidermoide es más queratósico, sale sobre lesiones premalignas (queratosis actínica) y puede afectar mucosas</span></li>\n</ol>\n</section>\n\n<section id=\"p-prim\" data-t=\"Lesiones primarias\">\n<h3>Lesiones elementales primarias</h3>\n<p><b>Ojo con los cortes de tamaño:</b> el Argente usa 0,5 cm (pápula &lt; 0,5 cm) y Bates o TeamMedic usan 1 cm. En el banco se aceptan ambos, así que no descartes una opción solo por eso.</p>\n<div class=\"tw\"><table>\n<tr><th>Contenido</th><th>Lesión</th><th>Definición y ejemplo</th></tr>\n<tr><td rowspan=\"2\">Sin relieve</td><td><b>Mácula</b> (&lt; 1 cm) / <b>mancha</b> (&gt; 1 cm)</td><td>Cambio de color sin relieve ni cambio de consistencia. Vascular (eritema, que desaparece a la vitropresión), purpúrica (no desaparece) o pigmentaria. Ej.: vitíligo</td></tr>\n<tr><td>Púrpura</td><td><b>Petequias</b> (puntiformes), <b>equimosis</b> (más grandes, por trauma; cambian de color con los días), <b>hematoma</b> (colección elevada). No se borran con la presión</td></tr>\n<tr><td rowspan=\"5\">Sólido</td><td><b>Pápula</b></td><td>Elevación sólida, pequeña y superficial; se resuelve sin cicatriz. Ej.: liquen plano</td></tr>\n<tr><td><b>Placa</b></td><td>Como la pápula pero más grande; predomina la extensión. Ej.: psoriasis, erisipela</td></tr>\n<tr><td><b>Nódulo</b></td><td>Sólido, más profundo (dermis o hipodermis), 1 a 2 cm; más palpable que visible. Ej.: eritema nudoso, lipoma</td></tr>\n<tr><td><b>Tumor o masa</b></td><td>Neoformación &gt; 2 cm, no inflamatoria</td></tr>\n<tr><td><b>Habón (roncha)</b></td><td>Pápula o placa <b>edematosa, evanescente (&lt; 24 h)</b>, rosada o pálida, rodeada de eritema, pruriginosa; no deja secuela. Ej.: urticaria (también por AINE)</td></tr>\n<tr><td rowspan=\"4\">Líquido</td><td><b>Vesícula</b></td><td>Cavidad con líquido seroso &lt; 5 mm. Ej.: herpes</td></tr>\n<tr><td><b>Ampolla (flictena)</b></td><td>Cavidad con líquido &gt; 5 mm. Intraepidérmica (pénfigo, flácida) o subepidérmica (penfigoide, tensa)</td></tr>\n<tr><td><b>Pústula</b></td><td>Elevación con pus desde el inicio. Ej.: foliculitis, acné</td></tr>\n<tr><td><b>Quiste</b></td><td>Lesión encapsulada (pared epitelial) con contenido líquido o semisólido</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 22 · PDF 244-254; Conceptos de Dermato TeamMedic</p>\n</section>\n\n<section id=\"p-sec\" data-t=\"Lesiones secundarias\">\n<h3>Lesiones elementales secundarias</h3>\n<div class=\"tw\"><table>\n<tr><th>Lesión</th><th>Qué es</th></tr>\n<tr><td><b>Liquenificación</b></td><td>Epidermis engrosada, rugosa, con el cuadriculado acentuado, por rascado o frotamiento persistente; afecta sobre todo las superficies flexoras. Ej.: eccema crónico</td></tr>\n<tr><td><b>Escama</b></td><td>Células queratinizadas acumuladas que se desprenden (secas o grasas, finas o gruesas)</td></tr>\n<tr><td><b>Costra</b></td><td>Exudado seco (suero, sangre o pus). Ej.: costras melicéricas del impétigo</td></tr>\n<tr><td><b>Excoriación</b></td><td>Pérdida de sustancia producida por el paciente al rascarse; lineal, con costra</td></tr>\n<tr><td><b>Erosión (exulceración)</b></td><td>Pérdida <b>solo de epidermis</b>; húmeda, brillante, tras romperse una vesícula o ampolla. <mark>No deja cicatriz</mark></td></tr>\n<tr><td><b>Úlcera</b></td><td>Pérdida de <b>epidermis y dermis</b>, cóncava; deja cicatriz. Ej.: úlcera venosa</td></tr>\n<tr><td><b>Fisura (grieta)</b></td><td>Solución de continuidad lineal sin pérdida de sustancia. Ej.: intertrigo</td></tr>\n<tr><td><b>Atrofia</b></td><td>Piel adelgazada, translúcida, en \"papel de cigarrillo\"; pierde las marcas. Ej.: piel senil, estrías</td></tr>\n<tr><td><b>Esclerosis</b></td><td>Piel indurada que no se puede plegar, adherida a planos profundos. Ej.: esclerodermia</td></tr>\n<tr><td><b>Escara</b></td><td>Tejido necrosado delimitado de la piel sana por un surco</td></tr>\n<tr><td><b>Cicatriz y queloide</b></td><td>Tejido conjuntivo que reemplaza una pérdida de sustancia. El queloide sobrepasa los bordes de la lesión original</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 22 · PDF 251-254</p>\n</section>\n\n<section id=\"p-signos\" data-t=\"Signos y exploración\">\n<h3>Signos dermatológicos y exploración</h3>\n<div class=\"tw\"><table>\n<tr><th>Signo</th><th>Qué es</th><th>Típico de</th></tr>\n<tr><td><b>Auspitz</b> (rocío hemorrágico)</td><td>Puntos sangrantes al raspar las escamas de la placa</td><td><mark>Psoriasis</mark></td></tr>\n<tr><td><b>Koebner</b></td><td>Aparecen lesiones propias de la enfermedad en zonas de presión o trauma</td><td>Psoriasis, liquen plano, verrugas, vitíligo</td></tr>\n<tr><td><b>Nikolsky</b></td><td>La epidermis se desprende con presión tangencial del dedo</td><td>Pénfigo vulgar, NET, Stevens-Johnson, piel escaldada estafilocócica</td></tr>\n<tr><td><b>Darier</b></td><td>Aparece un habón al frotar una lesión</td><td>Mastocitosis cutánea</td></tr>\n<tr><td><b>Dermografismo</b></td><td>Habón lineal al rascar piel sana</td><td>Urticaria física</td></tr>\n<tr><td><b>Signo de la uñada (Besnier)</b></td><td>Descamación fina que aparece al raspar con la uña</td><td>Pitiriasis versicolor</td></tr>\n<tr><td><b>Anillo de Woronoff</b></td><td>Halo despigmentado alrededor de las placas, en la fase de curación</td><td>Psoriasis en regresión</td></tr>\n<tr><td><b>Crowe</b></td><td>Efélides (pecas) en las axilas</td><td>Neurofibromatosis tipo 1</td></tr>\n<tr><td><b>Hertoghe</b></td><td>Pérdida del tercio externo de las cejas</td><td>Hipotiroidismo</td></tr>\n<tr><td><b>Heliotropo</b> y <b>signo del chal</b></td><td>Eritema violáceo en los párpados / en la parte superior de espalda, pecho y hombros</td><td>Dermatomiositis</td></tr>\n<tr><td><b>Chadwick</b></td><td>Coloración violácea de las paredes vaginales</td><td>Gestación</td></tr>\n</table></div>\n<p><b>Exploración:</b> con luz natural. La <b>temperatura</b> se valora con el <mark>dorso de los dedos o de la mano</mark>, no con los pulpejos. La <b>vitropresión</b> distingue eritema (se borra) de púrpura (no se borra). El <b>Godet</b> (fóvea) se busca presionando sobre un plano óseo (tibia, maléolos, sacro si está en cama). El <b>enfisema subcutáneo</b> se palpa como crepitación \"en nieve\".</p>\n<div class=\"tw\"><table>\n<tr><th>Olor</th><th>Causa</th></tr>\n<tr><td>Manzanas podridas</td><td>Gangrena gaseosa por <i>Clostridium</i></td></tr>\n<tr><td>Humedad</td><td><i>Proteus</i></td></tr>\n<tr><td><b>Uvas</b></td><td><b><i>Pseudomonas</i></b> (sobre todo en quemaduras)</td></tr>\n<tr><td>Cerveza agriada</td><td>Linfadenitis tuberculosa (escrófula)</td></tr>\n<tr><td>Putrefacción</td><td>Anaerobios, escorbuto</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 22 · PDF 244-246; Conceptos de Dermato TeamMedic</p>\n</section>\n\n<section id=\"p-dx\" data-t=\"Diferenciales clave\">\n<h3>Diferenciales que preguntan</h3>\n<div class=\"grid2\">\n<div class=\"card\"><h4>Carcinoma basocelular</h4><p>El más frecuente. Pápula o nódulo <b>perlado</b> con <b>telangiectasias</b>, bordes enrollados, crecimiento lento, en la cara. Sale sobre piel sana y nunca en mucosas.</p></div>\n<div class=\"card\"><h4>Carcinoma epidermoide</h4><p>Origen en queratinocitos. Más queratósico, con eritema y descamación. Sale sobre lesiones premalignas (queratosis actínica) y puede afectar mucosas.</p></div>\n<div class=\"card\"><h4>Erisipela</h4><p><i>S. pyogenes</i>. Afecta la dermis superficial: placa roja, caliente, <b>bordes bien delimitados</b> y elevados.</p></div>\n<div class=\"card\"><h4>Celulitis</h4><p><i>S. aureus</i>. Llega hasta el TCSC: eritema, edema, calor y dolor con <b>bordes mal delimitados</b>.</p></div>\n<div class=\"card\"><h4>Pénfigo vulgar</h4><p>Ampolla <b>intraepidérmica</b> acantolítica, flácida, que se rompe en erosiones dolorosas. <b>Nikolsky +</b> y afecta mucosas.</p></div>\n<div class=\"card\"><h4>Penfigoide ampolloso</h4><p>Ampolla <b>subepidérmica</b> y tensa, en adultos mayores. Nikolsky negativo, casi sin mucosas.</p></div>\n<div class=\"card\"><h4>Herpes zóster</h4><p>Vesículas agrupadas sobre base eritematosa, siguiendo un <b>dermatoma</b>, unilaterales, sin cruzar la línea media; dolor urente previo.</p></div>\n<div class=\"card\"><h4>Pitiriasis versicolor</h4><p>Máculas hipo o hipercrómicas en el tronco superior con descamación fina que aparece al raspar (signo de la uñada).</p></div>\n</div>\n<p class=\"ref\">Conceptos de Dermato TeamMedic; casos ICODEM de la semana 2</p>\n</section>\n\n<section id=\"p-unas\" data-t=\"Uñas\">\n<h3>Uñas</h3>\n<div class=\"tw\"><table>\n<tr><th>Nombre</th><th>Qué se ve</th><th>Causa</th></tr>\n<tr><td><b>Coiloniquia</b></td><td>Uña <b>cóncava</b>, en cuchara (eje mayor transversal)</td><td><mark>Ferropenia</mark>, hemocromatosis, diálisis</td></tr>\n<tr><td><b>Platoniquia</b></td><td>Uña aplanada</td><td>Paso previo a la coiloniquia en la ferropenia</td></tr>\n<tr><td><b>Uñas hipocráticas</b> (vidrio de reloj, acropaquia)</td><td>Más convexas en sentido longitudinal y transversal, ángulo de Lovibond ≥ 180°</td><td><mark>Hipoxia crónica</mark></td></tr>\n<tr><td><b>Onicólisis</b></td><td>Separación de la lámina del lecho por la parte <b>distal</b></td><td>Hipertiroidismo, hongos, psoriasis, fármacos</td></tr>\n<tr><td><b>Onicomadesis</b></td><td>Separación por la parte <b>proximal</b> (alteración de la matriz) y caída</td><td>Enfermedad grave, liquen plano, paroniquia crónica, fármacos, trauma</td></tr>\n<tr><td><b>Onicosquicia</b></td><td>Desprendimiento en capas horizontales en el borde distal</td><td>Agua y detergentes, ferropenia</td></tr>\n<tr><td><b>Pitting</b> (hoyuelos)</td><td>Depresiones puntiformes</td><td>Psoriasis, alopecia areata</td></tr>\n<tr><td><b>Traquioniquia</b></td><td>Lámina áspera, opaca y grisácea que se rompe en el borde libre</td><td>Liquen plano, psoriasis</td></tr>\n<tr><td><b>Líneas de Beau</b></td><td>Depresiones <b>transversales</b> que avanzan con el crecimiento</td><td>Fiebre o enfermedad grave, eritrodermia, déficit de zinc</td></tr>\n<tr><td><b>Onicorrexis</b></td><td>Surcos o estrías <b>longitudinales</b></td><td>Vejez, alteraciones vasculares</td></tr>\n<tr><td><b>Onicauxis</b> / <b>paquioniquia</b> / <b>onicogrifosis</b></td><td>Engrosamiento sin deformación / engrosamiento + hiperplasia del lecho / engrosamiento, elongación e hipercurvatura</td><td>Edad avanzada, vasculopatía, no cortar la uña</td></tr>\n<tr><td><b>Braquioniquia</b></td><td>Uña más ancha que larga</td><td>Congénita</td></tr>\n<tr><td><b>Paroniquia</b> / <b>onicocriptosis</b></td><td>Inflamación del pliegue periungueal / uña encarnada</td><td>Infección / calzado, corte</td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Leuconiquia</th><th>Aspecto</th><th>Causa</th></tr>\n<tr><td><b>Uñas de Terry</b></td><td>Blanca en el 80% proximal con una banda distal rosada o marrón</td><td>Cirrosis, ICC, DM, envejecimiento</td></tr>\n<tr><td><b>Uñas de Lindsay</b> (mitad y mitad)</td><td>Mitad proximal blanca y mitad distal pardo-rojiza</td><td><mark>Insuficiencia renal crónica</mark></td></tr>\n<tr><td><b>Líneas de Muehrcke</b></td><td>Bandas blancas transversales pares en el <b>lecho</b>; no avanzan con el crecimiento y se atenúan con la presión</td><td>Hipoalbuminemia</td></tr>\n<tr><td><b>Líneas de Mees</b></td><td>Banda blanca transversal en la <b>lámina</b>; avanza con el crecimiento</td><td>Intoxicación por arsénico</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 23 · PDF 261-266</p>\n</section>\n\n<section id=\"p-pelo\" data-t=\"Pelo\">\n<h3>Pelo</h3>\n<p>Fases: <b>anágena</b> (crecimiento activo), <b>catágena</b> (involución, transitoria) y <b>telógena</b> (reposo; al final el pelo se cae). Se caen 40 a 60 pelos al día.</p>\n<ul>\n<li><b>Efluvio telógeno:</b> caída difusa por paso prematuro de folículos de anágena a telógena, unos 3 meses después de un estrés, fiebre alta, parto, cirugía, dietas o fármacos. En la tricoscopía hay menos pelos en anágena y más en telógena.</li>\n<li><b>Efluvio anágeno:</b> caída difusa durante la fase de crecimiento, típica de la <b>quimioterapia</b>.</li>\n<li><b>Alopecia areata:</b> placas bien delimitadas, sin inflamación ni cicatriz, en el cuero cabelludo.</li>\n</ul>\n<p class=\"ref\">Argente cap. 23 · PDF 267-268</p>\n</section>\n\n<section id=\"p-gang\" data-t=\"TCSC y ganglios\">\n<h3>Tejido celular subcutáneo y ganglios</h3>\n<p><b>TCSC:</b> edema (Godet), enfisema subcutáneo (crepitación), lipomas (blandos, móviles), <b>eritema nudoso</b> (nódulos rojos dolorosos en la cara anterior de las piernas) y nódulo de la hermana María José.</p>\n<div class=\"tw\"><table>\n<tr><th>Característica</th><th>Ganglio normal</th><th>Patológico</th></tr>\n<tr><td>Forma y tamaño</td><td>Elipsoidal, 0,5 a 1 cm (inguinales hasta 2 cm)</td><td>Redondeado, &gt; 1 cm (inguinal &gt; 2 cm)</td></tr>\n<tr><td>Sensibilidad</td><td>Indoloro</td><td>Doloroso (inflamatorio)</td></tr>\n<tr><td>Consistencia</td><td>Blanda, elástica</td><td>Firme o pétrea (neoplasia)</td></tr>\n<tr><td>Movilidad</td><td>Móvil</td><td>Adherido a la piel, a planos profundos o entre sí (conglomerado)</td></tr>\n<tr><td>Piel</td><td>Normal</td><td>Eritema, fístula, cicatriz, linfangitis</td></tr>\n</table></div>\n<ul>\n<li><b>Grupos de cabeza y cuello:</b> preauriculares, retroauriculares, occipitales, submentonianos, submaxilares, cervicales anteriores (superficiales), posteriores y profundos (bajo el ECM, siguen la yugular interna) y supraclaviculares. Se palpan con los pulpejos haciendo movimientos circulares.</li>\n<li><b>Virchow (signo de Troisier):</b> ganglio supraclavicular izquierdo por metástasis de un adenocarcinoma abdominal (estómago, páncreas) o pélvico.</li>\n<li><b>Epitrocleares:</b> sobre el epicóndilo medial, entre bíceps y tríceps; drenan la mitad cubital del antebrazo y la mano y los dedos medio, anular y meñique.</li>\n</ul>\n<p class=\"ref\">Argente cap. 24 · PDF 269-272; cap. 26 · PDF 276-281</p>\n</section>\n\n<section id=\"p-cab\" data-t=\"Cabeza: ojos, oídos, nariz y boca\">\n<h3>Cabeza: ojos, oídos, nariz y boca</h3>\n<div class=\"tw\"><table>\n<tr><th>Región</th><th>Lo que se pregunta</th></tr>\n<tr><td><b>Agudeza visual</b></td><td>Cartilla de <b>Snellen a 6 m (20 pies)</b>, un ojo a la vez. 20/40 significa que lee a 20 pies lo que un ojo normal lee a 40. Visión cercana: cartilla de Jaeger a unos 35 cm</td></tr>\n<tr><td><b>Párpados y pupilas</b></td><td><b>Horner</b>: ptosis, miosis, enoftalmos y anhidrosis (lesión simpática, tumor del vértice pulmonar). <b>Exoftalmos</b> bilateral en la enfermedad de Graves (el párpado no sigue al ojo al mirar abajo). Xantelasma (dislipidemia), arco senil, anillo de Kayser-Fleischer (Wilson)</td></tr>\n<tr><td><b>Fondo de ojo</b></td><td>Papila de bordes nítidos con excavación fisiológica menor que la mitad del disco; relación arteria/vena 2:3. HTA: cruces AV, hilos de cobre o plata, hemorragias en llama, exudados algodonosos, edema de papila. Diabetes: microaneurismas, exudados duros, neovasos</td></tr>\n<tr><td><b>Otoscopía</b></td><td>En el adulto se tracciona el pabellón <b>hacia arriba y atrás</b> (en el niño, hacia abajo y atrás). Membrana timpánica gris perlada, con el mango del martillo y el <b>triángulo luminoso anteroinferior</b>. Rinne y Weber están en el módulo de neuro</td></tr>\n<tr><td><b>Nariz y senos</b></td><td>Se palpan y percuten los senos frontales y maxilares. Drenaje: <b>meato medio</b> = frontal, maxilar y etmoidales anteriores; <b>meato superior</b> = etmoidales posteriores; <b>receso esfenoetmoidal</b> = esfenoidal; <b>meato inferior</b> = conducto nasolagrimal</td></tr>\n<tr><td><b>Boca</b></td><td><b>Conducto de Stenon</b> (parótida): en la mucosa yugal, frente al <b>2.º molar superior</b>. <b>Conducto de Wharton</b> (submaxilar): en el piso de la boca, a los lados del frenillo lingual. Manchas de Koplik (sarampión), ribete de Burton (plomo), lengua depapilada (déficit de B12 o hierro), lengua saburral (fiebre, deshidratación)</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 27 · PDF 282-294; agudeza visual en cap. 71</p>\n</section>\n"},
    {id:'om', name:'Osteomuscular', short:'OM', ready:true, lede:'Semana 6 · 4 de 41 preguntas. Maniobras por región con el repaso del Dr. Cáceres y el banco histórico de columna de TeamMedic.', guide:"<section id=\"o-tend\" data-t=\"Qué preguntan\">\n<h3>Qué preguntan</h3>\n<p>Según el repaso del Dr. Cáceres, el orden de frecuencia en el parcial es <b>miembro superior</b> (sobre todo mano, codo y hombro), luego <b>columna</b> y luego <b>miembro inferior</b>. Casi todo es \"nombre de la maniobra\" o \"qué maniobra pides\". Aprende cada maniobra con su estructura.</p>\n</section>\n\n<section id=\"o-mano\" data-t=\"Mano y muñeca\">\n<h3>Mano y muñeca</h3>\n<div class=\"tw\"><table>\n<tr><th>Cuadro</th><th>Clave</th><th>Maniobra</th></tr>\n<tr><td><b>Túnel carpiano</b> (nervio mediano)</td><td>Parestesias nocturnas en pulgar, índice, medio y mitad radial del anular; atrofia tenar. Mediano entre los tendones del palmar largo y del flexor radial del carpo. Factores: hipotiroidismo, embarazo, AR, trabajo repetitivo, fractura de radio</td><td><b>Phalen:</b> muñecas en flexión dorso con dorso, 1 minuto. <b>Tinel:</b> percutir la cara palmar de la muñeca (Tinel sirve sobre cualquier nervio: mediano en el carpo, cubital en el codo)</td></tr>\n<tr><td><b>Tenosinovitis de De Quervain</b></td><td>Dolor en la estiloides radial (madres recientes, celular). Tendones <mark>abductor largo y extensor corto del pulgar</mark></td><td><b>Finkelstein (Eichhoff):</b> pulgar dentro del puño y desviación cubital → dolor</td></tr>\n<tr><td><b>Dedo en ojal (boutonnière)</b></td><td>IFP en flexión + IFD en hiperextensión (AR, trauma del aparato extensor)</td><td>Inspección</td></tr>\n<tr><td><b>Cuello de cisne</b></td><td>IFP en hiperextensión + IFD en flexión (AR)</td><td>Inspección</td></tr>\n<tr><td><b>Dedo en martillo</b></td><td>IFD en flexión por rotura del extensor terminal</td><td>Inspección</td></tr>\n<tr><td><b>Lesiones nerviosas</b></td><td>Radial: mano caída (en escuadra). Cubital: mano en garra, Froment. Mediano: mano de predicador, atrofia tenar</td><td>Fuerza y sensibilidad</td></tr>\n<tr><td><b>Nódulos</b></td><td>Heberden (IFD) y Bouchard (IFP) = artrosis; AR respeta IFD</td><td>Inspección</td></tr>\n</table></div>\n</section>\n\n<section id=\"o-codo\" data-t=\"Codo\">\n<h3>Codo</h3>\n<div class=\"tw\"><table>\n<tr><th>Cuadro</th><th>Dónde duele</th><th>Maniobra</th></tr>\n<tr><td><b>Epicondilitis lateral</b> (codo de tenista)</td><td>Epicóndilo lateral; extensores y supinadores</td><td><b>Cozen (directo):</b> codo a 90°, pronación, puño cerrado, <mark>extender la muñeca contra resistencia</mark>. <b>Mills:</b> codo extendido, pronación y flexión pasiva de muñeca. Prueba de la silla</td></tr>\n<tr><td><b>Epitrocleitis</b> (codo de golfista)</td><td>Epitróclea (epicóndilo medial); flexores y pronadores</td><td><b>Cozen invertido:</b> <mark>flexión de muñeca contra resistencia</mark></td></tr>\n<tr><td><b>Bursitis olecraniana</b></td><td>Tumefacción blanda sobre el olécranon</td><td>Inspección y palpación</td></tr>\n</table></div>\n</section>\n\n<section id=\"o-hombro\" data-t=\"Hombro\">\n<h3>Hombro</h3>\n<div class=\"tw\"><table>\n<tr><th>Estructura</th><th>Movimiento</th><th>Maniobra</th></tr>\n<tr><td><b>Supraespinoso</b></td><td>Abducción (el más lesionado)</td><td><b>Jobe</b> (lata vacía): abducción 90°, 30° anterior, pulgar abajo, resistir el descenso</td></tr>\n<tr><td><b>Infraespinoso y redondo menor</b></td><td>Rotación externa</td><td><b>Patte:</b> abducción 90°, codo 90°, rotar hacia afuera contra resistencia</td></tr>\n<tr><td><b>Subescapular</b></td><td>Rotación interna (medial)</td><td><b>Gerber</b> (lift-off): mano en la región lumbar, separarla. <b>Napoleón</b> (belly press), <b>bear hug</b></td></tr>\n<tr><td><b>Porción larga del bíceps</b></td><td>Supinación y flexión</td><td><b>Yergason:</b> codo 90°, supinación contra resistencia, dolor en la corredera bicipital. <b>Speed:</b> flexión de hombro con codo extendido. <b>Lundington:</b> rotura</td></tr>\n<tr><td><b>Pinzamiento subacromial</b></td><td>Arco doloroso</td><td><b>Neer</b> (elevación pasiva en rotación interna), <b>Hawkins</b> (flexión 90°, codo 90°, rotación interna pasiva)</td></tr>\n</table></div>\n<p>El paciente que alivia el dolor con el brazo elevado sobre la cabeza (abducción y rotación externa) tiene, más bien, una <b>radiculopatía cervical</b> (C5-C6): se confirma con <b>Spurling</b>.</p>\n</section>\n\n<section id=\"o-col\" data-t=\"Columna\">\n<h3>Columna</h3>\n<h4>Cervical</h4>\n<ul>\n<li><b>Spurling:</b> compresión axial con extensión y lateroflexión hacia el lado afectado → dolor radicular por compresión foraminal.</li>\n<li><b>Distracción (Jostes):</b> tracción suave de la cabeza que alivia el dolor radicular.</li>\n<li><b>Naffziger-Jones:</b> compresión de ambas yugulares 15 s → aumenta la presión intratecal → dolor radicular. <b>Valsalva</b> también aumenta la presión intratecal.</li>\n<li><b>Adson:</b> inspiración profunda con rotación de la cabeza, brazo en abducción y extensión → se reduce el pulso radial: compresión de la <mark>arteria subclavia</mark> entre los escalenos o por costilla cervical.</li>\n<li><b>Lhermitte:</b> descarga eléctrica al flexionar el cuello → mielopatía o desmielinización.</li>\n</ul>\n<div class=\"tw\"><table>\n<tr><th>Raíz</th><th>Fuerza</th><th>Reflejo</th><th>Sensibilidad</th></tr>\n<tr><td><b>C5</b></td><td>Deltoides, bíceps (abducción)</td><td>Bicipital</td><td>Cara lateral del brazo</td></tr>\n<tr><td><b>C6</b></td><td>Bíceps, extensores de muñeca</td><td>Estilorradial (braquiorradial)</td><td>Pulgar e índice, borde radial del antebrazo</td></tr>\n<tr><td><b>C7</b></td><td>Tríceps (extensión del codo), flexores de muñeca</td><td><mark>Tricipital</mark></td><td>Dedo medio</td></tr>\n<tr><td><b>C8</b></td><td>Flexores de los dedos</td><td>Cubitopronador</td><td>4.º y 5.º dedos, borde cubital del antebrazo</td></tr>\n<tr><td><b>T1</b></td><td>Interóseos (abducción y aducción de dedos)</td><td>—</td><td>Cara medial del brazo</td></tr>\n</table></div>\n<h4>Dorsal: escoliosis y espondilitis</h4>\n<ul>\n<li><b>Escoliosis:</b> desnivel de hombros, escápulas y crestas ilíacas, escápula prominente, triángulo del talle asimétrico, <mark>giba costal</mark> al flexionar hacia adelante (<b>test de Adams</b>), plomada desviada. Cobb > 10°.</li>\n<li><b>Espondilitis anquilosante:</b> varón joven, dolor lumbar inflamatorio (insidioso, nocturno, rigidez matutina, <mark>mejora con el movimiento y empeora con el reposo</mark>), sacroileítis, rectificación lumbar, hipercifosis, expansión torácica reducida. Pruebas: <b>Schober</b> (L5 y 10 cm arriba; al flexionar debe aumentar 5 cm o más), <b>Ott</b> (dorsal, C7 y 30 cm abajo), <b>prueba de los 3 puntos</b> (occipucio a la pared). Se asocia a psoriasis (HLA-B27).</li>\n</ul>\n<h4>Lumbar</h4>\n<div class=\"tw\"><table>\n<tr><th>Maniobra</th><th>Cómo</th><th>Qué indica</th></tr>\n<tr><td><b>Lasègue</b></td><td>Supino, elevar la pierna extendida; dolor radicular entre 30° y 70°</td><td>Compresión de L5-S1 (ciático). Dolor más allá de 70° no es radicular (isquiotibiales, lumbalgia)</td></tr>\n<tr><td><b>Bragard</b></td><td>En el Lasègue positivo, bajar la pierna hasta que cese el dolor y hacer dorsiflexión del pie</td><td>Si reaparece, confirma la irritación radicular por elongación</td></tr>\n<tr><td><b>Neri</b></td><td>Flexión de la cabeza (sentado con piernas colgando); reforzado si se extiende la pierna</td><td>Dolor radicular</td></tr>\n<tr><td><b>Lasègue invertido / estiramiento femoral</b></td><td>Prono, flexionar la rodilla o extender la cadera</td><td>Raíces L2-L4 (nervio femoral)</td></tr>\n<tr><td><b>Goldthwait</b></td><td>Mano bajo la columna lumbar durante el Lasègue</td><td>Dolor antes de que se mueva la columna: sacroilíaca; después: lumbosacra</td></tr>\n<tr><td><b>Dejerine</b></td><td>Tos, estornudo o pujo aumentan el dolor</td><td>Lesión que ocupa espacio en el canal (hernia)</td></tr>\n<tr><td><b>Milgram</b></td><td>Supino, elevar ambas piernas unos 5 cm y sostener 30 s</td><td>No lo logra o duele: patología intratecal</td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Raíz</th><th>Fuerza y marcha</th><th>Reflejo</th><th>Sensibilidad</th></tr>\n<tr><td><b>L3</b></td><td>Cuádriceps</td><td>Rotuliano (parcial)</td><td>Cara anterior del muslo</td></tr>\n<tr><td><b>L4</b></td><td>Cuádriceps, tibial anterior</td><td><mark>Rotuliano</mark></td><td>Cara medial de la pierna, maléolo interno</td></tr>\n<tr><td><b>L5</b> (hernia L4-L5)</td><td>Extensor del hallux, dorsiflexión; <mark>no camina en talones</mark>, estepaje</td><td>Sin reflejo propio</td><td>Cara lateral de la pierna, dorso del pie, 1.er dedo</td></tr>\n<tr><td><b>S1</b> (hernia L5-S1)</td><td>Gastrocnemio, flexión plantar; <mark>no camina en puntas</mark></td><td><mark>Aquíleo</mark></td><td>Borde lateral del pie, 4.º-5.º dedos, planta, talón</td></tr>\n</table></div>\n<p><b>Lumbago mecánico:</b> inicio agudo tras esfuerzo, mejora con reposo, sin irradiación. <b>Inflamatorio:</b> insidioso, nocturno, mejora con la actividad. <b>Radicular:</b> irradiación por dermatoma, parestesias, hiporreflexia.</p>\n<h4>Sacroilíaca</h4>\n<ul>\n<li><b>FABERE / Patrick:</b> flexión, abducción y rotación externa con el tobillo sobre la rodilla opuesta; se fija la EIAS contralateral y se presiona la rodilla. Dolor posterior = sacroilíaca; inguinal = cadera.</li>\n<li><b>Gaenslen:</b> hiperextensión del miembro a explorar, que cuelga fuera de la camilla, mientras el otro se flexiona al tórax.</li>\n<li><b>Erichsen y Volkmann:</b> presión sobre las crestas o espinas ilíacas anteriores (compresión y separación de la pelvis) que despierta dolor sacroilíaco.</li>\n<li>Causas de sacroileítis: espondilitis anquilosante, artritis psoriásica, reactiva, enteropática.</li>\n</ul>\n</section>\n\n<section id=\"o-mi\" data-t=\"Miembro inferior\">\n<h3>Cadera, rodilla, tobillo y pie</h3>\n<div class=\"tw\"><table>\n<tr><th>Región</th><th>Maniobra</th><th>Qué evalúa</th></tr>\n<tr><td><b>Cadera</b></td><td><b>Trendelenburg</b> (apoyo monopodal, cae la pelvis del lado opuesto)</td><td>Glúteo medio</td></tr>\n<tr><td></td><td><b>FADIR</b> (flexión, aducción, rotación interna)</td><td>Pinzamiento femoroacetabular</td></tr>\n<tr><td></td><td><b>Thomas</b></td><td>Contractura en flexión de cadera</td></tr>\n<tr><td></td><td><b>Ober</b></td><td>Cintilla iliotibial</td></tr>\n<tr><td><b>Rodilla</b></td><td><b>McMurray:</b> flexión completa, rotación de la tibia y extensión lenta → chasquido en la interlínea</td><td>Meniscos (rotación externa: medial)</td></tr>\n<tr><td></td><td><b>Apley:</b> prono, rodilla 90°, compresión y rotación</td><td>Meniscos (con distracción: ligamentos)</td></tr>\n<tr><td></td><td><b>Moragas, Thessaly</b></td><td>Meniscos</td></tr>\n<tr><td></td><td><b>Lachman</b> (20-30°) y <b>cajón anterior</b> (90°)</td><td>Ligamento cruzado anterior</td></tr>\n<tr><td></td><td><b>Cajón posterior</b></td><td>Ligamento cruzado posterior</td></tr>\n<tr><td></td><td><b>Estrés en varo / valgo</b></td><td>Colaterales lateral / medial</td></tr>\n<tr><td></td><td><b>Choque rotuliano</b></td><td>Derrame articular</td></tr>\n<tr><td><b>Tobillo y pie</b></td><td><b>Thompson:</b> comprimir la pantorrilla en prono; si no hay flexión plantar</td><td>Rotura del tendón de Aquiles</td></tr>\n<tr><td></td><td><b>Windlass:</b> dorsiflexión del hallux reproduce el dolor</td><td>Fascitis plantar (dolor en los primeros pasos de la mañana)</td></tr>\n<tr><td></td><td><b>Tilt</b> (inclinación talar)</td><td>Ligamento calcaneoperoneo (esguince por inversión)</td></tr>\n</table></div>\n<ul>\n<li><b>Luxación posterior de cadera:</b> miembro acortado en flexión, aducción y rotación interna.</li>\n<li><b>Gonartrosis:</b> anciano, rodillas en varo, crepitación, rigidez breve.</li>\n<li><b>Pie equinovaro:</b> flexión plantar, inversión del retropié y aducción del antepié. <b>Pie cavo:</b> arco longitudinal aumentado, dedos en garra.</li>\n</ul>\n<p class=\"ref\">Argente cap. 29 · PDF 304-344; Repaso Dr. Cáceres (Bioeasy); Banco histórico TeamMedic</p>\n</section>\n"},
    {id:'hc', name:'HC y signos vitales', short:'HC', ready:true, lede:'Semana 1 · 1 de 41 preguntas. Historia clínica, signos vitales, somatometría y facies (Argente caps. 9, 14 y 21), con preguntas de práctica.', guide:"<section id=\"h-hc\" data-t=\"Historia clínica\">\n<h3>Historia clínica</h3>\n<p>Solo vino 1 de 41 preguntas en el último parcial, así que basta con esta página. Lo que más se cruza con otros módulos son las <b>facies</b> (en 2022 preguntaron la sardónica) y los <b>signos vitales</b>.</p>\n<ul>\n<li><b>Qué es:</b> documento médico-legal, confidencial, ordenado y con letra legible, donde se registra la atención. En Perú lo regula la NTS N.° 139-MINSA (gestión de la historia clínica) y la HC electrónica está en la Ley 30024 (RENHICE). El consentimiento informado forma parte de ella.</li>\n<li><b>Estructura:</b> <b>filiación</b> (nombre, edad, sexo, lugar de nacimiento y procedencia, ocupación, grado de instrucción, estado civil, religión, informante) → <b>anamnesis</b> → examen físico → diagnósticos (presuntivos) → plan de trabajo y tratamiento → evolución.</li>\n<li><b>Enfermedad actual:</b> tiempo de enfermedad, forma de inicio (brusco o insidioso), curso (progresivo, estacionario, intermitente), síntomas y signos principales y relato cronológico. Para el dolor sirve ALICIA (aparición, localización, intensidad, carácter, irradiación, atenuantes o agravantes).</li>\n<li><b>Funciones biológicas:</b> apetito, sed, sueño, orina, deposiciones y peso (con su variación).</li>\n<li><b>Antecedentes:</b> personales fisiológicos (incluidos los ginecoobstétricos), patológicos (enfermedades, cirugías, transfusiones, alergias, medicamentos, hábitos), familiares y socioeconómicos o epidemiológicos.</li>\n<li><b>Revisión por sistemas (anamnesis por aparatos):</b> síntomas de cada sistema que no salieron en el relato.</li>\n<li><b>HC orientada al problema (Weed):</b> base de datos, lista de problemas, planes y notas de evolución en formato SOAP (subjetivo, objetivo, apreciación y plan).</li>\n</ul>\n<p class=\"ref\">Argente cap. 9 · PDF 115-125; cap. 10 · PDF 126-129</p>\n</section>\n\n<section id=\"h-sv\" data-t=\"Signos vitales\">\n<h3>Signos vitales</h3>\n<div class=\"tw\"><table>\n<tr><th>Signo</th><th>Normal en el adulto</th><th>Detalles que preguntan</th></tr>\n<tr><td><b>Presión arterial</b></td><td>&lt; 120/80 mmHg</td><td>Reposo 5 min, brazo a la altura del corazón, manguito 2-3 cm por encima de la fosa antecubital con la cámara cubriendo el 80% de la circunferencia del brazo. Primero el método palpatorio (inflar 20-30 mmHg sobre la desaparición del pulso radial) para evitar la <b>brecha auscultatoria</b>. Korotkoff I = sistólica y V = diastólica. Manguito pequeño sobrestima la PA</td></tr>\n<tr><td><b>Pulso</b></td><td>60-100 lpm, regular</td><td>Radial con 2-3 dedos, 1 minuto si es irregular. Bradicardia &lt; 60, taquicardia &gt; 100. <b>Signo de Faget</b>: fiebre con bradicardia relativa (fiebre tifoidea, Legionella, brucelosis, fiebre por fármacos)</td></tr>\n<tr><td><b>Frecuencia respiratoria</b></td><td>12-20 rpm</td><td>Se cuenta sin que el paciente lo note (mientras parece que se toma el pulso). Patrones (Kussmaul, Cheyne-Stokes, Biot) en el módulo respiratorio</td></tr>\n<tr><td><b>Temperatura</b></td><td>Axilar 36-37 °C</td><td>La central es unos 0,5 °C más alta que la axilar; varía hasta 0,6 °C en el día. Fiebre es un reajuste del termostato hipotalámico; la hipertermia no</td></tr>\n<tr><td><b>Saturación de O2</b></td><td>≥ 95% (al nivel del mar)</td><td>Pulsioxímetro; falla con mala perfusión, esmalte o CO</td></tr>\n</table></div>\n<p><b>Clasificación de la PA (AHA/ACC 2017):</b> elevada 120-129/&lt; 80; HTA estadio 1 130-139 u 80-89; estadio 2 ≥ 140 o ≥ 90. Las guías europeas siguen definiendo HTA desde 140/90.</p>\n<p><b>Tipos de fiebre:</b> <b>continua</b> (varía menos de 0,6 °C al día), <b>remitente</b> (oscila pero no llega a lo normal), <b>intermitente</b> (vuelve a lo normal cada día), <b>recurrente</b> (reaparece tras días sin fiebre; Pel-Ebstein en el linfoma de Hodgkin, terciana y cuartana en el paludismo).</p>\n<p class=\"ref\">Argente 35-2 (pulso) · PDF 434-444; 35-3 (PA) · PDF 445-451; cap. 14 (fiebre) · PDF 159-169</p>\n</section>\n\n<section id=\"h-somato\" data-t=\"Somatometría\">\n<h3>Somatometría</h3>\n<div class=\"tw\"><table>\n<tr><th>IMC (peso/talla²)</th><th>Interpretación</th></tr>\n<tr><td>&lt; 18,5</td><td>Bajo peso</td></tr>\n<tr><td>18,5 a 24,9</td><td>Normal</td></tr>\n<tr><td>25 a 29,9</td><td>Sobrepeso</td></tr>\n<tr><td>≥ 30</td><td>Obesidad (I: 30-34,9; II: 35-39,9; III: ≥ 40)</td></tr>\n</table></div>\n<p><b>Perímetro abdominal</b> (a la altura del punto medio entre el reborde costal y la cresta ilíaca): la guía MINSA marca riesgo alto desde 94 cm en varones y 80 cm en mujeres, y muy alto desde 102 y 88 cm.</p>\n<p class=\"ref\">Argente cap. 21 · PDF 241 (cuadro 21-2)</p>\n</section>\n\n<section id=\"h-gral\" data-t=\"Apreciación general y facies\">\n<h3>Apreciación general y facies</h3>\n<p><b>Apreciación general:</b> estado general, de nutrición y de hidratación (aparente buen, regular o mal estado); conciencia (lúcido, orientado en tiempo, espacio y persona); actitud, decúbito y marcha.</p>\n<div class=\"tw\"><table>\n<tr><th>Decúbito o actitud</th><th>Sugiere</th></tr>\n<tr><td>Activo (lo cambia a voluntad) vs. <b>pasivo</b> (no puede moverse)</td><td>El pasivo es de enfermos graves, en coma o con parálisis</td></tr>\n<tr><td><b>Ortopnea</b> (sentado o con varias almohadas)</td><td>Insuficiencia cardíaca izquierda</td></tr>\n<tr><td><b>Plegaria mahometana</b> (genupectoral)</td><td>Derrame pericárdico grande</td></tr>\n<tr><td>Lateral sobre el lado enfermo</td><td>Derrame pleural grande</td></tr>\n<tr><td><b>Gatillo de fusil</b> (opistótonos)</td><td>Meningitis (y tétanos)</td></tr>\n<tr><td>Inmóvil por dolor / inquieto sin posición</td><td>Peritonitis / cólico renal o biliar</td></tr>\n</table></div>\n<div class=\"tw\"><table>\n<tr><th>Facies</th><th>Rasgos</th><th>Enfermedad</th></tr>\n<tr><td><b>Hipocrática</b></td><td>Ojos hundidos, nariz afilada, palidez, sudor frío</td><td>Agonía, peritonitis, deshidratación grave</td></tr>\n<tr><td><b>Mitral</b></td><td>Palidez con cianosis peribucal y eritrosis malar</td><td>Estenosis mitral</td></tr>\n<tr><td><b>Lúpica</b></td><td>Eritema malar \"en alas de mariposa\" que respeta los surcos nasogenianos</td><td>LES</td></tr>\n<tr><td><b>Hipertiroidea</b></td><td>Mirada brillante, retracción palpebral, exoftalmos</td><td>Graves-Basedow</td></tr>\n<tr><td><b>Hipotiroidea (mixedematosa)</b></td><td>Cara abotagada, pálida, pérdida del tercio externo de las cejas</td><td>Hipotiroidismo</td></tr>\n<tr><td><b>Cushingoide</b></td><td>Cara redonda \"en luna llena\", pletórica, con hirsutismo</td><td>Síndrome de Cushing, corticoides</td></tr>\n<tr><td><b>Acromegálica</b></td><td>Arcos superciliares, mandíbula y nariz grandes</td><td>Acromegalia</td></tr>\n<tr><td><b>Parkinsoniana</b></td><td>Inexpresiva, \"en máscara\", sin parpadeo</td><td>Parkinson</td></tr>\n<tr><td><b>Sardónica</b></td><td>Risa forzada por contractura de los músculos faciales (trismus)</td><td><mark>Tétanos</mark></td></tr>\n<tr><td><b>Leonina</b></td><td>Infiltración y engrosamiento de la piel de la cara, sin cejas</td><td>Lepra lepromatosa</td></tr>\n<tr><td><b>Renal</b></td><td>Palidez y edema palpebral matutino</td><td>Síndrome nefrótico o nefrítico</td></tr>\n<tr><td><b>Adenoidea</b></td><td>Boca abierta, paladar ojival</td><td>Hipertrofia adenoidea</td></tr>\n</table></div>\n<p class=\"ref\">Argente cap. 21 · PDF 235-243</p>\n</section>\n"}
  ],
  qs: []
};

opts:[`Apendicitis complicada con peritonitis`,`Pancreatitis hemorrágica, rotura aórtica o embarazo ectópico roto`,`Obstrucción intestinal`,`Hipertensión portal`],ans:1,exp:`Son equimosis (flancos y periumbilical) por sangrado retroperitoneal o intraperitoneal.`,ref:'Argente cap. 47 · PDF 836'},
{id:'tm-a06',src:'tm',mod:'abd',tema:'Auscultación',stem:`¿Qué sonido es característico en la vena umbilical de un paciente cirrótico?`,
opts:[`Murmullo vesicular`,`Sibilancias`,`Rumor de Cruveilhier-Baumgarten`,`Ruidos hidroaéreos`],ans:2,exp:`Murmullo venoso periumbilical por recanalización de la vena umbilical en la hipertensión portal.`},
{id:'tm-a07',src:'tm',mod:'abd',tema:'Ascitis',stem:`Varón de 50 años con distensión progresiva del abdomen y ombligo evertido. Sospechamos:`,
opts:[`Fecaloma`,`Quiste pancreático`,`Meteorismo intestinal severo`,`Ascitis`],ans:3,exp:`Distensión generalizada con ombligo evertido = ascitis. Con ombligo hundido piensa en obesidad o meteorismo.`},
{id:'tm-a08',src:'tm',mod:'abd',tema:'Percusión',stem:`En un paciente con sospecha de perforación de víscera hueca y abdomen agudo, usted percute el tórax y el abdomen superior. ¿Qué hallazgo buscaría específicamente para confirmar neumoperitoneo?`,
opts:[`Ausencia de ruidos hidroaéreos`,`Desaparición de la matidez hepática`,`Timpanismo en el espacio de Traube`,`Submatidez en la quinta costilla derecha`],ans:1,exp:`Signo de Jobert. El timpanismo de Traube es normal.`},
{id:'tm-a09',src:'tm',mod:'abd',tema:'Ascitis',fija:true,stem:`La maniobra más sensible para detectar ascitis es:`,
opts:[`Onda ascítica`,`Matidez en flancos`,`Matidez desplazable`,`Flancos sobresalientes o protuberantes`],ans:2,exp:`Clave del banco: la matidez desplazable es la más sensible y la onda ascítica la más específica. Ojo: algunos estudios (McGee) dan a la matidez en flancos una sensibilidad parecida o mayor.`,conf:'media'},
{id:'tm-a10',src:'tm',mod:'abd',tema:'Ascitis',stem:`Varón de 65 años con antecedente de cirugía coronaria. Hace 15 días tiene disnea progresiva y malestar abdominal. Hay distensión abdominal y edema de miembros inferiores; sospecha insuficiencia cardíaca derecha con ascitis. ¿Qué hallazgo apoya la ascitis?`,
opts:[`Matidez en los cuadrantes superiores y timpanismo en los inferiores`,`Predominio de timpanismo en todo el abdomen`,`La percusión en un flanco transmite con agudeza un impulso al flanco opuesto`,`El límite entre timpanismo y matidez no cambia con la postura`],ans:2,exp:`Es la onda ascítica. En la ascitis la matidez está en las zonas declives (flancos, inferior) y el límite sí cambia con la postura.`,ref:'Argente cap. 47 · PDF 838'},
{id:'tm-a11',src:'tm',mod:'abd',tema:'Ascitis',stem:`En la exploración de ascitis en un paciente con cirrosis es necesario realizar la maniobra de oleada u onda de líquido, para la cual se necesita:`,
opts:[`Sólo una ecografía`,`Las dos manos del examinador`,`Las dos manos del examinador y una tercera mano de apoyo en la línea media del abdomen`,`La mano dominante del examinador`],ans:2,exp:`La tercera mano (del paciente o de un ayudante) en la línea media bloquea la transmisión por la pared y el tejido graso.`},
{id:'tm-a12',src:'tm',mod:'abd',tema:'Circulación colateral',stem:`Durante la exploración de un paciente con ascitis se observa circulación colateral con venas dilatadas que irradian desde el ombligo hacia la periferia. ¿Cuál es la causa más probable?`,
opts:[`Insuficiencia cardíaca derecha`,`Trombosis venosa profunda`,`Hipertensión portal`,`Síndrome nefrótico`],ans:2,exp:`Cabeza de medusa = hipertensión portal. En la obstrucción de la vena cava inferior las venas van por los flancos de abajo hacia arriba.`},
{id:'tm-a13',src:'tm',mod:'abd',tema:'Palpación',stem:`Marque la alternativa INCORRECTA:`,
opts:[`El signo de Jobert es la ausencia de matidez hepática por interposición de aire por perforación de víscera hueca`,`El signo de Chilaiditi es la ausencia de matidez hepática por interposición del colon transverso por delante del hígado`,`El colon ascendente y el transverso se palpan con facilidad en un paciente delgado`,`La maniobra de Minkowski es útil para reconocer tumores retroperitoneales y el riñón`,`La posición de Naegeli se utiliza cuando no se palpa el bazo`],ans:2,exp:`En un sano se palpan el ciego y el sigmoides; el colon ascendente, el transverso y el descendente no.`},
{id:'tm-a14',src:'tm',mod:'abd',tema:'Hígado',stem:`En la exploración palpatoria del abdomen, el método de Brugsch se emplea en la evaluación de:`,
opts:[`Vesícula`,`Riñón`,`Bazo`,`Hígado`],ans:3,exp:`Es el método de elección para palpar el hígado cirrótico.`},
{id:'tm-a15',src:'tm',mod:'abd',tema:'Palpación',stem:`¿Qué maniobra se usa en la palpación superficial para iniciar la exploración abdominal?`,
opts:[`Merlo`,`Glenard`,`Hausmann`,`Minkowski`],ans:0,exp:`"Mano de escultor" de Merlo para la palpación superficial. Glenard es para el riñón (ptosis) y Minkowski para la palpación profunda.`,conf:'media'},
{id:'tm-a16',src:'tm',mod:'abd',tema:'Peritoneo',stem:`Con respecto a la exploración abdominal, marque la respuesta CORRECTA:`,
opts:[`El área semilunar de Traube está limitada a la derecha por el páncreas`,`El signo de Blumberg es positivo cuando aparece dolor a la descompresión en la fosa ilíaca izquierda`,`En la maniobra de Chauffard o del peloteo se usan ambas manos para explorar el riñón`,`El punto renoureteral inferior está en la unión de la línea biilíaca con el borde externo de los rectos`,`El signo de Guéneau de Mussy indica peritonitis si despierta dolor al descomprimir cualquier zona del abdomen`],ans:4,exp:`Traube limita a la derecha con el hígado; Blumberg es en la FID; Chauffard es una maniobra del hígado; línea biilíaca + borde del recto es el punto ureteral medio.`,ref:'Argente cap. 47 · PDF 839'},
{id:'tm-a17',src:'tm',mod:'abd',tema:'Peritoneo',stem:`Son hallazgos de irritación peritoneal, EXCEPTO:`,
opts:[`Ausencia de ruidos intestinales`,`Prueba del obturador positiva`,`Equimosis periumbilical`,`Rigidez involuntaria de los músculos abdominales`],ans:2,exp:`La equimosis periumbilical (Cullen) es sangrado retroperitoneal, no irritación peritoneal.`},
{id:'tm-a18',src:'tm',mod:'abd',tema:'Apendicitis',stem:`Paciente joven con dolor en el cuadrante inferior derecho, inmediatamente por encima de la porción media del ligamento inguinal derecho. Signos del obturador y del psoas positivos. No hay organomegalia. Su hipótesis:`,
opts:[`Colecistitis aguda`,`Pancreatitis aguda`,`Obstrucción intestinal`,`Apendicitis`],ans:3,exp:`Psoas positivo sugiere apéndice retrocecal y obturador positivo, pélvico.`},
{id:'tm-a19',src:'tm',mod:'abd',tema:'Abdomen agudo',stem:`Mujer de 20 años con dolor abdominal intenso 9/10, tipo cólico, en fosa ilíaca derecha desde hace 5 horas. Ciclo menstrual irregular, última menstruación hace 2 meses, relaciones sin protección. ¿Hipótesis?`,
opts:[`Apendicitis aguda`,`Embarazo ectópico`,`Pancreatitis aguda`,`Infección urinaria`],ans:1,exp:`Mujer en edad fértil con amenorrea y dolor en fosa ilíaca: descartar primero embarazo ectópico.`},
{id:'tm-a20',src:'tm',mod:'abd',tema:'Kehr',fija:true,stem:`Varón de 42 años con rotura de bazo tras un accidente de tránsito. Tiene dolor abdominal intenso que irradia al hombro izquierdo, supuestamente por irritación del diafragma. ¿Qué signo describe mejor esta patología?`,
opts:[`Dolor pélvico intermenstrual`,`Signo de Kehr`,`Signo de Rovsing`,`Signo del obturador`],ans:1,exp:`Kehr: dolor referido al hombro izquierdo por sangre bajo el diafragma.`},
{id:'tm-a21',src:'tm',mod:'abd',tema:'Peritoneo',stem:`Signos de un paciente con abdomen agudo y peritonitis: 1. Blumberg 2. Markle 3. Signo del charco 4. Rovsing 5. Godet`,
opts:[`1, 2, 4`,`1, 3, 5`,`2, 3, 4`,`1, 2, 3`],ans:0,exp:`Blumberg (descompresión), Markle (golpe de talón) y Rovsing son de irritación peritoneal. El charco es de ascitis y el Godet de edema.`},
{id:'tm-a22',src:'tm',mod:'abd',tema:'Apendicitis',stem:`Varón de 15 años con dolor moderado desde hace 10 h, hiporexia y náuseas; hace 2 h el dolor aumentó y apareció fiebre. Al examen hay dolor a la descompresión en fosa ilíaca derecha. Signo:`,
opts:[`McBurney`,`Rovsing`,`Aaron`,`Blumberg`,`Murphy`],ans:3,exp:`Dolor a la descompresión = Blumberg. McBurney es dolor a la presión en el punto.`},
{id:'tm-a23',src:'tm',mod:'abd',tema:'Puntos',stem:`¿Cuál es el punto doloroso en la diverticulitis?`,
opts:[`Punto de Murphy`,`Fosa ilíaca izquierda`,`Punto ureteral`,`Punto cístico`],ans:1,exp:`"McBurney izquierdo": la diverticulitis suele afectar el sigmoides.`},
{id:'tm-a24',src:'tm',mod:'abd',tema:'Vesícula',stem:`Mujer de 48 años, multípara y con sobrepeso, con dolor de 10 h que empezó 1 h después de una comida rica en grasas, en hipocondrio derecho irradiado al dorso, con náuseas y vómitos. FC 104, T 38 °C. Hay dolor en hipocondrio derecho con Murphy positivo y leucocitosis. ¿Presunción diagnóstica?`,
opts:[`Pancreatitis aguda`,`Cólico biliar`,`Coledocolitiasis`,`Colecistitis aguda`],ans:3,exp:`Dolor biliar de más de 6 h con fiebre, leucocitosis y Murphy positivo = colecistitis aguda. El cólico biliar no da fiebre ni Murphy.`},
{id:'tm-a25',src:'tm',mod:'abd',tema:'Vesícula',fija:true,stem:`Mientras el paciente hace una inspiración profunda, usted palpa con suavidad el hipocondrio derecho; la vesícula inflamada choca contra los dedos y provoca dolor con detención de la inspiración. Es el signo de:`,
opts:[`Murphy`,`Blumberg`,`Kehr`,`McBurney`],ans:0,exp:`Murphy: dolor o detención de la inspiración al presionar el punto cístico.`,ref:'Argente cap. 47 · PDF 848'},
{id:'tm-a26',src:'tm',mod:'abd',tema:'Apendicitis',stem:`La maniobra usada para examinar un apéndice de ubicación pélvica es:`,
opts:[`Signo de Aaron`,`Signo de Jobert`,`Signo de Markle`,`Signo de Lanz`],ans:3,exp:`El punto de Lanz (en la línea biespinosa) corresponde al apéndice pélvico. También sirve el signo del obturador.`},
{id:'tm-a27',src:'tm',mod:'abd',tema:'Hígado',stem:`Varón con hígado de borde blando y doloroso a la palpación. Su hipótesis diagnóstica:`,
opts:[`Cirrosis hepática`,`Hepatitis aguda`,`Insuficiencia cardíaca`,`Hígado tumoral`],ans:1,exp:`Hepatitis aguda: blando, liso y doloroso. La cirrosis es dura con borde agudo; el hígado tumoral es duro e irregular.`},
{id:'tm-a28',src:'tm',mod:'abd',tema:'Riñón',fija:true,stem:`Mujer de 32 años con dolor lumbar derecho crónico y 5 episodios de pielonefritis aguda derecha en 10 años. Al examen se palpan ambos riñones. ¿Con qué maniobra evalúa la presencia y el grado de ptosis renal?`,
opts:[`Método de Guyon`,`Método de Goelet`,`Método de Israel`,`Método de Montenegro`,`Método de Glenard`],ans:4,exp:`Glenard (acecho, captura y escape) es el de elección para la ptosis renal. Igual que en el parcial 2022.`},
{id:'tm-a29',src:'tm',mod:'abd',tema:'Riñón',fija:true,stem:`Varón de 56 años con masa abdominal. Se le pide que se acueste en decúbito ventral y se inicia una evaluación parecida a la renal, pero como un peloteo inverso. La maniobra se llama ... y sirve para evaluar ...`,
opts:[`Guyon – tumor renal`,`Glenard invertida – tumor renal`,`Montenegro – tumor extrarrenal`,`Israel – riñón normal`,`No existe dicha maniobra`],ans:2,exp:`Montenegro: decúbito ventral, para descartar masas extrarrenales.`},
{id:'tm-a30',src:'tm',mod:'abd',tema:'Riñón',stem:`Al auscultar en busca de soplos en las arterias renales, se debe considerar que la arteria renal derecha está a la altura de:`,
opts:[`L2`,`T1`,`T2`,`T3`,`T4`],ans:0,exp:`Las arterias renales salen de la aorta a la altura de L1-L2 (el hilio renal está entre L1 y L2).`,conf:'media'},
{id:'tm-a31',src:'tm',mod:'abd',tema:'Cólico renal',stem:`Mujer de 28 años, sexualmente activa, con dolor lumbar derecho súbito, cólico, 9/10, irradiado a flanco y región pélvica, náuseas, orina oscura y rojiza y leve disuria. Episodio similar hace 2 años. Intranquila y sudorosa, sin posición antálgica; PRU superior derecho positivo, afebril, PA 110/60, FC 104, puñopercusión lumbar derecha positiva. Orina: leucocitos 2-3/campo, hematíes isomórficos +++, sin gérmenes; leucocitos 7200, creatinina 0.9. ¿Hipótesis?`,
opts:[`Pielonefritis aguda por E. coli`,`Hematuria macroscópica glomerular`,`Cólico renoureteral`,`Desgarro de aneurisma de aorta abdominal`,`Lumbalgia mecánica`],ans:2,exp:`Dolor cólico con inquietud, hematuria no glomerular (isomórfica), sin fiebre ni leucocituria = litiasis.`,ref:'Argente cap. 51 · PDF 986-987'},
{id:'tm-a32',src:'tm',mod:'abd',tema:'Puntos',stem:`Los puntos renoureterales que se pueden explorar por vía rectal o vaginal son:`,
opts:[`Ureteral inferior`,`Costomuscular`,`Ureteral superior`,`Ureteral medio`],ans:0,exp:`El ureteral inferior (entrada del uréter en la vejiga) solo se alcanza por tacto rectal o vaginal.`},
{id:'tm-a33',src:'tm',mod:'abd',tema:'Puntos',fija:true,stem:`El punto de exploración localizado en la intersección del plano umbilical con el borde externo del músculo recto anterior del abdomen se denomina:`,
opts:[`Punto ureteral inferior`,`Punto ureteral superior`,`Punto ureteral medio`,`Punto ureteral bisiliaco`,`Punto ureteral anterior`],ans:1,exp:`Línea umbilical = ureteral superior; línea biilíaca = ureteral medio.`}
);

// Cardio: Banco Bioeasy (Dr. Villegas) y Conceptos/Banqueo TeamMedic (Dr. Rojas). Sin repetir las del parcial 2022.
S.qs.push(
{id:'bio-01',src:'bio',mod:'cardio',tema:'Estenosis aórtica',fija:true,stem:`Hombre de 79 años con disnea progresiva y mareos de 6 meses; dolor torácico opresivo al caminar varias cuadras y desvanecimiento al subir escaleras. Soplo sistólico áspero crescendo-decrescendo en 2.º EIC derecho irradiado a ambas carótidas. Pulsos carotídeos débiles y tardíos. Diagnóstico:`,
opts:[`Estenosis mitral`,`Insuficiencia aórtica`,`Insuficiencia pulmonar`,`Estenosis tricuspídea`,`Estenosis aórtica`],ans:4,exp:`Foco aórtico, romboidal, a carótidas, parvus et tardus y tríada (angina, síncope, disnea).`,ref:'Argente 36-4 · PDF 528'},
{id:'bio-02',src:'bio',mod:'cardio',tema:'Pulsos',fija:true,stem:`Varón de 58 años con dolor torácico y síncope de esfuerzo. Soplo mesosistólico intenso irradiado al cuello; pulso carotídeo de baja amplitud y ascenso lento. PA 100/70. ¿Qué pulso presenta?`,
opts:[`Magnus et celer`,`Alternante`,`Parvus et tardus`,`Bisferiens`,`Paradójico`],ans:2,exp:`Pequeño y lento: obstáculo fijo a la eyección (EA grave).`,ref:'Argente 35-2 · PDF 441'},
{id:'bio-03',src:'bio',mod:'cardio',tema:'Estenosis mitral',stem:`Mujer de 65 años con ortopnea y disnea paroxística nocturna; fiebre reumática en la adolescencia. Soplo diastólico de tonalidad grave en el ápex con chasquido de apertura, fibrilación auricular e hipertensión pulmonar leve. Diagnóstico:`,
opts:[`Insuficiencia mitral`,`Estenosis mitral`,`Insuficiencia aórtica`,`Estenosis aórtica`,`Insuficiencia tricuspídea`],ans:1,exp:`Rodada diastólica apical + chasquido de apertura + antecedente reumático + FA.`,ref:'Argente 36-4 · PDF 523'},
{id:'bio-04',src:'bio',mod:'cardio',tema:'Desdoblamientos',fija:true,stem:`Hombre de 60 años con bloqueo de rama izquierda; se ausculta desdoblamiento del segundo ruido únicamente durante la espiración. ¿Cómo se llama?`,
opts:[`Fijo`,`Amplio`,`Paradójico`,`Fisiológico`,`Pulmonar`],ans:2,exp:`El BRI retrasa A2, que queda después de P2: se desdobla en espiración y se fusiona en inspiración. También en EA grave (vino en el parcial 2025).`,ref:'Argente cuadro 35-5-3 · PDF 472'},
{id:'bio-05',src:'bio',mod:'cardio',tema:'Congénitas',fija:true,stem:`Recién nacido prematuro con dificultad respiratoria leve y soplo continuo en sístole y diástole, descrito como "soplo de maquinaria". Hiperactividad precordial y pulsos saltones. Diagnóstico:`,
opts:[`Estenosis pulmonar`,`Comunicación interventricular`,`Persistencia del conducto arterioso`,`Estenosis aórtica`,`Tetralogía de Fallot`],ans:2,exp:`Soplo continuo en maquinaria (Gibson) + pulsos saltones = PCA.`,ref:'Argente 35-5 · PDF 481'},
{id:'bio-06',src:'bio',mod:'cardio',tema:'Pericardio',fija:true,stem:`Hombre de 68 años con neoplasia pulmonar, hipotensión y disnea intensa. Ruidos cardíacos velados, ingurgitación yugular, PA 80/50, ansioso y diaforético. Diagnóstico:`,
opts:[`Disección aórtica`,`Insuficiencia mitral aguda`,`Taponamiento cardíaco`,`Endocarditis infecciosa`,`Hipertensión pulmonar severa`],ans:2,exp:`Tríada de Beck: hipotensión, ingurgitación yugular y ruidos apagados. Las neoplasias son causa frecuente de derrame con taponamiento.`,ref:'Argente 36-6 · PDF 547-548'},
{id:'bio-07',src:'bio',mod:'cardio',tema:'Soplos epónimos',fija:true,stem:`Niño de 8 años, asintomático, con soplo holosistólico muy intenso y áspero con frémito en el borde esternal izquierdo (3.º-4.º EIC). El eco muestra una CIV pequeña restrictiva. ¿Qué nombre recibe este soplo?`,
opts:[`Austin Flint`,`Roger`,`Carey Coombs`,`Graham Steell`,`Gallavardin`],ans:1,exp:`Soplo de Roger: CIV pequeña, mucho ruido y poca repercusión.`},
{id:'bio-08',src:'bio',mod:'cardio',tema:'Insuf. aórtica',fija:true,stem:`Hombre de 63 años con disnea progresiva, palpitaciones y latidos fuertes en el cuello. PA 160/50, signo de Musset, pulsos periféricos amplios, soplo diastólico aspirativo en foco de Erb. Diagnóstico:`,
opts:[`Estenosis mitral`,`Insuficiencia tricuspídea`,`Insuficiencia aórtica`,`Estenosis pulmonar`,`Comunicación interauricular`],ans:2,exp:`Presión diferencial amplia + Musset + diastólico aspirativo en Erb.`,ref:'Argente 36-4 · PDF 531'},
{id:'bio-09',src:'bio',mod:'cardio',tema:'Pulsos',fija:true,stem:`Paciente de 59 años con EPOC severo, hipotensión y disnea progresiva. Hay disminución exagerada de la presión sistólica durante la inspiración, ruidos hipofonéticos e ingurgitación yugular moderada. ¿Qué hallazgo es?`,
opts:[`Pulso alternante`,`Pulso paradójico`,`Pulso bisferiens`,`Pulso filiforme`,`Pulso dícroto`],ans:1,exp:`Caída inspiratoria de la PAS > 10 mmHg = pulso paradójico (taponamiento, EPOC/asma grave, pericarditis constrictiva).`,ref:'Argente 35-2 · PDF 442'},
{id:'bio-10',src:'bio',mod:'cardio',tema:'Tricúspide',fija:true,stem:`Mujer de 48 años con edema de miembros inferiores y distensión abdominal progresiva. Ingurgitación yugular prominente, hepatomegalia dolorosa y soplo holosistólico que aumenta con la inspiración profunda. Diagnóstico:`,
opts:[`Estenosis mitral`,`Insuficiencia tricuspídea`,`Estenosis aórtica`,`Insuficiencia pulmonar`,`Comunicación interventricular`],ans:1,exp:`Holosistólico + Rivero-Carvallo positivo + congestión sistémica = IT.`,ref:'Argente 36-4 · PDF 533-534'},
{id:'bio-11',src:'bio',mod:'cardio',tema:'Estenosis aórtica',fija:true,stem:`Varón de 52 años con síncope y dolor torácico de esfuerzo. Soplo sistólico eyectivo en foco aórtico que se irradia también al ápex; el cardiólogo lo llama fenómeno de Gallavardin. Diagnóstico:`,
opts:[`Insuficiencia mitral`,`Estenosis tricuspídea`,`Estenosis aórtica`,`Insuficiencia pulmonar`,`Comunicación interauricular`],ans:2,exp:`Gallavardin: el soplo de EA se propaga al ápex con timbre musical y puede simular IM.`,ref:'Argente 35-5 · PDF 477; 36-4 · PDF 528'},
{id:'bio-12',src:'bio',mod:'cardio',tema:'Maniobras',fija:true,stem:`¿Qué maniobra usarías para palpar el choque de punta?`,
opts:[`Rivero-Carvallo`,`Pachón`,`Harvey`,`Azoulay`,`Müller`],ans:1,exp:`Si no se palpa en decúbito dorsal, se pasa a decúbito lateral izquierdo (Pachón) sin retirar la mano.`,ref:'Argente 35-5 · PDF 461'},
{id:'bio-13',src:'bio',mod:'cardio',tema:'Maniobras',fija:true,stem:`Mujer de 50 años con disnea y ortopnea. Soplo holosistólico de alta frecuencia irradiado a la axila izquierda; el cardiólogo la coloca en decúbito lateral izquierdo para auscultar mejor. ¿Qué maniobra es?`,
opts:[`Rivero-Carvallo`,`Harvey`,`Pachón`,`Müller`,`Valsalva`],ans:2,exp:`Decúbito lateral izquierdo = Pachón, para el foco mitral.`},
{id:'bio-14',src:'bio',mod:'cardio',tema:'Ruidos',stem:`Mujer de 66 años con miocardiopatía dilatada, ortopnea y edema pulmonar; se ausculta un tercer ruido inmediatamente después del segundo. ¿Mecanismo más probable?`,
opts:[`Contracción auricular contra ventrículo rígido`,`Llenado rápido ventricular en ventrículo dilatado`,`Apertura precoz de la válvula pulmonar`,`Cierre tardío tricuspídeo`,`Regurgitación aórtica severa`],ans:1,exp:`S3 = llenado rápido protodiastólico que choca con un ventrículo dilatado y distensible. La a describe el S4.`,ref:'Argente 35-5 · PDF 469'},
{id:'bio-15',src:'bio',mod:'cardio',tema:'Tricúspide',fija:true,stem:`Paciente de 47 años con fiebre reumática, edema y plenitud abdominal. Pulso venoso yugular prominente y soplo diastólico tricuspídeo que aumenta con la inspiración profunda y con la maniobra de Müller. Diagnóstico:`,
opts:[`Insuficiencia aórtica`,`Estenosis tricuspídea`,`Estenosis aórtica`,`Insuficiencia mitral`,`Comunicación interventricular`],ans:1,exp:`Diastólico derecho (aumenta con inspiración y Müller) + onda a prominente = ET, casi siempre reumática y junto a EM.`,ref:'Argente 36-4 · PDF 534'},
{id:'bio-16',src:'bio',mod:'cardio',tema:'Técnica del pulso',fija:true,stem:`Encuentras a una persona inconsciente en la calle. ¿Cuál es el lugar ideal para tomar el pulso?`,
opts:[`Radial`,`Braquial`,`Carotídeo`,`Femoral`,`Poplíteo`],ans:2,exp:`El carotídeo es el pulso central de referencia en emergencias: persiste con presiones bajas. Se palpa de un lado a la vez.`},
{id:'bio-17',src:'bio',mod:'cardio',tema:'Estenosis aórtica',stem:`Hombre de 81 años, hipertenso y fumador de 50 años, con disnea de esfuerzo y mareos de 8 semanas. Pulsos periféricos débiles; soplo sistólico de eyección áspero, crescendo-decrescendo, en 2.º EIC derecho, irradiado a carótidas. Diagnóstico:`,
opts:[`Estenosis pulmonar`,`Regurgitación mitral`,`Estenosis aórtica`,`Estenosis mitral`,`Insuficiencia aórtica`],ans:2,exp:`Mismo patrón de EA en el anciano (calcificación degenerativa).`},
{id:'bio-18',src:'bio',mod:'cardio',tema:'Insuf. aórtica',stem:`Hombre de 62 años con menor tolerancia al ejercicio y disnea al acostarse. PA 155/53. Soplo agudo y decrescendo inmediatamente después de S2, mejor en el borde esternal izquierdo; galope por S3 y pulsos carotídeos fuertes. Diagnóstico:`,
opts:[`Estenosis mitral`,`Insuficiencia mitral`,`Insuficiencia tricuspídea`,`Insuficiencia aórtica`,`Estenosis aórtica`],ans:3,exp:`Protodiastólico decreciente en borde esternal izquierdo + presión diferencial amplia + S3.`},
{id:'bio-19',src:'bio',mod:'cardio',tema:'Insuf. aórtica',stem:`Hombre de 74 años con fatiga y disnea de esfuerzo de 6 meses. PA 145/60, crepitantes basales, soplo diastólico temprano 3/6 más intenso en el borde esternal izquierdo, 3.er EIC. ¿Qué mostraría probablemente una evaluación posterior?`,
opts:[`Pulso parvus et tardus`,`Pulso paradójico`,`Desdoblamiento fijo de S2`,`Pulso en golpe de ariete (martillo de agua)`,`Desdoblamiento paradójico de S2`],ans:3,exp:`IA crónica (soplo en Erb + presión diferencial amplia): pulso de Corrigan o martillo de agua.`},
{id:'bio-20',src:'bio',mod:'cardio',tema:'Maniobras',fija:true,stem:`¿Qué posición adopta el paciente para la maniobra de Harvey, cuyo objetivo es magnificar ruidos y soplos de las válvulas semilunares (aórtica y pulmonar)?`,
opts:[`Decúbito lateral izquierdo`,`Decúbito dorsal con elevación de miembros inferiores`,`Espiración forzada con glotis abierta`,`Sentado e inclinado el tórax hacia adelante`,`De pie, con los brazos extendidos`],ans:3,exp:`Harvey: sentado, inclinado hacia adelante (mejor en espiración). Acerca la base del corazón a la pared.`},
{id:'bio-21',src:'bio',mod:'cardio',tema:'Tricúspide',stem:`Paciente con estenosis tricuspídea. ¿Qué hallazgo espera encontrar?`,
opts:[`Soplo sistólico`,`Disminución del soplo con Rivero-Carvallo`,`Aumento de la onda a venosa`,`Soplo en diamante`,`Ninguna`],ans:2,exp:`La aurícula derecha se contrae contra una válvula estrecha: onda a gigante. El soplo es diastólico y aumenta con la inspiración.`,ref:'Argente 35-4 · PDF 455'},
{id:'bio-22',src:'bio',mod:'cardio',tema:'Estenosis mitral',stem:`Hombre de 55 años con cardiopatía reumática y disnea progresiva. Crepitaciones bibasales; chasquido de apertura seguido de soplo diastólico grave en 5.º EIC izquierdo, línea medioclavicular. Eco sin calcificaciones, coágulos ni insuficiencia AV. Diagnóstico:`,
opts:[`Estenosis mitral`,`Insuficiencia mitral`,`Insuficiencia tricuspídea`,`Insuficiencia aórtica`,`Estenosis aórtica`],ans:0,exp:`Chasquido de apertura + rodada apical = EM reumática no calcificada.`},
{id:'bio-23',src:'bio',mod:'cardio',tema:'Maniobras',stem:`Mujer de 44 años con disnea de esfuerzo y palpitaciones; pulso 124 irregular. Soplo holosistólico agudo 4/6 en el ápice, irradiado a la espalda, que aumenta al apretar los puños. ¿Qué maniobra permitirá mejor auscultación?`,
opts:[`Rivero-Carvallo`,`Pachón`,`Harvey`,`Azoulay`,`Müller`],ans:1,exp:`Es una IM (holosistólico apical que sube con el handgrip). El foco mitral se ausculta mejor en Pachón.`},
{id:'bio-24',src:'bio',mod:'cardio',tema:'Estenosis aórtica',stem:`Mujer de 79 años que se desmayó mientras caminaba rápido; recuperó la conciencia en un minuto. Angina leve al trabajar en el jardín. Soplo sistólico de eyección 3/6 que disminuye con el handgrip y no cambia con la inspiración. ¿Causa más probable?`,
opts:[`Degeneración quística medial de la raíz aórtica`,`Trombos plaquetarios estériles en la válvula mitral`,`Calcificación distrófica de la válvula aórtica`,`Nódulos granulomatosos en la válvula mitral`,`Fusión congénita de las valvas aórticas`],ans:2,exp:`EA en mayor de 70 años = calcificación degenerativa. La bicúspide congénita (e) se manifiesta antes.`,ref:'Argente 36-4 · PDF 527'},
{id:'bio-25',src:'bio',mod:'cardio',tema:'Técnica del pulso',fija:true,stem:`Prueba que ocluye las arterias radial y cubital y sirve para verificar la irrigación colateral de la mano:`,
opts:[`Tinel`,`Allen`,`Phalen`,`Osler`],ans:1,exp:`Test de Allen: se liberan por separado radial y cubital para ver si la palma se recolorea.`,ref:'Argente 35-1 · PDF 429'},
{id:'bio-26',src:'bio',mod:'cardio',tema:'Desdoblamientos',stem:`Marque la correcta sobre el desdoblamiento fisiológico de S2:`,
opts:[`Es mayor en inspiración por retraso del cierre mitral`,`Es mayor en inspiración por retraso del cierre aórtico`,`Es mayor en inspiración por retraso del cierre pulmonar`,`Es mayor en espiración por retraso del cierre pulmonar`,`Es mayor en espiración por retraso del cierre aórtico`],ans:2,exp:`La inspiración aumenta el retorno al VD, prolonga su eyección y retrasa P2.`},
{id:'bio-27',src:'bio',mod:'cardio',tema:'Focos',stem:`Para auscultar una insuficiencia tricuspídea, ¿dónde coloca el estetoscopio?`,
opts:[`2.º EIC derecho, paraesternal derecho`,`2.º EIC izquierdo, paraesternal izquierdo`,`3.er EIC izquierdo, paraesternal izquierdo`,`5.º EIC izquierdo, línea medioclavicular`,`4.º EIC izquierdo, paraesternal izquierdo`],ans:4,exp:`Foco tricuspídeo: 4.º EIC paraesternal izquierdo (parte inferior del esternón). El 3.º izquierdo es Erb.`},
{id:'bio-28',src:'bio',mod:'cardio',tema:'Estenosis aórtica',stem:`Mujer de 78 años, hipertensa, camina menos que hace un año. Pulsos carotídeos disminuidos y retrasados, componente aórtico de S2 disminuido, soplo sistólico crescendo-decrescendo 3/6 de pico tardío en el borde esternal superior derecho irradiado al cuello, S4. Diagnóstico:`,
opts:[`Estenosis pulmonar`,`Regurgitación mitral`,`Estenosis aórtica`,`Estenosis mitral`,`Insuficiencia aórtica`],ans:2,exp:`Además es una EA grave: pico tardío, A2 disminuido y S4.`,ref:'Argente 36-4 · PDF 529'},
{id:'bio-29',src:'bio',mod:'cardio',tema:'Estenosis aórtica',stem:`Mujer de 80 años con dilatación del ventrículo izquierdo y esclerosis valvular aórtica. ¿Qué hallazgo es IMPROBABLE?`,
opts:[`Frémito carotídeo`,`Soplo aórtico irradiado al cuello`,`Ingurgitación yugular`,`Valvulopatía semilunar`,`Soplo sistólico en foco aórtico`],ans:0,exp:`La esclerosis aórtica engruesa la válvula sin obstrucción importante: el soplo es suave y no llega a producir frémito (grado IV o más). La IY puede aparecer si el VI dilatado falla.`,conf:'media'},
{id:'bio-30',src:'bio',mod:'cardio',tema:'Insuf. aórtica',stem:`Varón de 45 años con disnea paroxística nocturna, claudicación, palpitaciones y angina. Palidez, signo de Musset, abovedamiento precordial, pupila que se contrae en cada sístole (Landolfi), pulso celer, soplo diastólico suave y aspirativo como una "R" susurrada desde el 2.º ruido en el borde izquierdo y Erb; en la punta un retumbo diastólico. Diagnóstico:`,
opts:[`Insuficiencia aórtica`,`Insuficiencia tricuspídea`,`Estenosis aórtica`,`Estenosis tricuspídea`,`Estenosis mitral`],ans:0,exp:`Signos periféricos + soplo aspirativo en Erb. El retumbo apical es el Austin Flint, no una EM.`},
{id:'bio-31',src:'bio',mod:'cardio',tema:'Tricúspide',stem:`Mujer de 52 años con molestia en el cuello, fatiga, piel fría y dolor en hipocondrio derecho. Facies de Shattuck, aleteo en el cuello, ascitis y edema. Soplo presistólico tricuspídeo y chasquido de apertura tricuspídeo, que aumentan con la inspiración y con Müller, sin refuerzo de P2. Diagnóstico:`,
opts:[`Insuficiencia pulmonar con soplo de Carey Coombs`,`Insuficiencia tricuspídea`,`Estenosis mitral`,`Estenosis tricuspídea`,`Estenosis pulmonar`],ans:3,exp:`Chasquido y soplo presistólico derechos (aumentan con inspiración y Müller) sin hipertensión pulmonar = ET.`},
{id:'bio-32',src:'bio',mod:'cardio',tema:'Maniobras',stem:`Mujer de 45 años con fibrilación auricular mal tratada y soplo sistólico en foco mitral. ¿En qué maniobra la colocaría para percibirlo mejor?`,
opts:[`Harvey`,`Rivero-Carvallo`,`Pachón`,`Valsalva`,`Olow`],ans:2,exp:`Foco mitral = Pachón. Olow es un signo de TVP.`},
{id:'bio-33',src:'bio',mod:'cardio',tema:'Pulsos',stem:`Mujer de 57 años con insuficiencia aórtica; pulso de amplitud grado 4, ascenso rápido hasta un pico estrecho y descenso súbito. ¿Qué pulso es?`,
opts:[`Paradójico`,`En martillo de agua`,`Bigeminado`,`Bisferiens`,`Alternante`],ans:1,exp:`Magnus et celer = Corrigan o martillo de agua (signo de Weber al elevar el brazo).`,ref:'Argente 35-2 · PDF 440-441'},
{id:'bio-34',src:'bio',mod:'cardio',tema:'Congénitas',stem:`Varón de 15 años con disnea al jugar fútbol; el cardiólogo encuentra un soplo sistodiastólico III/IV en el precordio. Diagnóstico probable:`,
opts:[`Insuficiencia mitral`,`Insuficiencia tricuspídea`,`Estenosis aórtica`,`Estenosis pulmonar`,`Ductus arterioso persistente`],ans:4,exp:`Un soplo que ocupa sístole y diástole (continuo) en un joven = PCA.`},
{id:'bio-35',src:'bio',mod:'cardio',tema:'Maniobras',fija:true,stem:`Paciente con disnea a moderados esfuerzos y soplo sistólico en 2.º EIC paraesternal derecho. Marque la correcta:`,
opts:[`Aumentará en decúbito lateral izquierdo`,`Se asociará a pulso alternante`,`Tendrá un pulso de onda ascendente y descendente brusca`,`Se irradiará a la axila`,`Aumentará con el paciente inclinado hacia adelante`],ans:4,exp:`Sistólico en foco aórtico = EA: válvula semilunar, aumenta con Harvey (sentado, inclinado). Se irradia al cuello y da parvus et tardus.`},
{id:'bio-36',src:'bio',mod:'cardio',tema:'Estenosis mitral',stem:`Mujer de 25 años con faringoamigdalitis sin tratar hace 10 años; disnea progresiva, ortopnea, DPN, tos hemoptoica y ronquera. Estenosis mitral severa. Al examen encontraría:`,
opts:[`S1 aumentado, S2 conservado o disminuido, S4, chasquido, soplo sistólico de regurgitación con thrill`,`S1 disminuido, S2 conservado o aumentado, S3, clic, soplo sistólico con thrill`,`S1 aumentado, S2 conservado o aumentado, chasquido de apertura, soplo diastólico en rolido con o sin refuerzo presistólico`,`S1 conservado, S2 disminuido, clic, soplo sistodiastólico en vaivén`,`S1 y S2 aumentados, chasquido, soplo de Austin Flint y desviación del choque`],ans:2,exp:`S1 fuerte, P2 aumentado por HTP, chasquido de apertura y rodada con refuerzo presistólico. La ronquera es el síndrome de Ortner (aurícula izquierda grande sobre el recurrente).`,ref:'Argente 36-4 · PDF 523'},
{id:'tm-01',src:'tm',mod:'cardio',tema:'Ciclo cardíaco',stem:`El primer ruido cardíaco se produce durante:`,
opts:[`La fase de llenado rápido`,`La contracción isovolumétrica`,`El cierre de las sigmoideas`,`La fase de expulsión rápida`],ans:1,exp:`S1 = cierre de las válvulas AV al comenzar la contracción isovolumétrica.`},
{id:'tm-02',src:'tm',mod:'cardio',tema:'Ciclo cardíaco',stem:`Al comenzar la sístole, la contracción ventricular eleva la presión y fuerza el cierre de las válvulas:`,
