opts:[`L2-L3`,`L3-L4`,`L5-S1`,`L1-L2`,`L4-L5`],ans:2,exp:`Raíz S1 (hernia L5-S1): borde externo del pie y dedos laterales, debilidad de flexión plantar (marcha en puntas) y reflejo aquíleo abolido. L5 daría dorso del pie, marcha en talones y reflejos conservados.`},
{id:'p22-19',src:'p22',num:'P19',mod:'om',tema:'Sacroilíaca',stem:`Varón de 25 años con espondilitis anquilosante y dolor sacroilíaco alternante nocturno. Se lleva el muslo a abducción y rotación externa con el tobillo sobre la rodilla opuesta, se fija la espina ilíaca anterosuperior contralateral y se presiona la rodilla hacia abajo. ¿Qué maniobra es?`,
opts:[`FABERE (Patrick)`,`Gaenslen`,`Volkmann`,`De cierre`,`Erichsen`],ans:0,exp:`FABERE = Flexión, ABducción, Rotación Externa (Patrick). Dolor posterior sugiere sacroilíaca; dolor inguinal, cadera.`},
{id:'p22-20',src:'p22',num:'P20',mod:'cardio',tema:'Ciclo cardíaco',stem:`Durante la contracción isovolumétrica, señale el enunciado FALSO:`,
opts:[`Las válvulas auriculoventriculares están cerradas`,`Las válvulas semilunares están cerradas`,`La presión ventricular aumenta`,`Se mantiene el volumen intraventricular`,`Se inicia la eyección`],ans:4,exp:`En la contracción isovolumétrica las cuatro válvulas están cerradas: sube la presión sin cambiar el volumen. La eyección empieza cuando se abren las semilunares, en la fase siguiente.`},
{id:'p22-21',src:'p22',num:'P21',mod:'cardio',tema:'Levine',fija:true,stem:`Sobre la escala de Levine de intensidad de soplos, es FALSO:`,
opts:[`Grado I: apenas perceptible, sin frémito`,`Grado III: intensidad moderada, sin frémito`,`Grado IV: intensidad intermedia, sin frémito palpable`,`Grado VI: muy intenso, con frémito, audible sin apoyar el estetoscopio`,`Grado II: suave, audible, sin frémito`],ans:2,exp:`El grado IV es el primero con frémito. Sin frémito llegan hasta el III.`,ref:'Argente 35-5 · PDF 476'},
{id:'p22-22',src:'p22',num:'P22',mod:'resp',tema:'Fisiología',stem:`Sobre las capacidades pulmonares, es cierto:`,
opts:[`Capacidad inspiratoria = VRI + volumen corriente + VRE`,`Capacidad residual funcional = capacidad vital + volumen residual`,`Capacidad vital = VRI + volumen corriente + VRE`,`Capacidad pulmonar total = VRE + volumen residual`],ans:2,exp:`CV = VRI + VC + VRE. CI = VC + VRI. CRF = VRE + VR. CPT = CV + VR.`},
{id:'p22-23',src:'p22',num:'P23',mod:'resp',tema:'Condensación',stem:`Varón de 82 años hospitalizado por ACV isquémico con trastorno de conciencia; al 5.º día fiebre, tos con expectoración verde amarillenta, taquipnea e insuficiencia respiratoria. Rx: consolidación basal derecha. ¿Qué esperaría encontrar?`,
opts:[`Frémito aumentado, amplexación disminuida y matidez en la base derecha`,`Frémito disminuido, amplexación disminuida y matidez en la base derecha`,`Frémito disminuido, amplexación disminuida e hiperresonancia en la base derecha`,`Frémito aumentado, amplexación disminuida e hiperresonancia en la base derecha`],ans:0,exp:`Condensación: el parénquima sólido transmite mejor las vibraciones (frémito aumentado), es mate y se expande menos.`,ref:'Argente 42-2 · PDF 703-714'},
{id:'p22-24',src:'p22',num:'P24',mod:'cardio',tema:'Insuf. aórtica',fija:true,stem:`Mujer de 42 años con IC congestiva: pulso de Corrigan, soplo mesodiastólico de Austin Flint, doble soplo intermitente sobre la femoral, cabeceo en reposo, pulsaciones en el lecho ungueal, pulsación sistólica de la úvula y oscilación de la pierna cruzada. ¿Qué valvulopatía?`,
opts:[`Estenosis aórtica`,`Estenosis tricuspídea`,`Insuficiencia aórtica`,`Insuficiencia mitral`,`Insuficiencia tricuspídea`],ans:2,exp:`Son los signos periféricos de IA: Corrigan, Austin Flint, Duroziez, De Musset, Quincke, Müller y Lincoln.`,ref:'Argente 36-4 · PDF 531'},
{id:'p22-25',src:'p22',num:'P25',mod:'neuro',tema:'VIII par',stem:`Varón de 56 años con traumatismo nasal antiguo, hipoacusia y otalgia derecha de 6 meses. Diapasón de 512 Hz: Weber lateraliza a la derecha, Rinne negativo derecho y positivo izquierdo. ¿Tipo y lado?`,
opts:[`Neurosensorial derecha`,`Neurosensorial izquierda`,`De transmisión (conducción) derecha`,`De transmisión (conducción) izquierda`],ans:2,exp:`Weber al lado enfermo + Rinne negativo en ese lado = hipoacusia de conducción derecha. En la neurosensorial el Weber va al lado sano y el Rinne sigue positivo.`},
{id:'p22-26',src:'p22',num:'P26',mod:'neuro',tema:'Pares craneales',stem:`Mujer de 36 años con diplopía de 2 semanas. Pupilas normales, sin ptosis; el ojo derecho no abduce y aparece diplopía al intentarlo. Hipoestesia en la zona frontal derecha. ¿Qué nervios están lesionados?`,
opts:[`III derecho y V1 derecho`,`III derecho y VII derecho`,`IV izquierdo y VII derecho`,`VI derecho y V1 derecho`],ans:3,exp:`No abducir = VI (recto externo). Hipoestesia frontal = rama oftálmica V1. Juntos sugieren seno cavernoso o hendidura esfenoidal.`},
{id:'p22-27',src:'p22',num:'P27',mod:'neuro',tema:'XI par',stem:`Varón de 34 años operado de un ganglio supraclavicular izquierdo en la zona posterior del cuello; ahora no puede flexionar ni abducir el hombro izquierdo más de 90°. ¿Qué nervio craneal se comprometió?`,
opts:[`Facial`,`Glosofaríngeo`,`Accesorio`,`Vago`],ans:2,exp:`El XI (espinal accesorio) cruza el triángulo posterior del cuello e inerva trapecio y ECM; sin trapecio no se eleva el brazo sobre 90°.`},
{id:'p22-28',src:'p22',num:'P28',mod:'hc',tema:'Presión arterial',stem:`Para la medida de la presión arterial, ¿qué factor NO es necesario tener en cuenta para evitar un resultado inadecuado?`,
opts:[`Consumo de alcohol`,`Primer trimestre de gestación`,`Linfedema en la extremidad`,`Consumo de cafeína`,`Hemiplejia de la extremidad`],ans:1,exp:`Cafeína, alcohol y tabaco previos alteran la lectura, y no se mide en un brazo con linfedema o parético. El primer trimestre del embarazo no cambia la técnica.`,ref:'Argente 35-3 · PDF 447-449'},
{id:'p22-29',src:'p22',num:'P29',mod:'neuro',tema:'Meníngeos',stem:`Mujer de 42 años con fiebre, cefalea y somnolencia. Al pedirle que toque su pecho con el mentón, intenta hacerlo abriendo la boca sin lograrlo. ¿Qué signo es?`,
opts:[`Brudzinski`,`Kernig I`,`Kernig II`,`Lewinson`,`Lhermitte`],ans:3,exp:`Signo de Lewinson: por la rigidez de nuca no puede tocar el pecho con el mentón si no abre la boca. Está así en el Argente.`,ref:'Argente 72-2 · PDF 1537'},
{id:'p22-30',src:'p22',num:'P30',mod:'piel',tema:'Signos',stem:`Varón con psoriasis y placas blanquecinas en el codo; al raspar una escama con una cucharilla aparece un rocío hemorrágico. Es el signo de:`,
opts:[`Nikolsky`,`Auspitz`,`Koebner`,`Woronoff`,`Rimsky`],ans:1,exp:`Auspitz = rocío sangrante al raspar la psoriasis. Nikolsky = desprendimiento epidérmico al frotar (pénfigo). Koebner = lesiones sobre zonas traumatizadas.`},
{id:'p22-31',src:'p22',num:'P31',mod:'abd',tema:'Riñón',stem:`Varón de 56 años con masa abdominal. Se le pide decúbito ventral y se lo explora con una maniobra semejante a la renal pero como un peloteo inverso. La maniobra se llama ___ y sirve para evaluar ___:`,
opts:[`Guyon - tumor renal`,`Glenard invertida - tumor renal`,`Montenegro - tumor extrarrenal`,`Israel - riñón normal`,`No existe dicha maniobra`],ans:2,exp:`Montenegro es el peloteo invertido en decúbito ventral: la masa renal (retroperitoneal) mantiene contacto lumbar y la extrarrenal cae hacia adelante; sirve para diferenciarlas.`,conf:'media'},
{id:'p22-32',src:'p22',num:'P32',mod:'cardio',tema:'TVP',stem:`Varón de 65 años con artrosis de cadera, poca deambulación y várices. Dolor lancinante 8/10 y aumento de volumen del MID hasta el muslo de 1 semana, sin fiebre. Edema ++/++++ hasta el muslo, doloroso, Homans (+), Olow (+). Diagnóstico:`,
opts:[`Trombosis venosa profunda`,`Tromboflebitis`,`Celulitis del MID`,`Insuficiencia vascular periférica`],ans:0,exp:`Edema unilateral doloroso con inmovilidad y signos de Homans y Olow: TVP.`,ref:'Argente 35-1 · PDF 426-427'},
{id:'p22-33',src:'p22',num:'P33',mod:'cardio',tema:'Insuf. mitral',stem:`Varón de 65 años con HTA mal tratada, mareos, fatiga y edema. Choque de punta en 5.º EIC-LMC con thrill; soplo sistólico V/VI en foco mitral irradiado a la axila. Diagnóstico:`,
opts:[`Estenosis mitral severa`,`Insuficiencia mitral`,`Insuficiencia aórtica severa`,`Estenosis aórtica severa`],ans:1,exp:`Sistólico en foco mitral que se irradia a la axila = IM. La EM es diastólica; la EA se irradia al cuello.`,ref:'Argente 36-4 · PDF 526'},
{id:'p22-34',src:'p22',num:'P34',mod:'abd',tema:'Puntos renoureterales',stem:`El punto localizado en la intersección del plano umbilical con el borde externo del recto anterior del abdomen se denomina:`,
opts:[`Ureteral inferior`,`Ureteral superior`,`Ureteral medio`,`Ureteral bisilíaco`,`Ureteral anterior`],ans:1,exp:`Superior: línea umbilical con borde externo del recto. Medio: línea bisilíaca (biespinosa) con borde externo del recto. Inferior: se explora por tacto rectal o vaginal.`},
{id:'p22-35',src:'p22',num:'P35',mod:'cardio',tema:'Pulso venoso',fija:true,stem:`¿Qué alternativa NO corresponde respecto al pulso venoso yugular?`,
opts:[`Ondas v gigantes en fibrilación auricular`,`Ondas y profundas en pericarditis constrictiva`,`En estenosis tricuspídea, ondas a gigantes y ondas v menos notables`,`En insuficiencia tricuspídea intensa, ondas c-v notables y descenso y rápido`,`Onda a pequeña en estenosis aórtica`],ans:4,
exp:`La onda a depende de la aurícula derecha: es pequeña o ausente en la FA, no en la EA. En la FA desaparece la a y, si hay IT asociada, la v se hace gigante.`,ref:'Argente 35-4 · PDF 455-458',conf:'media'},
{id:'p22-36',src:'p22',num:'P36',mod:'cardio',tema:'Conducción',stem:`El triángulo de Koch está en la porción inferior del tabique interauricular, limitado por la valva septal de la tricúspide. ¿Qué estructura del sistema de conducción contiene?`,
opts:[`Nódulo sinoauricular (Keith-Flack)`,`Haz de His`,`Rama derecha del haz de His`,`Nódulo de Aschoff-Tawara`,`Haz de Bachmann`],ans:3,exp:`El nódulo auriculoventricular de Aschoff-Tawara está en el vértice del triángulo de Koch.`},
{id:'p22-37',src:'p22',num:'P37',mod:'cardio',tema:'HTA',stem:`Varón de 45 años con HTA mal controlada en crisis: cefalea intensa y amaurosis, PA 220/110, FC 120. Rx: aumento de la silueta cardíaca. En el examen cardiovascular encontrará:`,
opts:[`R1 y R2 aumentados, soplo sistólico aórtico, choque por dentro de la LMC en 5.º EIC`,`R1 disminuido, R2 aumentado, soplo diastólico mitral, choque entre 5.º EIC y línea axilar anterior`,`R1 y R2 aumentados, soplo sistólico aórtico, choque en 5.º EIC y línea axilar media`,`R1 y R2 disminuidos, soplo diastólico aórtico, choque en 5.º EIC y línea axilar media`,`R1 aumentado, R2 disminuido, soplo sistodiastólico`],ans:2,
exp:`En la HTA moderada a grave S1 y S2 (A2) están aumentados, y la HVI con cardiomegalia desplaza el choque hacia afuera y abajo. Puede haber soplo eyectivo aórtico por dilatación de la raíz.`,ref:'Argente 35-5 · PDF 461-462, 472',conf:'media'},
{id:'p22-38',src:'p22',num:'P38',mod:'cardio',tema:'Insuf. aórtica',stem:`El aumento de la presión de pulso (diferencial) es característico de:`,
opts:[`Estenosis aórtica`,`Insuficiencia mitral`,`Estenosis pulmonar`,`Insuficiencia aórtica`,`Estenosis mitral`],ans:3,exp:`En la IA sube la sistólica (más volumen eyectado) y cae la diastólica (reflujo al VI).`,ref:'Argente 36-4 · PDF 531'},
{id:'p22-39',src:'p22',num:'P39',mod:'neuro',tema:'VII par',stem:`Mujer de 45 años, hipertensa y diabética, con asimetría facial súbita y desviación de los labios a la derecha. ¿Qué permitiría afirmar que la parálisis es central?`,
opts:[`Rostro inmóvil, lagrimeo y fumador de pipa`,`Mejilla abombada, lagrimeo y fumador de pipa`,`No puede fruncir el ceño, signo de Bell y fumador de pipa`,`Desviación de la comisura, lagrimeo y fumador de pipa`,`Frunce el ceño, cierre palpebral casi normal y fumador de pipa`],ans:4,exp:`La parálisis facial central respeta la mitad superior de la cara (inervación cortical bilateral): puede fruncir el ceño y cerrar el ojo. El signo de Bell y la frente paralizada indican lesión periférica.`},
{id:'p22-40',src:'p22',num:'P40',mod:'resp',tema:'Palpación',stem:`Para la expansión de los vértices, con el paciente sentado y el tórax desnudo, el examinador coge los hombros con las manos a caballo sobre el trapecio y le pide respirar tranquilo; la expansión es menor en el lado enfermo. ¿Qué maniobra es?`,
opts:[`Loewenberg`,`Hoover`,`Troisier`,`Ruault`,`Virchow`],ans:3,exp:`Maniobra de Ruault: expansión de vértices desde atrás, con los pulgares paravertebrales y las manos sobre el trapecio. Hoover es la paradoja costal del tórax hiperinsuflado.`},
{id:'p22-41',src:'p22',num:'P41',mod:'cardio',tema:'Pulsos',fija:true,stem:`Paciente con palpitaciones de larga data, disnea y tos nocturna, leve cianosis distal. Choque de punta desplazado abajo y afuera, área cardíaca agrandada, soplo holosistólico intenso "en chorro de vapor" que enmascara S1 y S2. Eco: IM con reflujo grave. ¿Qué pulso esperaría?`,
opts:[`Bigeminado`,`Parvus y celer`,`Magnus y celer`,`Parvus y tardus`,`Magnus y tardus`],ans:1,exp:`La IM con reflujo significativo es la única cardiopatía con pulso parvus et celer: eyección breve hacia dos salidas.`,ref:'Argente 35-2 · PDF 441'},

{id:'p22-43',src:'p22',num:'P43',mod:'resp',tema:'Líneas del tórax',stem:`Reparo (línea) que corresponde al límite del fondo de saco costodiafragmático, máximo nivel alcanzado por el pulmón en inspiración forzada; se obtiene uniendo con una horizontal el punto en que la XII costilla corta la masa lumbar y se busca inclinando al sujeto hacia adelante:`,
opts:[`Basilar de Piorry`,`Basal de Mouriquand`,`Diafragmática de Chauvet`,`Infraescapular de Pitres`,`Escapulovertebral de Tietze`],ans:1,exp:`Es la línea basal de Mouriquand. Chauvet es una zona (de alarma de la tuberculosis apical), no una línea. El Argente no trae estas líneas; viene del banco histórico de TeamMedic.`,conf:'media'},
{id:'p22-44',src:'p22',num:'P44',mod:'cardio',tema:'Estenosis aórtica',stem:`Varón de 30 años con síncope; pulso de amplitud disminuida con ascenso lento y soplo sistólico intenso no asociado a frémito. Marque la correcta:`,
opts:[`El soplo es grado V`,`Se trata de una insuficiencia aórtica`,`La maniobra de Pachón será positiva`,`Se puede presentar además un pulso parvus`,`El soplo aumentará si, sentado, lo inclinamos hacia adelante`],ans:4,
exp:`Es una EA (parvus et tardus, síncope). Intenso sin frémito = grado III. Los soplos de válvulas semilunares aumentan con la maniobra de Harvey (sentado e inclinado hacia adelante). La d es redundante: el pulso ya es parvus.`,ref:'Bancos Bioeasy/TeamMedic',conf:'media'},
{id:'p22-45',src:'p22',num:'P45',mod:'cardio',tema:'Pulsos',stem:`Varón de 65 años con desdoblamiento de S2, PVC de 22 cmH₂O y un pulso en que a una onda de amplitud normal le sigue otra disminuida. Marque la correcta:`,
opts:[`Tendrá reflujo hepatoyugular negativo`,`Probablemente tendrá tercer y cuarto ruido`,`En pulmones predominarán sibilancias`,`Tendrá crépitos en la base de un solo hemitórax`,`El desdoblamiento probablemente sea fisiológico`],ans:1,exp:`Pulso alternante = falla del VI; PVC alta = falla derecha. En insuficiencia cardíaca global son esperables S3 (y S4), reflujo hepatoyugular positivo y crépitos bibasales.`,ref:'Argente 35-2 · PDF 443'},
{id:'p22-46',src:'p22',num:'P46',mod:'resp',tema:'Mamas',stem:`En un autoexamen de mama una paciente encuentra una lesión sospechosa de malignidad. ¿Qué descripción corresponde mejor?`,
opts:[`Nódulo no doloroso, bordes regulares, móvil, blando`,`Nódulo doloroso, fijo, blando, bordes regulares`,`Nódulo no doloroso, fijo, de bordes irregulares`,`Nódulo no doloroso que cambia con el ciclo, blando`,`Nódulo no doloroso, duro, bordes regulares, móvil`],ans:2,exp:`Sugieren malignidad: indoloro, duro, fijo a planos, bordes irregulares, retracción de piel o pezón, piel de naranja. Los que cambian con el ciclo son fibroquísticos.`,ref:'Argente cap. 75 · PDF 1663, 1667-1669'},
{id:'p22-47',src:'p22',num:'P47',mod:'cardio',tema:'Maniobras',fija:true,stem:`Paciente con hiperventilación, respiración con boca abierta y tirajes intercostales. Soplo sistólico grado V positivo a la maniobra de Azoulay y negativo a Rivero-Carvallo y Harvey. Marque la correcta:`,
opts:[`En pulmones habrá crepitantes unilaterales`,`El soplo se irradiará al cuello`,`Habrá pulso amplio de ascenso y descenso súbitos`,`El soplo también será negativo a la maniobra de Pachón`,`Puede asociarse hemoptisis`],ans:4,
exp:`Azoulay (+) = izquierdo; Rivero-Carvallo (−) = no derecho; Harvey (−) = no es de la base. Sistólico izquierdo no basal = IM, que sí sería positiva a Pachón (d falsa). Con congestión pulmonar grave (edema) puede haber esputo hemoptoico. No se irradia al cuello (eso es EA) ni da Corrigan (IA).`,conf:'media'},
{id:'p22-48',src:'p22',num:'P48',mod:'abd',tema:'Abdomen',stem:`Con respecto a la exploración abdominal, marque la correcta:`,
opts:[`El espacio de Traube está limitado a la derecha por el páncreas`,`El Blumberg es positivo con dolor a la descompresión en fosa ilíaca izquierda`,`En la maniobra de Chauffard (peloteo) se usan ambas manos para explorar el riñón`,`El punto renoureteral inferior está en la unión de la línea bisilíaca con el borde externo de los rectos`,`El signo de Guéneau de Mussy indica peritonitis si despierta dolor al descomprimir cualquier zona del abdomen`],ans:4,exp:`Guéneau de Mussy = dolor a la descompresión en todo el abdomen = peritonitis generalizada. Traube limita a la derecha con el hígado; Chauffard es una maniobra bimanual para el hígado; la d describe el punto ureteral medio.`,ref:'Argente cap. 47 · PDF 840, 843-844'},
{id:'p22-49',src:'p22',num:'P49',mod:'piel',tema:'Lesiones',stem:`Sobre las lesiones primarias de la piel, marque la FALSA:`,
opts:[`Pápula: lesión sobreelevada menor de 1 cm`,`Mancha: lesión no sobreelevada mayor de 1 cm`,`Erosión: pérdida de continuidad que afecta solo la epidermis`,`La flictena es una cavidad de contenido líquido menor de 5 mm`,`Habón: pápula edematosa, pruriginosa, que no deja secuela`],ans:3,exp:`Menor de 5 mm es la vesícula; la ampolla (flictena) mide más de 5 mm.`,ref:'Argente cap. 22 · PDF 244-260'},
{id:'p22-50',src:'p22',num:'P50',mod:'resp',tema:'Tiroides',stem:`Paciente con patología tiroidea sin tratamiento que llega descompensada, con sensación de ahogo y taquicardia; latido arrítmico; el ECG muestra fibrilación auricular. Es verdad:`,
opts:[`Habrá que evaluar la tiroides con la maniobra bimanual de Crile, la más exacta`,`El pulso alternante de la FA es común en la enfermedad tiroidea`,`Se encontrará pulso deficitario y posible agrandamiento tiroideo en la exploración posterior (Quervain)`,`La frecuencia del pulso radial será siempre mayor que la cardíaca`,`Si hubiera bocio intratorácico, la plétora facial al elevar los hombros definiría un Pemberton positivo`],ans:2,exp:`En la FA hay déficit de pulso (la radial es menor que la cardíaca) y el hipertiroidismo con bocio se palpa por detrás con la técnica de Quervain. Crile busca nódulos con el pulgar; el Pemberton se hace elevando los brazos, no los hombros.`,ref:'Argente 35-2 · PDF 435; Lista de cotejo A'}
);

S.qs.push(
{id:'tm-d01',src:'tm',mod:'piel',tema:'Uñas',stem:`Al evaluar las uñas, se encuentra una alteración de la matriz que produce separación proximal de la lámina ungueal; puede ser adquirida (liquen plano erosivo, paroniquia crónica, enfermedades sistémicas, fármacos, traumatismos) o genética. Se conoce como:`,
opts:[`Onicomadesis`,`Coiloniquia`,`Onicosquisis`,`Onicólisis`,`Braquioniquia`],ans:0,exp:`Onicomadesis = separación proximal. La onicólisis es distal.`,ref:'Argente cap. 23 · PDF 264'},
{id:'tm-d02',src:'tm',mod:'piel',tema:'Uñas',stem:`Se encuentran bandas blancas que cubren la uña excepto una estrecha franja en el extremo distal; se especula que forman parte del envejecimiento. El hallazgo se conoce como:`,
opts:[`Líneas de Beau`,`Coiloniquia`,`Uñas de Lindsay`,`Uñas de Terry`],ans:3,exp:`Terry: blanca en el 80% proximal con banda distal rosada. Envejecimiento, cirrosis, ICC, DM.`},
{id:'tm-d03',src:'tm',mod:'piel',tema:'Uñas',fija:true,stem:`Varón de 82 años con fibrosis pulmonar, taquipneico (FR 30), SatO2 80% y uso de músculos accesorios. Además tiene uñas con aumento de su convexidad, del diámetro longitudinal y transversal y ángulo de 180°. Corresponde a:`,
opts:[`Líneas de Beau`,`Uñas hipocráticas`,`Uñas en cuchara`,`Uñas en dedal`],ans:1,exp:`Uñas hipocráticas (vidrio de reloj): ángulo de Lovibond ≥ 180°, por hipoxia crónica.`,ref:'Argente cap. 23 · PDF 263'},
{id:'tm-d04',src:'tm',mod:'piel',tema:'Uñas',fija:true,stem:`Mujer de 45 años con cansancio, mareos y palidez desde hace 2 meses; el hemograma muestra anemia moderada por déficit de hierro. Sus uñas son cóncavas, con el eje mayor transversal. El hallazgo se denomina:`,
opts:[`Onicorrexis`,`Coiloniquia`,`Uña en dedal`,`Uñas hipocráticas`],ans:1,exp:`Coiloniquia (uña en cuchara) = ferropenia. Igual que en el parcial 2022.`},
{id:'tm-d05',src:'tm',mod:'piel',tema:'Lesiones elementales',stem:`Con respecto a las lesiones primarias de la piel, marque la FALSA:`,
opts:[`Pápula es una lesión sobreelevada, menor de 1 cm`,`Mancha es una lesión no sobreelevada, mayor a 1 cm`,`Erosión es una solución de continuidad que afecta solo la epidermis`,`La flictena es una cavidad de contenido líquido menor a 5 mm`,`Habón es una pápula edematosa, pruriginosa, que no deja secuela`],ans:3,exp:`La flictena (ampolla) mide más de 5 mm; la de menos de 5 mm es la vesícula.`},
{id:'tm-d06',src:'tm',mod:'piel',tema:'Pelo',stem:`Varón de 28 años con caída difusa del cabello desde hace 4 meses, con episodios de estrés intenso y cambios alimentarios. Hay áreas de alopecia no cicatricial, sin inflamación ni descamación. La tricoscopía muestra menos folículos en fase anágena y más pelos en telógeno. ¿Su estado funcional más probable?`,
opts:[`Alteración en fase telógena`,`Alteración en fase catágena`,`Alteración en fase anágena`,`No hay alteración`],ans:0,exp:`Efluvio telógeno: paso prematuro de anágena a telógena unos 3 meses después del estrés. El anágeno es el de la quimioterapia.`,ref:'Argente cap. 23 · PDF 268',conf:'media'},
{id:'tm-d07',src:'tm',mod:'piel',tema:'Uñas',stem:`Marque la alternativa INCORRECTA:`,
opts:[`La pápula es una lesión elevada menor a 0.5 cm`,`La coiloniquia es una uña con mayor convexidad, generalmente por deficiencia de zinc`,`La escara es una formación de tejido necrosado delimitado por piel sana`,`Las uñas hipocráticas se encuentran en pacientes con hipoxia crónica`,`Los surcos transversales de Beau se deben a la deficiencia de zinc`],ans:1,exp:`La coiloniquia es cóncava y se debe a ferropenia. Las líneas de Beau sí pueden deberse a déficit de zinc (además de fiebre y enfermedad grave).`},
{id:'tm-d08',src:'tm',mod:'piel',tema:'Lesiones elementales',fija:true,stem:`Varón de 38 años, obeso, con dermatitis crónica que le causa prurito, irritación y rascado persistente en las superficies flexoras. La epidermis está rugosa y engrosada. Corresponde a la lesión secundaria:`,
opts:[`Costra`,`Excoriación`,`Escamosa`,`Liquenificación`],ans:3,exp:`Liquenificación: engrosamiento con cuadriculado acentuado por rascado crónico.`,ref:'Argente cap. 22 · PDF 251'},
{id:'tm-d09',src:'tm',mod:'piel',tema:'Exploración',stem:`Respecto a la exploración de piel y anexos, es FALSO:`,
opts:[`Las vesículas son lesiones elevadas, circunscritas, menores a 5 mm`,`Las uñas en palillo de tambor tienen una superficie dorsal convexa con un ángulo de al menos 180°`,`Para evaluar la temperatura de la piel se usan los pulpejos de los dedos`,`El signo de Nikolsky es el desprendimiento de la piel al friccionarla, característico de las infecciones estafilocócicas`],ans:2,exp:`La temperatura se evalúa con el dorso de los dedos o de la mano. Nikolsky aparece en la piel escaldada estafilocócica (y en el pénfigo).`},
{id:'tm-d10',src:'tm',mod:'piel',tema:'Ampollas',stem:`Varón de 35 años con ampollas flácidas dolorosas y piel normal en el resto, además de úlceras en las mucosas. La biopsia muestra una ampolla intraepidérmica acantolítica. ¿Hipótesis?`,
opts:[`Epidermólisis ampollosa`,`Penfigoide`,`Pénfigo vulgar`,`Dermatitis herpetiforme`],ans:2,exp:`Pénfigo vulgar: ampolla intraepidérmica, flácida, Nikolsky +, con mucosas. El penfigoide es subepidérmico y tenso.`},
{id:'tm-d11',src:'tm',mod:'piel',tema:'Signos',fija:true,stem:`Varón con psoriasis y una placa blanquecina en el codo derecho. Al retirar una escama con una cucharilla aparece un rocío hemorrágico. El signo es:`,
opts:[`Nikolsky`,`Auspitz`,`Koebner`,`Woronoff`],ans:1,exp:`Auspitz = rocío hemorrágico. Koebner = lesiones en zonas de trauma; Woronoff = halo claro en la fase de curación.`},
{id:'tm-d12',src:'tm',mod:'piel',tema:'Tumores',stem:`Varón de 68 años con una pápula de 0,5 cm en la ceja derecha desde hace 6 meses, rosa perlada, de bordes redondeados, con telangiectasias en la superficie y crecimiento lento. ¿Hipótesis?`,
opts:[`Carcinoma espinocelular`,`Queratocarcinoma`,`Carcinoma basocelular`,`Queratosis actínica`],ans:2,exp:`Pápula perlada con telangiectasias en la cara = basocelular.`},
{id:'tm-d13',src:'tm',mod:'piel',tema:'Lesiones elementales',stem:`Mujer de 85 años con DM2 e HTA con una lesión elevada, dura y circunscrita en la cara dorsal del brazo derecho, de 2 cm, que se ubica en la dermis. Corresponde a:`,
opts:[`Pápula`,`Nódulo`,`Habón`,`Tumor`],ans:1,exp:`Nódulo: sólido, firme, más profundo que la pápula, de 1 a 2 cm.`},
{id:'tm-d14',src:'tm',mod:'piel',tema:'Lesiones elementales',stem:`Mujer de 30 años con lesiones en toda la superficie corporal desde hace 1 hora, de distintos diámetros, irregulares, elevadas, edematosas, que desaparecen al presionarlas, tras tomar ketorolaco. La lesión es:`,
opts:[`Pápula`,`Eritema`,`Habón`,`Vesícula`],ans:2,exp:`Habón: edematoso, evanescente, típico de la urticaria (aquí por AINE).`},
{id:'tm-d15',src:'tm',mod:'piel',tema:'Púrpura',stem:`Joven de 22 años que recibe una contusión en la pierna derecha jugando fútbol. Tiene una lesión plana rojo-purpúrea, que no se decolora a la presión, de tamaño variable. La lesión se llama:`,
opts:[`Equimosis`,`Úlcera`,`Hematoma`,`Púrpura`],ans:0,exp:`Equimosis: mancha purpúrica por trauma, plana y no decolorable. El hematoma es una colección elevada.`,conf:'media'},
{id:'tm-d16',src:'tm',mod:'piel',tema:'Olores',stem:`Diabético con una úlcera de 3 x 3 cm en el tercio distal posterior de la pierna, tras una quemadura con agua caliente, con secreción purulenta y olor parecido a uvas. ¿Germen causante?`,
opts:[`Tuberculosis`,`Clostridium`,`Pseudomonas aeruginosa`,`Proteus`],ans:2,exp:`Olor a uvas = Pseudomonas (quemaduras). Clostridium huele a manzanas podridas y Proteus a humedad.`},
{id:'tm-d17',src:'tm',mod:'piel',tema:'Signos',stem:`Paciente de 24 años con múltiples máculas hipocrómicas en el tronco superior y descamación fina que se hace más evidente al raspar suavemente (signo de la uñada). ¿Diagnóstico más probable?`,
opts:[`Vitíligo`,`Pitiriasis alba`,`Pitiriasis versicolor`,`Psoriasis guttata`],ans:2,exp:`Signo de la uñada (Besnier) = pitiriasis versicolor.`},
{id:'tm-d18',src:'tm',mod:'piel',tema:'Uñas',fija:true,stem:`Paciente con insuficiencia renal crónica en hemodiálisis. Sus uñas tienen la mitad proximal blanca y la mitad distal pardo-rojiza. Se denominan:`,
opts:[`Uñas de Terry`,`Uñas de Lindsay`,`Uñas de Muehrcke`,`Líneas de Mees`],ans:1,exp:`Lindsay (mitad y mitad) = IRC.`},
{id:'tm-d19',src:'tm',mod:'piel',tema:'Uñas',stem:`Varón de 70 años con fatiga crónica y palidez conjuntival. ¿Qué secuencia representa los hallazgos ungueales de la deficiencia de hierro, de lo temprano a lo más avanzado?`,
opts:[`Onicólisis distal → hiperqueratosis subungueal → coiloniquia`,`Fragilidad ungueal → onicosquicia → coiloniquia`,`Coiloniquia → platoniquia → fragilidad ungueal con onicosquicia`,`Onicorrexis → onicomadesis → coiloniquia`],ans:1,exp:`Primero fragilidad y descamación en capas, luego aplanamiento y al final la uña cóncava.`,conf:'media'}
);

// Respiratorio: Banco histórico TeamMedic (Neumosemiología F3 2026). Sin repetir las del parcial 2022.
S.qs.push(
{id:'tmh-r01',src:'tmh',mod:'resp',tema:'Anatomía',stem:`En relación a las costillas del tórax podemos afirmar:`,
opts:[`Las 10 primeras se articulan a nivel vertebral dorsal`,`Las costillas 8, 9 y 10 se unen a los cartílagos costales que están encima`,`Las costillas 1 a 10 se articulan al esternón`,`Las costillas 1 a 9 son las verdaderas`],ans:1,exp:`8, 9 y 10 son falsas: se unen al cartílago de la costilla superior. Verdaderas son de la 1 a la 7, y las 12 se articulan con vértebras.`},
{id:'tmh-r02',src:'tmh',mod:'resp',tema:'Anatomía',stem:`El ángulo de Louis (unión manubrio-cuerpo esternal) señala, EXCEPTO:`,
opts:[`Punto inferior del vértice pulmonar`,`Contacto de ambas pleuras en el plano anterior`,`Bifurcación traqueal`,`Inserción del 2.º cartílago costal`,`El trayecto final de la cisura menor`],ans:4,exp:`La cisura menor corre a la altura de la 4.ª costilla derecha, no del ángulo de Louis (2.º cartílago, carina, contacto pleural anterior).`,conf:'media'},
{id:'tmh-r03',src:'tmh',mod:'resp',tema:'Anatomía',stem:`Es cierto respecto a las proyecciones pulmonares, EXCEPTO:`,
opts:[`La región mamaria derecha proyecta el lóbulo inferior derecho`,`La 3.ª-4.ª costal proyecta la cisura menor`,`La región mamaria izquierda proyecta la língula`,`Ambas fosas supraclaviculares contienen el ápex`],ans:0,exp:`La región mamaria derecha proyecta el lóbulo medio.`},
{id:'tmh-r04',src:'tmh',mod:'resp',tema:'Fisiología',stem:`La señal nerviosa a los músculos respiratorios no es una descarga instantánea: comienza débil y aumenta de manera continua. Este fenómeno se llama:`,
opts:[`Respiración intermitente`,`Reflejo de Hering-Breuer`,`Control ascendente-descendente`,`Señal en rampa inspiratoria`],ans:3,exp:`Señal en rampa (Guyton): permite un aumento gradual del volumen pulmonar.`},
{id:'tmh-r05',src:'tmh',mod:'resp',tema:'Fisiología',stem:`La excitación del centro respiratorio por el CO₂ es intensa en las primeras horas, pero disminuye en 1-2 días. Se debe a:`,
opts:[`Alcalosis metabólica compensatoria`,`El CO₂ estimula la hiperventilación y se pierde el estímulo`,`Saturación del centro respiratorio por CO₂`,`Reajuste renal de la concentración de H⁺ en la sangre circulante`],ans:3,exp:`Los riñones retienen bicarbonato y normalizan el pH, y el estímulo químico disminuye.`},
{id:'tmh-r06',src:'tmh',mod:'resp',tema:'Fisiología',stem:`Al evaluar a un paciente obeso encontrará las siguientes alteraciones, EXCEPTO:`,
opts:[`Disminución del trabajo respiratorio`,`Disminución de la capacidad residual funcional`,`Disminución de la distensibilidad de la pared torácica`,`Aumento del metabolismo basal`],ans:0,exp:`En la obesidad el trabajo respiratorio aumenta.`},
{id:'tmh-r07',src:'tmh',mod:'resp',tema:'Palpación',stem:`Si durante la palpación del tórax evidencia crépitos (crepitación) en la zona infraclavicular derecha, sospecharía:`,
opts:[`Neumonía`,`Hemotórax`,`Neumotórax`,`Derrame pleural`,`Atelectasia`],ans:2,exp:`La crepitación palpable es enfisema subcutáneo: aire fuera de la pleura (neumotórax, trauma).`},
{id:'tmh-r08',src:'tmh',mod:'resp',tema:'Signos',stem:`Paciente con neumotórax espontáneo y signo de Hamman (crujido sincrónico con el latido). ¿En qué posición es más audible?`,
opts:[`Decúbito lateral izquierdo, en espiración forzada`,`Sentado e inclinado, en apnea inspiratoria`,`Decúbito prono, sobre la apófisis de T4`,`Decúbito supino, en sístole, en el borde esternal izquierdo`],ans:0,exp:`El crujido de Hamman (aire en el mediastino) se oye sobre el precordio y se acentúa en decúbito lateral izquierdo.`,conf:'media'},
{id:'tmh-r09',src:'tmh',mod:'resp',tema:'Percusión',stem:`¿En qué condición podría estar contraindicada la percusión del tórax?`,
opts:[`Nunca hay contraindicación`,`Neumonía severa`,`Hemoptisis`,`Infarto agudo de miocardio`],ans:2,exp:`En la hemoptisis se evita percutir con fuerza porque puede reactivar el sangrado.`,conf:'media'},
{id:'tmh-r10',src:'tmh',mod:'resp',tema:'Percusión',stem:`La excursión diafragmática se mide con ___ y un valor de ___ es anormal, sospechoso de parálisis diafragmática:`,
opts:[`Auscultación - 2,5 cm`,`Palpación - 3 cm`,`Percusión - 2 cm`,`Auscultación - 1,5 cm`],ans:2,exp:`Se marca la matidez en espiración y en inspiración profunda. Lo normal son 4-6 cm (Argente); unos 2 cm es patológico.`,ref:'Argente 41 · PDF 685'},
{id:'tmh-r11',src:'tmh',mod:'resp',tema:'Enfisema',stem:`Fumador pesado con diámetro anteroposterior igual al transversal. A la percusión puede encontrar, EXCEPTO:`,
opts:[`Hipersonoridad`,`Descenso de las bases pulmonares`,`Aumento de la excursión diafragmática`,`Ausencia de matidez cardíaca`],ans:2,exp:`En el enfisema el diafragma está aplanado y desciende poco: la excursión disminuye.`},
{id:'tmh-r12',src:'tmh',mod:'resp',tema:'Ruidos normales',stem:`Ruido pulmonar normal que se oye en la mayoría de los campos, de tono bajo, espiraciones suaves y cortas, más prominente en delgados y niños, de mayor duración en inspiración:`,
opts:[`Murmullo vesicular`,`Traqueal`,`Broncovesicular`,`Bronquial`],ans:0,exp:`Murmullo vesicular: suave, grave, sobre todo inspiratorio.`},
{id:'tmh-r13',src:'tmh',mod:'resp',tema:'Ruidos normales',stem:`Ruido de intensidad suave, tono grave, cociente I:E 3:1, susurrante, en la mayor parte de la periferia pulmonar:`,
opts:[`Broncovesicular`,`Bronquial`,`Vesicular`,`Traqueal`],ans:2,exp:`Vesicular. El broncovesicular tiene I:E 1:1 y el bronquial predominio espiratorio.`},
{id:'tmh-r14',src:'tmh',mod:'resp',tema:'Ruidos normales',stem:`Ruido respiratorio normal sobre los bronquios principales, en el campo posterior superior derecho, de tono medio y con espiración igual a la inspiración:`,
opts:[`Traqueal`,`Murmullo vesicular`,`Broncovesicular`,`Bronquial`],ans:2,exp:`Broncovesicular: interescapular y 1.º-2.º EIC, sobre todo a la derecha.`,ref:'Argente 41 · PDF 690'},
{id:'tmh-r15',src:'tmh',mod:'resp',tema:'Puntos',stem:`Punto que permite describir adecuadamente el inicio apical de la tuberculosis pulmonar:`,
opts:[`Línea basal de Mouriquand`,`Zona de Chauvet`,`Punto de Guttmann`,`Punto de Stahelein`],ans:1,exp:`Zona de alarma de Chauvet, en el dorso entre C7-D1 y el trapecio.`},
{id:'tmh-r16',src:'tmh',mod:'resp',tema:'Puntos',stem:`Mujer de 39 años, personal de salud, con sudoración nocturna, pérdida de peso y tos con expectoración sanguinolenta; BAAR positivo. Sitio adecuado para describir por auscultación el comienzo apical de la tuberculosis:`,
opts:[`Punto de Guttmann`,`Zona de alarma de Chauvet`,`Espacio de Traube`,`Punto cisural de Stahelein`,`Punto hiliar de Monneret`],ans:1,exp:`Zona de alarma de Chauvet.`},
{id:'tmh-r17',src:'tmh',mod:'resp',tema:'Puntos',stem:`Punto que permite auscultar con precisión los sonidos asmáticos bronquiales con espiración prolongada:`,
opts:[`Línea basal de Mouriquand`,`Zona de Chauvet`,`Punto de Guttmann`,`Punto de Monneret`],ans:2,exp:`Punto de Guttmann: tercio interno de la fosa supraclavicular.`},
{id:'tmh-r18',src:'tmh',mod:'resp',tema:'Agregados',stem:`El frote pleural se caracteriza por lo siguiente, EXCEPTO:`,
opts:[`Está en relación con la respiración`,`No desaparece con la tos`,`Se palpa y se ausculta`,`Tiene traducción radiológica`],ans:3,exp:`El frote no se ve en la Rx; aparece en pleuritis seca, antes o después del derrame.`,ref:'Argente 41 · PDF 680'},
{id:'tmh-r19',src:'tmh',mod:'resp',tema:'Agregados',stem:`Ruido adventicio al final de la inspiración, que no desaparece con la tos, debido a edema pulmonar intersticial:`,
opts:[`Subcrepitante`,`Sibilante`,`Crepitante`,`Roncus`],ans:2,exp:`Crepitantes finos teleinspiratorios: apertura de alvéolos con líquido intersticial.`},
{id:'tmh-r20',src:'tmh',mod:'resp',tema:'Agregados',stem:`Ruido debido a moco y pus en los bronquiolos terminales o a tejido pulmonar en vías de desintegración:`,
opts:[`Subcrepitantes`,`Roncus`,`Sibilantes polifónicos`,`Crepitantes`],ans:0,exp:`Subcrepitantes (estertores húmedos de burbuja): aire atravesando secreciones.`},
{id:'tmh-r21',src:'tmh',mod:'resp',tema:'Condensación',stem:`Paciente de 46 años con fiebre, tos productiva y dolor pleurítico; soplo tubárico en la base derecha. ¿Mecanismo más probable?`,
opts:[`Paso de aire por un bronquio permeable rodeado de parénquima consolidado`,`Vibración de secreciones en bronquios de mediano calibre`,`Transmisión aumentada del ruido respiratorio a través de tejido condensado`,`Fricción entre pleuras inflamadas`],ans:0,exp:`Para que haya soplo tubárico la condensación debe llegar a la superficie y el bronquio debe estar permeable.`,ref:'Argente 41 · PDF 691'},
{id:'tmh-r22',src:'tmh',mod:'resp',tema:'Voz',stem:`Mientras ausculta, el paciente repite su dirección en voz susurrada y usted escucha con claridad todo lo que dice. Presenta:`,
opts:[`Pectoriloquia (áfona)`,`Broncofonía`,`Frote pleural`,`Soplo pleural`,`Egofonía`],ans:0,exp:`Entender la voz cuchicheada = pectoriloquia áfona, signo de condensación.`,ref:'Argente 41 · PDF 693'},
{id:'tmh-r23',src:'tmh',mod:'resp',tema:'Exploración',stem:`Respecto a la exploración del aparato respiratorio, es cierto:`,
opts:[`Las sibilancias son audibles especialmente en la inspiración`,`Los crepitantes se deben al burbujeo intrabronquial`,`La percusión de un neumotórax tiene tono hiperresonante`,`Los crepitantes se auscultan en la espiración`],ans:2,exp:`Las sibilancias predominan en espiración, los crepitantes son inspiratorios y por apertura alveolar.`},
{id:'tmh-r24',src:'tmh',mod:'resp',tema:'Trauma',stem:`Politraumatizado: FC 115, FR 30, PA 100/55. Expansión asimétrica, crepitación subcutánea izquierda, frémito disminuido bilateral con predominio izquierdo, timpanismo apical izquierdo y matidez en la base derecha; MV ausente a la izquierda y disminuido en la base derecha. Tráquea central. Diagnósticos:`,
opts:[`Consolidación derecha - derrame izquierdo`,`Obstrucción bronquial derecha - atelectasia derecha`,`Neumotórax izquierdo - hemotórax derecho`,`Derrame izquierdo - consolidación derecha`,`Neumotórax izquierdo - derrame derecho de gran volumen`],ans:2,exp:`Timpanismo + MV abolido + enfisema subcutáneo = neumotórax izquierdo; matidez basal con MV disminuido en un trauma = hemotórax derecho.`},
{id:'tmh-r25',src:'tmh',mod:'resp',tema:'Atelectasia',stem:`En relación a la atelectasia, es FALSO:`,
opts:[`Frémito aumentado`,`Desviación ipsilateral de la tráquea`,`Matidez`,`Estrechamiento de los EIC del lado afectado`],ans:0,exp:`Con el bronquio obstruido no se transmiten las vibraciones: frémito abolido.`},
{id:'tmh-r26',src:'tmh',mod:'resp',tema:'Derrame pleural',stem:`¿Qué hallazgo NO corresponde a un derrame pleural mayor de 2000 mL?`,
opts:[`Desplazamiento contralateral de la tráquea`,`Egofonía y pectoriloquia áfona por encima del derrame`,`Matidez`,`Vibraciones vocales aumentadas`],ans:3,exp:`El líquido aísla: las vibraciones están abolidas.`},
{id:'tmh-r27',src:'tmh',mod:'resp',tema:'Condensación',stem:`¿Qué hallazgo NO corresponde al síndrome de condensación pulmonar?`,
opts:[`Crepitantes`,`Frémito vocal disminuido`,`Egofonía`,`Pectoriloquia áfona`],ans:1,exp:`En la condensación el frémito aumenta.`},
{id:'tmh-r28',src:'tmh',mod:'resp',tema:'Neumotórax',stem:`Mujer de 57 años con EPOC, acceso de tos seguido de dolor punzante en hemitórax derecho y gran dificultad respiratoria. Tráquea desviada a la izquierda; en el hemitórax derecho: amplexación disminuida, vibraciones y MV abolidos, hipersonoridad. Hipótesis:`,
opts:[`Neumonía con derrame derecho`,`Síndrome coronario agudo`,`Hernia diafragmática`,`Neumotórax secundario`],ans:3,exp:`Hipersonoridad con todo abolido y tráquea al lado opuesto en un EPOC = neumotórax secundario (rotura de bulas).`},
{id:'tmh-r29',src:'tmh',mod:'resp',tema:'Vibraciones',stem:`El frémito vocal se encuentra incrementado en:`,
opts:[`Atelectasia`,`Neumotórax`,`Derrame pleural`,`Síndrome de condensación`,`Asma bronquial`],ans:3,exp:`Solo en la condensación con bronquio permeable.`},
{id:'tmh-r30',src:'tmh',mod:'resp',tema:'Atelectasia',stem:`Paciente de 55 años con atelectasia por obstrucción tumoral del bronquio principal derecho. ¿Percusión y posición de la tráquea?`,
opts:[`Timpanismo y tráquea contralateral`,`Matidez y tráquea central`,`Matidez y tráquea ipsilateral`,`Matidez y tráquea contralateral`],ans:2,exp:`El pulmón colapsado tira del mediastino hacia su lado.`},
{id:'tmh-r31',src:'tmh',mod:'resp',tema:'Neumotórax',stem:`Varón de 36 años con neumonía por SARS-CoV-2 a quien se intentó varias veces colocar un catéter en la subclavia derecha; luego empeora la disnea. ¿Qué hallazgo tendría la nueva entidad?`,
opts:[`Abolición del frémito y del MV, hiperresonancia en hemitórax derecho`,`Abolición del frémito, disminución del MV y timpanismo en hemitórax derecho`,`Abolición del frémito y del MV, timpanismo en hemitórax derecho`,`MV disminuido en ambas bases, matidez bibasal y pectoriloquia áfona`],ans:0,exp:`Neumotórax iatrogénico: frémito y MV abolidos con hiperresonancia (la tabla del banco usa "hiperresonancia"). La c también describe un neumotórax; si sale en el examen, prefiere la que diga hiperresonancia.`,conf:'media'},
{id:'tmh-r32',src:'tmh',mod:'resp',tema:'Condensación',stem:`Paciente de 35 años con fiebre, tos con expectoración herrumbrosa y dolor torácico brusco; submatidez y soplo tubárico. Es un síndrome:`,
opts:[`Intersticial`,`Obstructivo`,`Parenquimal`,`Atelectásico`],ans:2,exp:`Neumonía neumocócica clásica: síndrome parenquimatoso de condensación.`},
{id:'tmh-r33',src:'tmh',mod:'resp',tema:'Derrame pleural',stem:`Tuberculosis pleural con derrame en los 2/3 inferiores del hemitórax derecho. Asociación de hallazgos frecuente:`,
opts:[`MV normal + vibraciones normales + percusión mate`,`MV abolido + vibraciones abolidas + percusión mate`,`Estertores + vibraciones aumentadas + percusión mate`,`MV disminuido + vibraciones disminuidas + percusión mate`],ans:1,exp:`Un derrame de 2/3 del hemitórax es grande: abolición de MV y vibraciones con matidez.`},
{id:'tmh-r34',src:'tmh',mod:'resp',tema:'Atelectasia',stem:`Varón de 75 años, fumador, con disnea progresiva. MV abolido en los 2/3 superiores del hemitórax izquierdo, menor resonancia, frémito ausente y tráquea desviada a la izquierda. Diagnóstico:`,
opts:[`Neumonía bacteriana`,`Neumonía viral`,`Atelectasia`,`Derrame pleural`,`Neumotórax`],ans:2,exp:`Matidez con todo abolido y tráquea hacia el lado enfermo = atelectasia (en un fumador, piensa en tumor obstructivo).`},
{id:'tmh-r35',src:'tmh',mod:'resp',tema:'Neumotórax',stem:`Varón de 22 años, soldado, con tos y dolor agudo infraaxilar derecho durante atletismo; Rx con neumotórax espontáneo primario. ¿Qué características encontraría?`,
opts:[`MV disminuido, egofonía, matidez en 2/3 inferiores`,`Vibraciones disminuidas en 2/3, matidez y silencio auscultatorio`,`Roncantes y MV disminuido en 2/3 inferiores`,`Ausencia de frémito, timpanismo, ausencia de MV en hemitórax derecho y tráquea desviada al lado contralateral`],ans:3,exp:`Patrón completo de neumotórax.`},

{id:'tmh-r37',src:'tmh',mod:'resp',tema:'Atelectasia',stem:`Mujer de 48 años, tras UCI por COVID-19, con traqueostomía y secreciones densas; taquipnea y SatO₂ 90%, sin fiebre, leucocitos normales. Amplexación disminuida en la base derecha, matidez, escasas sibilancias y MV disminuido en el tercio inferior derecho. Diagnóstico:`,
opts:[`Tromboembolia pulmonar`,`Atelectasia`,`Neumonía intrahospitalaria`,`Neumotórax espontáneo`],ans:1,exp:`Tapón de moco sin fiebre ni leucocitosis: atelectasia.`},
{id:'tmh-r38',src:'tmh',mod:'resp',tema:'Fisiología',stem:`Paciente con neumonía por SARS-CoV-2, PaO₂ 58 y PaCO₂ 26 mmHg. Los valores bajos de CO₂ se deben a:`,
opts:[`Daño celular por disfunción orgánica`,`Hiperventilación`,`Mayor difusión del CO₂ que del O₂`,`Compensación de acidosis metabólica por sepsis`],ans:1,exp:`La hipoxemia estimula la ventilación y se elimina más CO₂.`},

opts:[`Hemotórax`,`Taponamiento cardíaco`,`Contusión pulmonar`,`Neumotórax`],ans:0,exp:`Trauma con shock hipovolémico y abolición de MV y vibraciones: hemotórax (sería mate a la percusión). En el taponamiento los ruidos estarían apagados.`}
);

</script>
<script>
(function(){
  const S = window.SEMIO;
  const KEY = 'semio-parcial-v1';
  let store = {a:{}, view:'inicio', sub:{}, sim:null};
  try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); if(o && o.a) store = Object.assign(store,o); } }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  const $ = (s,el=document)=>el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const L = 'abcde';
  const SRC = {p22:'Parcial 2022-02', bio:'Banco Bioeasy', tm:'Banco TeamMedic', tmh:'Histórico TeamMedic', bgc:'Repaso Bioeasy (Cáceres)', cl:'Práctica (Argente)'};

  // Cuenta regresiva: jueves 22 oct 2026, 15:00 Lima (UTC-5)
  function countdown(){
    const exam = Date.UTC(2026,9,22,20,0,0);
    const ms = exam - Date.now();
    const el = $('#count');
    if(ms<=0){ el.innerHTML = 'Parcial: <b>jue 22 oct, 3:00 pm</b>'; return; }
    const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
    el.innerHTML = 'Jue 22 oct · 3:00 pm · faltan <b>'+d+' d '+h+' h '+m+' min</b>';
  }
  countdown(); setInterval(countdown, 30000);

  function qsOf(modId){ return S.qs.filter(q=> modId==='p22' ? q.src==='p22' : q.mod===modId); }
  function stats(list){ let a=0,c=0; list.forEach(q=>{ const v=store.a[q.id]; if(v!==undefined){a++; if(v===q.ans)c++;} }); return {a,c,n:list.length}; }

  function nav(){
    const tabs = [{id:'inicio',short:'Inicio'},{id:'sim',short:'Simulacro'}].concat(S.mods.map(m=>({id:m.id,short:m.short,n:qsOf(m.id).length}))).concat([{id:'p22',short:'Parcial 2022',n:qsOf('p22').length}]);
    $('#nav').innerHTML = tabs.map(t=>'<button role="tab" data-v="'+t.id+'" aria-selected="'+(store.view===t.id)+'">'+esc(t.short)+(t.n?'<span class="n">'+t.n+'</span>':'')+'</button>').join('');
  }
  $('#nav').addEventListener('click', e=>{ const b=e.target.closest('button[data-v]'); if(!b) return; store.view=b.dataset.v; save(); render(); window.scrollTo({top:0}); b.scrollIntoView({inline:'nearest',block:'nearest'}); });

  function fono(type){
    // mini fonocardiograma: S1 en x=20, S2 en x=150, siguiente S1 en x=280
    const W=300,H=70,base=50;
    const snd = x=>'<line class="snd" x1="'+x+'" y1="'+(base-30)+'" x2="'+x+'" y2="'+base+'" stroke-width="3"/>';
    const sm = x=>'<line class="snd" x1="'+x+'" y1="'+(base-14)+'" x2="'+x+'" y2="'+base+'" stroke-width="2"/>';
    let mur='', extra='', lab='';
    const P = d=>'<path class="mur" d="'+d+'"/>';
    switch(type){
      case 'eyectivo': mur=P('M34 '+base+' L85 '+(base-24)+' L136 '+base+' Z'); lab='romboidal (crescendo-decrescendo)'; break;
      case 'eyectivo-tardio': mur=P('M34 '+base+' L112 '+(base-26)+' L146 '+base+' Z'); lab='acmé tardío = más grave'; break;
      case 'holo': mur=P('M22 '+base+' L22 '+(base-18)+' L148 '+(base-18)+' L148 '+base+' Z'); lab='holosistólico en barra'; break;
      case 'tele': mur=P('M95 '+base+' L148 '+(base-20)+' L148 '+base+' Z'); extra=sm(88); lab='clic meso + soplo telesistólico'; break;
      case 'proto': mur=P('M152 '+(base-22)+' L152 '+base+' L255 '+base+' Z'); lab='protodiastólico decreciente'; break;
      case 'rodada': extra=sm(176); mur=P('M180 '+(base-14)+' L180 '+base+' L238 '+base+' L238 '+(base-5)+' Z')+P('M240 '+base+' L278 '+(base-16)+' L278 '+base+' Z'); lab='chasquido + rodada + refuerzo presistólico'; break;
      case 'continuo': mur=P('M22 '+base+' L150 '+(base-26)+' L278 '+base+' Z'); lab='continuo "en maquinaria", pico en S2'; break;
    }
    return '<svg class="fono" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lab)+'"><line class="ax" x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'"/>'+mur+snd(20)+snd(150)+snd(280)+extra+'<text x="14" y="64">S1</text><text x="144" y="64">S2</text><text x="274" y="64">S1</text><text x="0" y="10">'+esc(lab)+'</text></svg>';
  }

  function inicio(){
    const M = S.mods;
    const tot = stats(S.qs);
    let h = '<div class="bankbar"><button class="btn primary" data-go="sim">Hacer un simulacro de 50</button></div><h2>Plan al jueves</h2><p class="lede">Parcial de la Unidad 1 (semanas 1 a 7), ficha óptica, casi todo en casos clínicos. Vale 30% y no tiene sustitutorio. La guía de cada módulo sale del Argente; los bancos, de exámenes y repasos reales.</p>';
    h += '<div class="plan">'+S.plan.map(p=>'<div class="d"><b>'+esc(p[0])+'</b><span>'+p[1]+'</span></div>').join('')+'</div>';
    h += '<h3>Cuánto vino cada semana en el parcial 2026-10</h3><p class="lede">41 preguntas en total (dato de Bioeasy Galenos). Estudia en ese orden.</p><div class="bars">';
    const mx = Math.max.apply(null, S.peso.map(x=>x[1]));
    h += S.peso.map(x=>'<div class="bar"><span>'+esc(x[0])+'</span><span class="t"><i style="width:'+(x[1]/mx*100)+'%"></i></span><span class="v">'+x[1]+'</span></div>').join('')+'</div>';
    h += '<h3>Tu avance</h3><div class="prog">';
    h += M.map(m=>{ const s=stats(qsOf(m.id)); return '<div class="row"><span>'+esc(m.name)+(m.ready?'':' <span class="tag">guía en preparación</span>')+'</span><span>'+s.c+'/'+s.a+' bien · '+s.n+' preguntas</span></div>'; }).join('');
    const sp = stats(qsOf('p22'));
    h += '<div class="row"><span>Parcial 2022-02 completo</span><span>'+sp.c+'/'+sp.a+' bien · '+sp.n+' preguntas</span></div>';
    h += '</div><p class="ref" style="margin-top:14px">Las respuestas de los bancos no venían con clave: están resueltas con el Argente 3.ª ed. Cuando una clave es discutible se marca "confianza media".</p>';
    return h;
  }


  // ---------- SIMULACRO ----------
  const PESO_MOD = ['resp','cardio','neuro','abd','piel','om','hc']; // mismo orden que S.peso
  const SIM_N = 50, SIM_MIN = 100;
  const MODNAME = {}; S.mods.forEach(m=>MODNAME[m.id]=m.short);
  const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const norm = t=>String(t).replace(/<[^>]*>/g,' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  function pool(){
    const seen = new Set(), out = [];
    shuffle(S.qs).forEach(q=>{ const k = norm(q.stem).slice(0,30)+'|'+norm(q.opts[q.ans]); if(seen.has(k)) return; seen.add(k); out.push(q); });
    return out;
  }
  function quotas(){
    const tot = S.peso.reduce((a,x)=>a+x[1],0);
    const raw = S.peso.map(x=>x[1]/tot*SIM_N), q = raw.map(Math.floor);
    let rest = SIM_N - q.reduce((a,b)=>a+b,0);
    raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).slice(0,rest).forEach(x=>q[x[1]]++);
    const o = {}; PESO_MOD.forEach((m,i)=>o[m]=q[i]); return o;
  }
  function buildSim(mode){
    const P = pool();
    if(mode==='azar') return P.slice(0,SIM_N).map(q=>q.id);
    const Q = quotas(), chosen = [], used = new Set();
    PESO_MOD.forEach(m=>{
      let c = P.filter(q=>q.mod===m);
      if(mode==='fijas') c = c.filter(q=>q.fija).concat(c.filter(q=>!q.fija));
      c.slice(0,Q[m]).forEach(q=>{ chosen.push(q); used.add(q.id); });
    });
    // si algun modulo tiene menos preguntas que su cuota, se completa al azar
    shuffle(P.filter(q=>!used.has(q.id))).slice(0,SIM_N-chosen.length).forEach(q=>chosen.push(q));
    return shuffle(chosen).map(q=>q.id);
  }
  function startSim(mode){
    store.sim = {ids:buildSim(mode), a:{}, mode:mode, start:Date.now(), done:false, end:null};
    save(); render(); window.scrollTo({top:0});
  }
  const MODELBL = {azar:'Al azar (de todo el banco)', peso:'Según lo que más cae', fijas:'Según lo que más cae, con fijas primero'};
  function simElapsed(){ const s=store.sim; return Math.max(0,(s.done?s.end:Date.now())-s.start); }
  function fmt(ms){ const t=Math.max(0,Math.floor(ms/1000)); const m=Math.floor(t/60), s=t%60; return m+':'+(s<10?'0':'')+s; }
  function finishSim(){ const s=store.sim; if(!s||s.done) return; s.done=true; s.end=Date.now(); save(); render(); window.scrollTo({top:0}); }
  function simLeft(){ return SIM_MIN*60000 - simElapsed(); }
  function simTick(){
    const s=store.sim; if(store.view!=='sim'||!s||s.done) return;
    if(simLeft()<=0){ finishSim(); return; }
    const el=document.getElementById('simtime'); if(el) el.textContent=fmt(simLeft());
  }
  setInterval(simTick,1000);

  function simView(){
    const s = store.sim;
    if(!s){
      const Q = quotas();
      let h = '<h2>Simulacro</h2><p class="lede">'+SIM_N+' preguntas, '+SIM_MIN+' minutos (2 por pregunta, como el parcial). No muestra el tema ni dice si vas bien: ves todo al terminar. Las preguntas repetidas entre bancos se cuentan una sola vez.</p>';
      h += '<div class="modes">'+
        '<button class="mode" data-sim="azar"><b>Al azar</b><span>'+SIM_N+' preguntas de cualquier tema, sin ningún criterio.</span></button>'+
        '<button class="mode" data-sim="peso"><b>Según lo que más cae</b><span>Reparte las '+SIM_N+' como en el parcial 2026-10: '+PESO_MOD.map(m=>MODNAME[m]+' '+Q[m]).join(', ')+'.</span></button>'+
        '<button class="mode" data-sim="fijas"><b>Lo que más cae, con fijas primero</b><span>Igual que la anterior, pero dentro de cada tema prioriza las preguntas marcadas como fijas.</span></button></div>';
      h += '<p class="note">Banco disponible: '+pool().length+' preguntas distintas. Cuando agregues más bancos entran solas al simulacro.</p>';
      return h;
    }
    const qs = s.ids.map(id=>S.qs.find(q=>q.id===id)).filter(Boolean);
    if(!s.done){
      const n = Object.keys(s.a).length;
      let h = '<h2>Simulacro en curso</h2><p class="lede">'+esc(MODELBL[s.mode])+'. Marca una opción por pregunta; puedes cambiarla hasta terminar.</p>';
      h += qs.map((q,i)=>{
        const v = s.a[q.id];
        let x = '<article class="q" id="sq-'+q.id+'"><div class="qh"><span class="qn">'+(i+1)+' / '+qs.length+'</span></div><p class="stem">'+q.stem+'</p><div class="opts">';
        x += q.opts.map((o,j)=>'<button class="opt'+(v===j?' sel':'')+'" data-sq="'+q.id+'" data-i="'+j+'"><span class="l">'+L[j]+'</span><span>'+o+'</span></button>').join('');
        return x+'</div></article>';
      }).join('');
      h += '<div class="simbar"><div class="in"><span class="t">Quedan <b id="simtime">'+fmt(simLeft())+'</b> · respondidas <b id="simn">'+n+'</b>/'+qs.length+'</span><span><button class="btn" data-simquit="1">Abandonar</button> <button class="btn primary" data-simend="1">Terminar</button></span></div></div>';
      return h;
    }
    // resultados
    let c=0; const byMod={};
    qs.forEach(q=>{ const ok = s.a[q.id]===q.ans; if(ok)c++; const m=byMod[q.mod]||(byMod[q.mod]={c:0,n:0}); m.n++; if(ok)m.c++; });
    const pct = Math.round(c/qs.length*100);
    let h = '<h2>Resultado del simulacro</h2><p class="lede">'+esc(MODELBL[s.mode])+' · tiempo usado '+fmt(simElapsed())+'.</p>';
    h += '<div class="big">'+c+'<small> / '+qs.length+' · '+pct+'%</small></div><p class="note">Sin responder: '+qs.filter(q=>s.a[q.id]===undefined).length+'</p>';
    h += '<h3>Por tema</h3><div class="bars">'+Object.keys(byMod).sort((a,b)=>byMod[b].n-byMod[a].n).map(m=>{ const x=byMod[m]; return '<div class="bar"><span>'+esc(MODNAME[m]||m)+'</span><span class="t"><i style="width:'+(x.c/x.n*100)+'%"></i></span><span class="v">'+x.c+'/'+x.n+'</span></div>'; }).join('')+'</div>';
    h += '<div class="bankbar"><button class="btn primary" data-simnew="1">Nuevo simulacro</button></div>';
    const wrong = qs.filter(q=>s.a[q.id]!==q.ans);
    h += '<h3>Para repasar ('+wrong.length+')</h3>';
    if(!wrong.length) h += '<div class="empty">Sin errores. Buen simulacro.</div>';
    h += wrong.map(q=>qHTML(q,{v:(s.a[q.id]===undefined?null:s.a[q.id]), hideMeta:false})).join('');
    return h;
  }

  function bankHTML(list, ctx){
    const f = (store.sub[ctx+'_f'])||'all';
    const srcs = [...new Set(list.map(q=>q.src))];
    let chips = [['all','Todas',list.length]].concat(srcs.map(s=>[s,SRC[s],list.filter(q=>q.src===s).length]));
    chips.push(['wrong','Falladas',list.filter(q=>store.a[q.id]!==undefined && store.a[q.id]!==q.ans).length]);
    chips.push(['new','Sin responder',list.filter(q=>store.a[q.id]===undefined).length]);
    let shown = list.filter(q=> f==='all' ? true : f==='wrong' ? (store.a[q.id]!==undefined && store.a[q.id]!==q.ans) : f==='new' ? store.a[q.id]===undefined : q.src===f);
    const s = stats(list);
    let h = '<div class="sub" data-ctx="'+ctx+'">'+chips.map(c=>'<button class="chip" data-f="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+esc(c[1])+'<small>'+c[2]+'</small></button>').join('')+'</div>';
    h += '<div class="bankbar"><span class="score">Respondidas <b>'+s.a+'</b>/'+s.n+' · correctas <b>'+s.c+'</b>'+(s.a?' ('+Math.round(s.c/s.a*100)+'%)':'')+'</span><button class="btn" data-reset="'+ctx+'">Reiniciar respuestas</button></div>';
    h += '<div class="meter"><i style="width:'+(s.n?s.a/s.n*100:0)+'%"></i></div>';
    if(!shown.length) h += '<div class="empty">No hay preguntas con este filtro.</div>';
    h += shown.map(q=>qHTML(q, ctx)).join('');
    return h;
  }
  function qHTML(q, o){
    o = (o && typeof o==='object') ? o : {};
    const v = ('v' in o) ? o.v : store.a[q.id];
    const done = v!==undefined;
    let h = '<article class="q" id="q-'+q.id+'">'+(o.hideMeta?(o.num?'<div class="qh"><span class="qn">'+o.num+'</span></div>':''):'<div class="qh"><span class="tag '+(q.src==='p22'?'p22':'')+'">'+esc(SRC[q.src]||q.src)+(q.num?' · '+esc(q.num):'')+'</span>'+(q.fija?'<span class="tag fija">fija</span>':'')+'</div>');
    h += '<p class="stem">'+q.stem+'</p><div class="opts">';
    h += q.opts.map((o,i)=>{ let c=''; if(done){ if(i===q.ans)c=' correct'; else if(i===v)c=' wrong'; } return '<button class="opt'+c+'" data-q="'+q.id+'" data-i="'+i+'"'+(done?' disabled':'')+'><span class="l">'+L[i]+'</span><span>'+o+'</span></button>'; }).join('');
    h += '</div>';
    if(done){
      h += '<div class="exp"><span class="verdict '+(v===q.ans?'ok':'bad')+'">'+(v===q.ans?'Correcto.':'Era la '+L[q.ans]+'.')+'</span> '+q.exp+(q.tema?' <span class="ref">Tema: '+esc(q.tema)+'.</span>':'')+(q.ref?' <span class="ref">'+esc(q.ref)+'</span>':'')+(q.conf?' <span class="conf">confianza '+esc(q.conf)+'</span>':'')+'</div>';
    }
    return h+'</article>';
  }

  function modView(m){
    const sub = store.sub[m.id] || (m.ready?'guia':'banco');
    const qs = qsOf(m.id);
    let h = '<h2>'+esc(m.name)+'</h2><p class="lede">'+m.lede+'</p>';
    h += '<div class="sub" role="tablist"><button class="chip" data-sub="guia" aria-pressed="'+(sub==='guia')+'">Guía</button><button class="chip" data-sub="banco" aria-pressed="'+(sub==='banco')+'">Banco<small>'+qs.length+'</small></button></div>';
    if(sub==='guia'){
      if(!m.ready){ h += '<div class="box warn">La guía de este módulo está en preparación. Mientras tanto, ya puedes practicar su banco.</div>'; }
      else { h += '<div class="guide">'+m.guide+'</div>'; }
    } else { h += bankHTML(qs, m.id); }
    return h;
  }

  function render(){
    nav();
    const v = store.view;
    let h='';
    if(v==='inicio') h = inicio();
    else if(v==='sim') h = simView();
    else if(v==='p22') h = '<h2>Parcial 2022-02</h2><p class="lede">El examen real de noviembre de 2022, 50 preguntas en su orden original. Resuélvelo como simulacro: unos 2 minutos por pregunta.</p>'+bankHTML(qsOf('p22'),'p22');
    else { const m = S.mods.find(x=>x.id===v); h = m ? modView(m) : inicio(); }
    const main = $('#main'); main.innerHTML = h;
    main.querySelectorAll('[data-fono]').forEach(el=>{ el.outerHTML = fono(el.dataset.fono); });
    const toc = main.querySelector('.guide');
    if(toc){
      const secs = [...toc.querySelectorAll('section[id]')];
      if(secs.length){ const t=document.createElement('div'); t.className='toc'; t.innerHTML=secs.map(s=>'<button data-to="'+s.id+'">'+esc(s.dataset.t||s.id)+'</button>').join(''); toc.prepend(t); }
    }
  }

  document.addEventListener('click', e=>{
    const o = e.target.closest('.opt[data-q]');
    if(o && !o.disabled){ const id=o.dataset.q, i=+o.dataset.i; store.a[id]=i; save(); const q=S.qs.find(x=>x.id===id); const art=document.getElementById('q-'+id); if(art){ const tmp=document.createElement('div'); tmp.innerHTML=qHTML(q); art.replaceWith(tmp.firstChild); } updateScore(); return; }
    const so = e.target.closest('.opt[data-sq]');
    if(so && store.sim && !store.sim.done){ const id=so.dataset.sq, i=+so.dataset.i; store.sim.a[id]=i; save(); document.querySelectorAll('#sq-'+id+' .opt').forEach(b=>b.classList.toggle('sel', +b.dataset.i===i)); const nn=document.getElementById('simn'); if(nn) nn.textContent=Object.keys(store.sim.a).length; return; }
    const sg = e.target.closest('[data-sim]');
    if(sg){ startSim(sg.dataset.sim); return; }
    if(e.target.closest('[data-simend]')){ const n=store.sim?Object.keys(store.sim.a).length:0, t=store.sim?store.sim.ids.length:0; if(n<t && !confirm('Te faltan '+(t-n)+' preguntas por responder. ¿Terminar igual?')) return; finishSim(); return; }
    if(e.target.closest('[data-simquit]')){ if(confirm('¿Abandonar el simulacro? Se pierde el avance.')){ store.sim=null; save(); render(); window.scrollTo({top:0}); } return; }
    if(e.target.closest('[data-simnew]')){ store.sim=null; save(); render(); window.scrollTo({top:0}); return; }
    const go = e.target.closest('[data-go]');
    if(go){ store.view=go.dataset.go; save(); render(); window.scrollTo({top:0}); return; }
    const sb = e.target.closest('[data-sub]');
    if(sb){ store.sub[store.view]=sb.dataset.sub; save(); render(); return; }
    const fc = e.target.closest('.sub[data-ctx] .chip');
    if(fc){ const ctx=fc.parentElement.dataset.ctx; store.sub[ctx+'_f']=fc.dataset.f; save(); render(); return; }
    const rs = e.target.closest('[data-reset]');
    if(rs){ const ctx=rs.dataset.reset; if(rs.dataset.armed){ qsOf(ctx).forEach(q=>delete store.a[q.id]); save(); render(); } else { rs.dataset.armed='1'; rs.textContent='Toca otra vez para borrar'; rs.classList.add('primary'); setTimeout(()=>{ if(rs.isConnected){ delete rs.dataset.armed; rs.textContent='Reiniciar respuestas'; rs.classList.remove('primary'); } },3000); } return; }
    const to = e.target.closest('[data-to]');
    if(to){ const s=document.getElementById(to.dataset.to); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); }
  });
  function updateScore(){
    const v=store.view; if(v==='sim'||v==='inicio') return; const list = v==='p22'?qsOf('p22'):qsOf(v);
    const s=stats(list); const sc=document.querySelector('.score'); if(sc) sc.innerHTML='Respondidas <b>'+s.a+'</b>/'+s.n+' · correctas <b>'+s.c+'</b>'+(s.a?' ('+Math.round(s.c/s.a*100)+'%)':'');
    const m=document.querySelector('.meter i'); if(m) m.style.width=(s.n?s.a/s.n*100:0)+'%';
  }
  render();
})();
</script>

</body></html>
